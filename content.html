<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#CC0212"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-32.png"><link rel="apple-touch-icon" href="icon-180.png">
<title>برد تولید محتوای سوسیسا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app shell. Desktop = right sidebar nav + content; phone = bottom tab bar. Item opens in a wide side sheet (full-screen on phone). Palette = main Susisa board. */
:root{
  --bg:#FFF6E8; --card:#FFFFFF; --card2:#FFF1DC; --card3:#FBE6C8; --ink:#22140F; --mute:#7C6658; --line:#EEDDC6;
  --red:#CC0212; --red2:#A30010; --redsoft:#FCE3DF; --onred:#FFFFFF;
  --ok:#1F7A4D; --oksoft:#DDF1E5; --warn:#A86200; --warnsoft:#FCEBCB; --info:#2F5D8A; --infosoft:#DFEAF5;
  --reel:#CC0212; --post:#22140F; --onpost:#FFF6E8; --story:#7B3FA8; --storysoft:#EFE3F7;
  --canvasbg:#FFFFFF;
  --sh:0 1px 2px rgba(60,20,0,.07),0 8px 20px -14px rgba(60,20,0,.45);
  --sh2:0 2px 6px rgba(60,20,0,.08),0 24px 48px -24px rgba(60,20,0,.55);
  --f-display:"Lalezar","Vazirmatn",Tahoma,sans-serif;
  --f-body:"Vazirmatn",Tahoma,"DejaVu Sans",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15100E; --card:#1F1815; --card2:#2A201B; --card3:#33271F; --ink:#F7ECE2; --mute:#AD988A; --line:#3A2C24;
  --red:#FF3B47; --red2:#FF6B74; --redsoft:#3A1A1A; --onred:#1A0505;
  --ok:#5CC98E; --oksoft:#16301F; --warn:#F0B04D; --warnsoft:#3A2A10; --info:#7FB3E8; --infosoft:#162636;
  --reel:#FF3B47; --post:#F7ECE2; --onpost:#15100E; --story:#C79BEA; --storysoft:#2D2036; --canvasbg:#FFFFFF;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 24px -16px rgba(0,0,0,.8); --sh2:0 2px 6px rgba(0,0,0,.4),0 24px 48px -20px rgba(0,0,0,.9); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#15100E; --card:#1F1815; --card2:#2A201B; --card3:#33271F; --ink:#F7ECE2; --mute:#AD988A; --line:#3A2C24;
  --red:#FF3B47; --red2:#FF6B74; --redsoft:#3A1A1A; --onred:#1A0505;
  --ok:#5CC98E; --oksoft:#16301F; --warn:#F0B04D; --warnsoft:#3A2A10; --info:#7FB3E8; --infosoft:#162636;
  --reel:#FF3B47; --post:#F7ECE2; --onpost:#15100E; --story:#C79BEA; --storysoft:#2D2036; --canvasbg:#FFFFFF;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 24px -16px rgba(0,0,0,.8); --sh2:0 2px 6px rgba(0,0,0,.4),0 24px 48px -20px rgba(0,0,0,.9); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.75 var(--f-body);direction:rtl;margin:0;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;border-left:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:4px;padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.brand{font:400 30px/1 var(--f-display);color:var(--red);letter-spacing:.5px;padding:2px 8px 10px}
.brand small{display:block;font:600 11.5px/1.5 var(--f-body);color:var(--mute);letter-spacing:0;margin-top:4px}
.nav{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:11px;padding:9px 10px;font-weight:700;color:var(--mute);text-align:right;width:100%}
.nav svg{width:19px;height:19px;flex:none}
.nav:hover{background:var(--card2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--red);color:var(--onred)}
.nav .badge{margin-inline-start:auto;background:var(--redsoft);color:var(--red);border-radius:99px;font-size:11px;padding:0 7px}
.nav[aria-current="page"] .badge{background:var(--onred);color:var(--red)}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mute)}
.content{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tb h1{font:400 24px/1.2 var(--f-display);margin:0}
.grow{flex:1}
.save{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--card2);color:var(--mute);white-space:nowrap}
.save.ok{background:var(--oksoft);color:var(--ok)}.save.busy{background:var(--warnsoft);color:var(--warn)}.save.err{background:var(--redsoft);color:var(--red)}
main{padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.bnav{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}.side{display:none}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));gap:2px;justify-content:space-around;box-shadow:0 -8px 24px -18px rgba(0,0,0,.5)}
  .bnav .nav{flex-direction:column;gap:1px;font-size:10.5px;padding:5px 2px;width:auto;flex:1;align-items:center;text-align:center}
  .bnav .nav .badge{display:none}
  .tb h1{font-size:20px}
}
select,input[type=text],input[type=search],input[type=number],input[type=url],textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0;width:100%}
input[type=search]{width:auto;min-width:160px}
select{width:auto;max-width:100%}
textarea{resize:vertical;min-height:84px;line-height:1.9}
input[type=checkbox]{width:19px;height:19px;accent-color:var(--red);flex:none;margin:0}
input[data-date]{cursor:pointer;font-variant-numeric:tabular-nums;max-width:150px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 13px;font-weight:700;box-shadow:var(--sh);white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--red);border-color:var(--red);color:var(--onred)}
.btn.ghost{box-shadow:none;background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--card2)}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn.xs{padding:1px 7px;font-size:12px;border-radius:7px;box-shadow:none}
.btn.danger{color:var(--red)}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:16px;height:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:5px 12px;font-weight:700;font-size:12.5px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.view[hidden]{display:none}
h2.sec{font:400 21px/1.3 var(--f-display);margin:22px 0 10px;text-wrap:balance}
h2.sec:first-child{margin-top:2px}
h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--mute)}.small{font-size:12px}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warnsoft);color:var(--warn);border-radius:12px;padding:9px 13px;margin-bottom:12px;font-weight:600}
.banner.info{background:var(--infosoft);color:var(--info)}.banner.err{background:var(--redsoft);color:var(--red)}
.grid{display:grid;gap:12px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--sh)}
.tile b{display:block;font:400 32px/1.1 var(--f-display);color:var(--red);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--mute);font-weight:600}
.cols2{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--sh);min-width:0}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 9px;border-radius:10px;background:var(--card2);min-width:0}
.row .t{flex:1;min-width:140px}
.empty{color:var(--mute);font-size:13px;padding:8px 2px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:700;white-space:nowrap;border:1px solid transparent;line-height:1.7}
.chip.reel{background:var(--reel);color:var(--onred)}.chip.post{background:var(--post);color:var(--onpost)}.chip.story{background:var(--storysoft);color:var(--story)}
.chip.st{background:var(--card2);color:var(--mute);border-color:var(--line)}
.chip.ap-draft{background:var(--card2);color:var(--mute)}.chip.ap-review{background:var(--warnsoft);color:var(--warn)}.chip.ap-ok{background:var(--oksoft);color:var(--ok)}.chip.ap-fix{background:var(--redsoft);color:var(--red)}
.chip.late{background:var(--redsoft);color:var(--red)}.chip.ev{background:var(--red);color:var(--onred)}.chip.done{background:var(--oksoft);color:var(--ok)}.chip.warn{background:var(--warnsoft);color:var(--warn)}.chip.tag{background:var(--infosoft);color:var(--info)}
.link{background:none;border:0;padding:0;color:inherit;text-align:right;font-weight:700;cursor:pointer}
.link:hover{color:var(--red)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar label.ck{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
/* calendar */
.calhead,.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.calhead div{font-size:12px;color:var(--mute);font-weight:700;text-align:center}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:124px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.day.pad{background:transparent;border-style:dashed;opacity:.35}
.day.out{opacity:.55}
.day.today{border-color:var(--red);box-shadow:0 0 0 1.5px var(--red)}
.day.drop{background:var(--redsoft)}
.dh{display:flex;align-items:center;gap:4px}
.dh b{font:400 19px/1 var(--f-display);font-variant-numeric:tabular-nums}
.dh .wd{display:none;font-size:12.5px;font-weight:700}
.dh .add{margin-inline-start:auto;border:0;background:var(--card2);color:var(--mute);font-size:16px;line-height:1;padding:2px 7px;border-radius:7px}
.dh .add:hover{background:var(--red);color:var(--onred)}
.citem{display:flex;align-items:center;gap:4px;width:100%;text-align:right;border:0;border-radius:8px;padding:3px 7px;font-size:11.5px;font-weight:700;line-height:1.5;min-width:0}
.citem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.citem.reel{background:var(--reel);color:var(--onred)}.citem.post{background:var(--post);color:var(--onpost)}.citem.story{background:var(--storysoft);color:var(--story)}
.citem.isdone{opacity:.55}.citem.isdone span{text-decoration:line-through}
.wchip{font-size:10.5px;background:var(--warnsoft);color:var(--warn);border-radius:6px;padding:0 5px;font-weight:700}
@media (max-width:760px){.calhead{display:none}.calgrid{grid-template-columns:minmax(0,1fr)}.day.pad{display:none}.day{min-height:0}.dh .wd{display:inline}}
/* kanban */
.kbwrap{overflow-x:auto;padding-bottom:10px}
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:10px;min-height:300px}
.kcol{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kcol.drop{outline:2px dashed var(--red)}
.kcol h4{margin:0;font-size:13px;display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 10px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px}
.kcard[draggable="true"]{cursor:grab}
.kcard .tt{font-weight:800;line-height:1.5}
.kmeta{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--mute)}
.bar{height:5px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
/* tables */
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle;font-size:13px}
th{font-size:12px;color:var(--mute);background:var(--card2);position:sticky;top:0;z-index:1;white-space:nowrap}
th button{all:unset;cursor:pointer}
td textarea{min-height:52px}
tr.isdone td{opacity:.6}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,8,4,.5);z-index:40}
.sheet{position:fixed;top:0;bottom:0;left:0;width:min(980px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:var(--sh2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
.shead{padding:12px max(16px,env(safe-area-inset-right,0px)) 0 16px;border-bottom:1px solid var(--line);background:var(--card)}
.shead .r1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.shead input.ttl{flex:1;min-width:180px;font:400 23px/1.4 var(--f-display);border:1px solid transparent;background:transparent;padding:2px 6px;width:auto}
.shead input.ttl:hover,.shead input.ttl:focus{border-color:var(--line);background:var(--card)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;padding:10px 0}
.meta label{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--mute);font-weight:700}
.meta input,.meta select{width:100%;max-width:none}
.stagebar{display:flex;gap:3px;flex-wrap:wrap;padding-bottom:6px}
.stagebar button{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--card2);color:var(--mute);border:0;font-weight:700}
.stagebar button.on{background:var(--red);color:var(--onred)}.stagebar button.past{background:var(--oksoft);color:var(--ok)}
.stabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.stab{border:0;background:transparent;padding:9px 11px;font-weight:800;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
.stab[aria-selected="true"]{color:var(--red);border-color:var(--red)}
.stab .dot{display:inline-block;width:7px;height:7px;border-radius:9px;margin-inline-start:5px;vertical-align:middle}
.sbody{flex:1;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 50px 16px;display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;font-weight:800;color:var(--mute)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));gap:10px}
.appr{border:1px solid var(--line);border-radius:14px;padding:11px 13px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.ab{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hint{font-size:12.5px;color:var(--mute);background:var(--card2);border-radius:10px;padding:9px 11px;line-height:1.9}
.arr{display:flex;flex-direction:column;gap:8px}
.arow{display:grid;gap:8px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.arow .ctl{display:flex;gap:2px;align-items:center}
.chk{display:flex;gap:9px;align-items:flex-start;padding:6px 7px;border-radius:9px;cursor:pointer}
.chk:hover{background:var(--card2)}
.chk.isdone>span{color:var(--mute);text-decoration:line-through}
.cmt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.cmt b{font-size:12.5px}.cmt time{font-size:11px;color:var(--mute);margin-inline-start:6px}
.cmt .at{color:var(--red);font-weight:700}
/* storyboard grid */
.sbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.panelc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh)}
.panelc .frame{position:relative;aspect-ratio:9/16;max-height:340px;background:var(--canvasbg);display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);cursor:pointer;overflow:hidden;max-width:100%}
.panelc .frame img{width:100%;height:100%;object-fit:contain}
.panelc .frame .no{position:absolute;top:6px;right:6px;background:var(--ink);color:var(--bg);border-radius:7px;font-weight:800;font-size:12px;padding:0 7px}
.panelc .frame .ph{color:#9a8577;font-size:12.5px;font-weight:700;text-align:center;padding:10px}
.panelc .pb{padding:8px 9px;display:flex;flex-direction:column;gap:6px}
.panelc .pb .frow{grid-template-columns:1fr 1fr;gap:6px}
.panelc .pb select{width:100%;font-size:12px;padding:4px 6px}
.panelc .pb input,.panelc .pb textarea{font-size:12.5px;padding:5px 7px}
.panelc .pb textarea{min-height:58px}
.colortag{display:flex;gap:4px}.colortag button{width:18px;height:18px;border-radius:99px;border:2px solid transparent;padding:0}
.colortag button[aria-pressed="true"]{border-color:var(--ink)}
/* sketch editor */
.skwrap{position:fixed;inset:0;z-index:50;background:rgba(10,4,2,.78);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.sktools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--card);padding:8px 12px;border-bottom:1px solid var(--line)}
.sktools .tool{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:4px 9px;font-weight:700;font-size:12.5px}
.sktools .tool[aria-pressed="true"]{background:var(--red);color:var(--onred);border-color:var(--red)}
.sktools .sw{width:24px;height:24px;border-radius:99px;border:2px solid var(--line);padding:0}
.sktools .sw[aria-pressed="true"]{outline:2px solid var(--red);outline-offset:1px}
.skstage{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;min-height:0;overflow:hidden}
.skbox{position:relative;height:100%;max-height:100%;aspect-ratio:9/16;max-width:100%;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.skbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:4px}
.skbox canvas.ov{pointer-events:none}
/* caption preview */
.igprev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;max-width:380px;font-size:13px;line-height:1.8}
.igprev .u{font-weight:800}.igprev .more{color:var(--mute)}
/* date picker */
.dp{position:fixed;z-index:70;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh2);padding:10px;width:280px}
.dp .dph{display:flex;align-items:center;justify-content:space-between;font-weight:800;margin-bottom:6px}
.dp .dpg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums}
.dp .dpg span{color:var(--mute);font-size:11px;font-weight:700}
.dp .dpg button{border:0;background:transparent;border-radius:8px;padding:5px 0;font-weight:600}
.dp .dpg button:hover{background:var(--card2)}
.dp .dpg button.sel{background:var(--red);color:var(--onred)}
.dp .dpg button.tod{outline:1.5px solid var(--red)}
.dp .dpf{display:flex;justify-content:space-between;margin-top:6px}

function hasSec(type,s){return SECTIONS[type].some(function(x){return x[0]===s})}
function sectionName(type,s){var f=(SECTIONS[type]||[]).find(function(x){return x[0]===s});return f?f[1]:s}

  function pendingFor(col){return (queue[col]||[]).length>0}

    if(busy)return Promise.resolve(false);

      return Promise.all(Object.keys(FILES).map(function(col){return fetch('https://raw.githubusercontent.com/'+c.owner+'/'+c.repo+'/'+BR+'/data/'+FILES[col]+'.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(t){if(pendingFor(col))return;var d=t?parse(t):{};if(JSON.stringify(d)!==JSON.stringify(cache[col])){cache[col]=d;emit(col)}})})).then(function(){loaded=true;return true})}
