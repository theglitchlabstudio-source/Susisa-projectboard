<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Susisa Menu Studio</title>
<style>:root{--bg0:#121316;--bg1:#18191d;--bg2:#1f2025;--bg3:#272930;--bg4:#30323a;--ln:#2e3037;--ln2:#3a3d46;--tx:#e6e7ea;--mu:#9a9ca5;--dim:#6c6f78;--ac:#3d8bfd;--ac2:#2f6fd0;--acbg:rgba(61,139,253,.16);--rd:#e5484d;--am:#f0a000}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--tx);font:12.5px/1.45 "Inter","Segoe UI",system-ui,-apple-system,"Vazirmatn",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:44px 264px minmax(0,1fr) 336px;grid-template-rows:40px minmax(0,1fr) 150px 24px;height:100vh;overflow:hidden}
/* top bar */
#top{grid-column:1/5;display:flex;align-items:center;gap:4px;padding:0 8px;background:var(--bg1);border-bottom:1px solid var(--ln);min-width:0}
.brand{display:flex;align-items:baseline;gap:6px;padding:0 10px 0 4px;white-space:nowrap}.brand b{color:var(--am);letter-spacing:.12em;font-size:13px}.brand span{color:var(--mu);font-size:12px}
.menus{display:flex}.mb{background:none;border:0;padding:5px 9px;border-radius:5px;color:var(--tx);cursor:default}.mb:hover,.mb.on{background:var(--bg3)}
.gap{flex:1}.vsep{width:1px;height:20px;background:var(--ln2);margin:0 4px}
.tc{font:500 12px/1 ui-monospace,"Cascadia Mono",Consolas,monospace;color:var(--tx);background:var(--bg0);border:1px solid var(--ln);border-radius:5px;padding:5px 8px;min-width:118px;text-align:center}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
/* rail */
#rail{grid-column:1;grid-row:2/4;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;background:var(--bg1);border-right:1px solid var(--ln)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:0;border-radius:6px;background:none;color:var(--mu);cursor:pointer;flex:none}
.ib:hover{background:var(--bg3);color:var(--tx)}.ib.sm{width:24px;height:24px}.ib.act{color:var(--am)}
.ib.tool{width:32px;height:32px}.ib.tool.on{background:var(--acbg);color:var(--ac)}.ib.danger-h:hover{color:var(--rd)}
.ic{display:inline-flex;line-height:0}
/* docks */
.dock{display:flex;flex-direction:column;min-height:0;background:var(--bg2);border-color:var(--ln);border-style:solid;border-width:0}
#left{grid-column:2;grid-row:2/4;border-right-width:1px}#right{grid-column:4;grid-row:2/4;border-left-width:1px}
.dtabs{display:flex;gap:2px;padding:6px 6px 0;background:var(--bg1);border-bottom:1px solid var(--ln)}
.dtabs button{background:none;border:0;padding:6px 10px 7px;border-radius:6px 6px 0 0;color:var(--mu);cursor:pointer;white-space:nowrap}
.dtabs button:hover{color:var(--tx)}.dtabs button[aria-selected=true]{background:var(--bg2);color:var(--tx);box-shadow:inset 0 2px 0 var(--ac)}
.dbody{flex:1;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--bg4) transparent}
.pad{padding:8px 10px}
/* stage */
#stagewrap{grid-column:3;grid-row:2;overflow:auto;min-width:0;min-height:0;display:flex;background:var(--bg0) radial-gradient(circle at 1px 1px,#23252b 1px,transparent 0) 0 0/16px 16px;scrollbar-width:thin;scrollbar-color:var(--bg4) transparent}
#stagebox{position:relative;line-height:0;margin:auto;padding:24px;flex:none}
#stagebox:fullscreen{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#000;padding:0}
#stagebox:fullscreen #ov{display:none}
canvas#stage{display:block;box-shadow:0 8px 40px rgba(0,0,0,.6),0 0 0 1px #000}
#ov{position:absolute;left:24px;top:24px;touch-action:none}
#stagebox:fullscreen #ov{left:0;top:0}
/* timeline */
#timeline{grid-column:3;grid-row:3;display:flex;flex-direction:column;background:var(--bg1);border-top:1px solid var(--ln);min-width:0}
.tlbar{display:flex;align-items:center;gap:10px;padding:4px 10px;border-bottom:1px solid var(--ln);color:var(--mu)}.tlbar b{color:var(--tx);font-weight:600}
.tlbody{flex:1;display:flex;min-height:0}.tlabels{width:96px;flex:none;border-right:1px solid var(--ln)}
.tlh{height:18px;border-bottom:1px solid var(--ln)}.tll{height:24px;padding:0 8px;display:flex;align-items:center;color:var(--mu);font-size:11.5px;border-bottom:1px solid #1d1e22}
.tlarea{flex:1;position:relative;overflow:hidden;cursor:ew-resize}
.ruler{height:18px;position:relative;border-bottom:1px solid var(--ln);background:var(--bg1)}.ruler span{position:absolute;top:2px;font:10px ui-monospace,Consolas,monospace;color:var(--dim);padding-left:3px;border-left:1px solid var(--ln2);height:14px}
.trk{height:24px;position:relative;border-bottom:1px solid #1d1e22}
.clip{position:absolute;top:3px;bottom:3px;background:color-mix(in srgb,var(--c,#555) 30%,var(--bg3));border:1px solid color-mix(in srgb,var(--c,#555) 70%,transparent);border-radius:4px;overflow:hidden;display:flex;align-items:center}
.clip span{padding:0 6px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx)}.clip.tick{--c:#666}
.phead{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid var(--rd);pointer-events:none}.phead::before{content:"";position:absolute;top:0;left:-6px;border:6px solid transparent;border-top:8px solid var(--rd)}
/* status */
#status{grid-column:1/5;display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--bg1);border-top:1px solid var(--ln);color:var(--mu);font-size:11.5px;white-space:nowrap;overflow:hidden}
/* controls */
.btn{display:inline-flex;align-items:center;gap:4px;background:var(--bg3);color:var(--tx);border:1px solid var(--ln2);border-radius:6px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--bg4)}.btn.sm{padding:3px 8px;font-size:12px}.btn.primary{background:var(--ac);border-color:var(--ac);color:#fff}.btn.primary:hover{background:var(--ac2)}
.btn.ghost{background:none;border-color:transparent;color:var(--mu)}.btn.ghost:hover{color:var(--tx);background:var(--bg3)}
.btn.danger{background:var(--rd);border-color:var(--rd);color:#fff}.btn.add{width:100%;margin-top:6px;border-style:dashed;justify-content:center;background:none;color:var(--mu)}.btn.add:hover{color:var(--tx)}
.btn:disabled{opacity:.4}
input,select,textarea{background:var(--bg0);color:var(--tx);border:1px solid var(--ln2);border-radius:5px;padding:4px 7px;font:inherit;max-width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 2px var(--acbg)}
input[type=text]{flex:1}input.num{width:70px;font-family:ui-monospace,Consolas,monospace;font-size:12px}textarea{width:100%;resize:vertical}
select{width:100%;cursor:pointer}
input[type=range]{flex:1;min-width:0;width:100%;accent-color:var(--ac);height:16px}
.rng{display:flex;align-items:center;gap:6px;width:100%;min-width:0}.rng .num{width:62px;flex:none}.rng output{color:var(--dim);font-size:11px;min-width:0}
.cc{display:flex;align-items:center;gap:4px;width:100%;min-width:0}
.cc input[type=color]{width:28px;height:26px;padding:2px;border-radius:5px;cursor:pointer;flex:none}
.cc .hex{flex:1;min-width:0;width:80px;font-family:ui-monospace,Consolas,monospace;font-size:12px;text-transform:uppercase}
.chip{background:var(--bg0);color:var(--mu);border:1px solid var(--ln2);border-radius:20px;padding:1px 9px;font-size:11.5px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acbg);color:#cfe1ff;border-color:var(--ac)}
.fld{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:8px;margin:6px 0}.fld>label{color:var(--mu);font-size:12px}
.ctl{min-width:0}.ctl small,.note{color:var(--dim);font-size:11px;display:block;margin-top:2px}.note.warn{color:#ffb4a8}
.row{display:flex;align-items:center;gap:6px;margin:4px 0;min-width:0}.row.wrap{flex-wrap:wrap}.row.end{justify-content:flex-end}.grow{flex:1;min-width:0}.sp{flex:1}
.col{display:flex;flex-direction:column;gap:5px;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk{display:inline-flex;align-items:center;gap:5px;cursor:pointer;color:var(--tx)}.chk input{accent-color:var(--ac)}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}.seg button{background:var(--bg0);color:var(--mu);border:1px solid var(--ln2);border-radius:6px;padding:3px 9px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acbg);color:#cfe1ff;border-color:var(--ac)}
.segc{display:inline-flex;background:var(--bg0);border:1px solid var(--ln2);border-radius:6px;padding:2px;gap:2px}
.segc button{background:none;border:0;border-radius:4px;padding:3px 9px;color:var(--mu);cursor:pointer;display:inline-flex;align-items:center}.segc button[aria-pressed=true]{background:var(--bg4);color:var(--tx)}
.numrow{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:5px 0}.nc{display:flex;align-items:center;background:var(--bg0);border:1px solid var(--ln2);border-radius:5px;padding-left:7px}
.nc span{color:var(--dim);font-size:11px;width:14px}.nc .num{border:0;background:none;width:100%;box-shadow:none}
.tbar{display:flex;align-items:center;gap:1px;margin:6px 0;flex-wrap:wrap}
.tag{background:var(--am);color:#1a1200;border-radius:12px;padding:0 8px;font-weight:700;font-size:11px}
/* groups */
.grp{border-bottom:1px solid var(--ln)}.grp>summary{list-style:none;display:flex;align-items:center;gap:6px;padding:8px 10px;cursor:pointer;font-weight:600;color:var(--tx);user-select:none}
.grp>summary::-webkit-details-marker{display:none}.grp>summary .ic{transform:rotate(-90deg);transition:transform .12s;color:var(--dim)}.grp[open]>summary .ic{transform:none}
.grp>summary:hover{background:var(--bg3)}.gbody{padding:2px 10px 10px}
.gbody .grp{border:1px solid var(--ln);border-radius:6px;margin:6px 0}.gbody .grp>summary{padding:6px 8px;font-weight:500}.gbody .gbody{padding:2px 8px 8px}
.lhead{padding:12px 10px 4px;color:var(--dim);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.sechead{display:flex;align-items:center;gap:8px;margin:14px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--ln)}.sechead b{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mu)}
.card{background:var(--bg1);border:1px solid var(--ln);border-radius:7px;padding:6px 7px;margin:5px 0}.card.dim{opacity:.55}.card.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.media{margin-top:6px;border-top:1px solid var(--ln);padding-top:4px}.media .grp{border:1px solid var(--ln);border-radius:6px;margin:6px 0}
/* inspector */
.ihead{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--ln);background:var(--bg1);position:sticky;top:0;z-index:2}
.ihead>.ic{width:30px;height:30px;border-radius:7px;background:var(--acbg);color:var(--ac);align-items:center;justify-content:center}
.ihead b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ihead small{color:var(--mu)}
.empty{padding:28px 18px;text-align:center;color:var(--mu)}.empty>.ic{color:var(--dim);margin-bottom:8px}.empty b{display:block;color:var(--tx);font-size:14px;margin-bottom:6px}.empty p{margin:0 0 16px;line-height:1.55}
.kbd{display:grid;gap:5px;text-align:left}.kbd div{display:flex;align-items:center;gap:10px}.kbd span{color:var(--mu)}
kbd{font:11px ui-monospace,Consolas,monospace;background:var(--bg0);border:1px solid var(--ln2);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--tx);min-width:62px;text-align:center}
.kbd.wide kbd{min-width:170px}
/* layers */
.layers{padding:4px 0 8px}
.lrow{display:flex;align-items:center;gap:6px;height:28px;padding-right:6px;cursor:default;border-left:2px solid transparent;color:var(--tx)}
.lrow:hover{background:var(--bg3)}.lrow.on{background:var(--acbg);border-left-color:var(--ac)}.lrow>.ic{color:var(--mu)}
.lname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .ib.sm{opacity:0}.lrow:hover .ib.sm,.lrow .ib.act{opacity:1}
.tw{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:none;border:0;padding:0;color:var(--dim);cursor:pointer}
button.tw .ic{transform:rotate(-90deg)}button.tw.open .ic{transform:none}
.lfoot{display:flex;gap:2px;padding:8px 8px 0;margin-top:6px;border-top:1px solid var(--ln)}
/* assets */
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.acard{background:var(--bg1);border:1px solid var(--ln);border-radius:7px;padding:6px;display:flex;flex-direction:column;gap:5px}.acard.unused{opacity:.7;border-style:dashed}
.acard img,.aico{width:100%;height:84px;object-fit:contain;background:repeating-conic-gradient(#2a2c32 0 25%,#22242a 0 50%) 0 0/14px 14px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.ameta{display:flex;justify-content:space-between;color:var(--dim)}
/* fill editor */
.fillctl{display:flex;flex-direction:column;gap:5px;width:100%;min-width:0}.fillctl .row{flex-wrap:nowrap}.fillctl .row small{color:var(--dim);width:44px;flex:none}
/* menus & popovers */
.dd{position:fixed;z-index:50;min-width:220px;background:var(--bg2);border:1px solid var(--ln2);border-radius:8px;padding:4px;box-shadow:0 12px 40px rgba(0,0,0,.55)}
.dd button{display:flex;width:100%;align-items:center;gap:20px;background:none;border:0;padding:5px 10px;border-radius:5px;text-align:left;cursor:default}
.dd button span{flex:1}.dd button:hover{background:var(--ac);color:#fff}.dd button:hover kbd{color:#fff;border-color:rgba(255,255,255,.4);background:none}.dd button.danger{color:#ff8b8e}
.dd button.checked span::before{content:"✓ ";color:var(--ac)}.dd button:hover.checked span::before{color:#fff}
.dd kbd{min-width:0;border:0;background:none;color:var(--dim);padding:0}.dd hr{border:0;border-top:1px solid var(--ln);margin:4px 2px}
.popover{position:fixed;z-index:60;width:240px;background:var(--bg2);border:1px solid var(--ln2);border-radius:8px;padding:8px;box-shadow:0 12px 40px rgba(0,0,0,.55)}
.popover .pt{color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;margin:6px 0 4px}.sws{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.sw{aspect-ratio:1;border:1px solid rgba(255,255,255,.15);border-radius:3px;cursor:pointer;padding:0}.sw:hover{outline:2px solid var(--ac)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
.mbox{width:min(560px,92vw);background:var(--bg2);border:1px solid var(--ln2);border-radius:10px;overflow:hidden}.mbox .kbd{padding:14px 16px}
/* overlay */
.ov-reg,.ov-sel,.ov-draw{position:absolute;pointer-events:none;transform-origin:center}
.ov-reg{outline:1px dashed rgba(255,255,255,.18)}.ov-reg.el{outline-color:rgba(61,139,253,.35)}
.ov-reg i{position:absolute;top:2px;left:4px;font:10.5px/1.4 "Segoe UI",system-ui,sans-serif;font-style:normal;color:rgba(255,255,255,.6);background:rgba(0,0,0,.45);padding:0 5px;border-radius:3px}
.ov-sel{outline:1.5px solid var(--ac);box-shadow:0 0 0 1px rgba(0,0,0,.5) inset}.ov-sel.part{outline-style:dashed}
.ov-sel i{position:absolute;top:-20px;left:-1px;font:11px/1.6 "Segoe UI",system-ui,sans-serif;font-style:normal;background:var(--ac);color:#fff;padding:0 6px;border-radius:3px;white-space:nowrap}
.ov-draw{outline:1.5px dashed var(--ac);background:var(--acbg)}.ov-draw.ell{border-radius:50%}
.hd{position:absolute;width:9px;height:9px;background:#fff;border:1.5px solid var(--ac);border-radius:2px;pointer-events:auto}
.hd.nw{left:-5px;top:-5px;cursor:nwse-resize}.hd.n{left:calc(50% - 4.5px);top:-5px;cursor:ns-resize}.hd.ne{right:-5px;top:-5px;cursor:nesw-resize}
.hd.e{right:-5px;top:calc(50% - 4.5px);cursor:ew-resize}.hd.se{right:-5px;bottom:-5px;cursor:nwse-resize}.hd.s{left:calc(50% - 4.5px);bottom:-5px;cursor:ns-resize}
.hd.sw{left:-5px;bottom:-5px;cursor:nesw-resize}.hd.w{left:-5px;top:calc(50% - 4.5px);cursor:ew-resize}
.hd.rot{left:calc(50% - 5px);top:-30px;width:10px;height:10px;border-radius:50%;cursor:grab}.hd.rot::after{content:"";position:absolute;left:3px;top:9px;width:1px;height:16px;background:var(--ac)}
.ov-safe{position:absolute;outline:1px dashed rgba(0,200,255,.55);pointer-events:none}
.ov-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px)}
.ov-guide{position:absolute;background:#ff3df0;pointer-events:none}.ov-guide.v{top:0;bottom:0;width:1px}.ov-guide.h{left:0;right:0;height:1px}
.pbar{display:none;height:6px;background:var(--bg0);border-radius:4px;overflow:hidden;margin:6px 0}.pbar i{display:block;height:100%;width:0;background:var(--ac)}
body.player #app{display:block;height:100vh}body.player canvas#stage{box-shadow:none;cursor:none}
@media (max-width:1200px){#app{grid-template-columns:44px 220px minmax(0,1fr) 300px}}
@media (max-width:1000px){#app{grid-template-columns:40px 0 minmax(0,1fr) 270px;grid-template-rows:40px minmax(0,1fr) 120px 24px}#left{display:none}.brand span,.menus .mb:nth-child(n+5),.tlbar small:last-of-type{display:none}.tc{min-width:0}}
.tlbar{white-space:nowrap;overflow:hidden}
.tc,.zoomv{white-space:nowrap}
.hd.bend{width:12px;height:12px;background:var(--am);border-color:#1a1200;border-radius:2px;transform:rotate(45deg);cursor:move}
.tll{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd.ept{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--rd);cursor:move}

/* media editor lives in the narrow Menu dock: stack label above control so sliders get real width */
.media .fld{grid-template-columns:1fr;gap:3px}
.media .rng input[type=range]{min-width:90px}
.media .hint{display:block;color:var(--dim);font-size:11px;line-height:1.5;margin:-2px 0 6px}
