<style id="appcss">/* Workshop UI: dark bench, cream accent from the Susisa logo, red reserved for "go live". */
:root{
  --ui-bg:#121110; --ui-panel:#1B1917; --ui-raise:#24211E; --ui-line:#34302A; --ui-line2:#4A443C;
  --ui-text:#F3ECDD; --ui-mute:#9A9284; --ui-cream:#FAE089; --ui-red:#CC0212; --ui-ok:#9CC957; --ui-warn:#F0A43A;
  --ui-fa:"Vazirmatn",Tahoma,sans-serif; --ui-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ui-bg);color:var(--ui-text)}
body{font-family:var(--ui-fa);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
#studio{height:100%}

/* ---------- top bar ---------- */
.bar{height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--ui-line);background:var(--ui-bg);position:relative;z-index:5}
.bar-brand{display:flex;align-items:center;gap:10px;min-width:0}
.bar-brand img{height:30px;width:auto}
.bar-brand b{font-weight:700;font-size:15px;white-space:nowrap}
.bar-brand small{font-family:var(--ui-mono);color:var(--ui-mute);font-size:11px;letter-spacing:.12em}
.bar-sp{flex:1}
.status{font-size:12px;color:var(--ui-mute);white-space:nowrap}
.status.bad{color:var(--ui-warn)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;
  border:1px solid var(--ui-line2);background:var(--ui-raise);cursor:pointer;white-space:nowrap;font-size:13px}
.btn:hover{border-color:var(--ui-mute)}
.btn:focus-visible,.inp:focus-visible,.tab:focus-visible{outline:2px solid var(--ui-cream);outline-offset:1px}
.btn.pri{background:var(--ui-cream);color:#1a1712;border-color:var(--ui-cream);font-weight:700}
.btn.live{background:var(--ui-red);border-color:var(--ui-red);color:#fff;font-weight:700}
.btn.ghost{background:transparent}
.btn.sm{height:28px;padding:0 9px;font-size:12px}
.btn.icon{width:34px;padding:0}
.btn.sm.icon{width:28px}
.btn.danger:hover{border-color:var(--ui-red);color:#ff8a8a}
.btn[aria-pressed="true"]{background:var(--ui-line);border-color:var(--ui-cream);color:var(--ui-cream)}
.btn:disabled{opacity:.4;cursor:default}

/* ---------- workspace ---------- */
.work{display:grid;grid-template-columns:168px minmax(340px,440px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:calc(100% - 56px)}
.work>*{min-height:0}
.tabs{border-left:1px solid var(--ui-line);padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.tab{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:0;background:none;cursor:pointer;text-align:right;color:var(--ui-mute)}
.tab:hover{background:var(--ui-panel);color:var(--ui-text)}
.tab[aria-selected="true"]{background:var(--ui-raise);color:var(--ui-cream)}
.tab i{font-style:normal;font-family:var(--ui-mono);font-size:11px;width:18px;opacity:.7}
.panel{border-left:1px solid var(--ui-line);overflow:auto;padding:18px 18px 60px;min-width:0}
.panel h2{font-size:17px;margin:0 0 4px;font-weight:700}
.panel .lead{color:var(--ui-mute);font-size:12.5px;margin:0 0 16px}
.grp{border:1px solid var(--ui-line);border-radius:12px;background:var(--ui-panel);padding:14px;margin-bottom:14px}
.grp-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.grp-h h3{margin:0;font-size:14px;font-weight:700;flex:1;min-width:0}
.grp-h .kick{font-family:var(--ui-mono);font-size:10.5px;color:var(--ui-mute);letter-spacing:.14em}
.fld{display:grid;grid-template-columns:120px minmax(0,1fr);align-items:center;gap:10px;margin:8px 0}
.fld>label{color:var(--ui-mute);font-size:12.5px}
.fld.stack{grid-template-columns:1fr}
.hint{font-size:11.5px;color:var(--ui-mute);margin:4px 0 0}
.hint.warn{color:var(--ui-warn)}
.inp{width:100%;height:34px;border-radius:8px;border:1px solid var(--ui-line2);background:var(--ui-bg);padding:0 10px;min-width:0}
.inp.num{font-family:var(--ui-mono);direction:ltr;text-align:left}
.inp.ltr{direction:ltr;text-align:left}
select.inp{padding:0 8px}
.row2{display:flex;gap:8px;align-items:center;min-width:0}
.row2>.inp{flex:1}
.color{display:flex;gap:6px;align-items:center}
.color input[type=color]{width:38px;height:34px;border:1px solid var(--ui-line2);border-radius:8px;background:none;padding:2px;cursor:pointer;flex:none}
.color .inp{font-family:var(--ui-mono);direction:ltr;text-transform:uppercase}
.rng{display:flex;gap:8px;align-items:center}
.rng input[type=range]{flex:1;accent-color:var(--ui-cream);min-width:0}
.rng .inp{width:74px;flex:none}
.tgl{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:13px}
.tgl input{appearance:none;width:34px;height:20px;border-radius:10px;background:var(--ui-line2);position:relative;cursor:pointer;margin:0;flex:none}
.tgl input::after{content:"";position:absolute;top:3px;right:3px;width:14px;height:14px;border-radius:50%;background:var(--ui-text);transition:right .15s}
.tgl input:checked{background:var(--ui-cream)}
.tgl input:checked::after{right:17px;background:#1a1712}
.seg{display:inline-flex;border:1px solid var(--ui-line2);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--ui-bg);padding:6px 11px;cursor:pointer;font-size:12.5px;color:var(--ui-mute)}
.seg button[aria-pressed="true"]{background:var(--ui-cream);color:#1a1712;font-weight:700}

/* items */
.item{border:1px solid var(--ui-line);border-radius:10px;background:var(--ui-bg);margin-top:8px}
.item-top{display:grid;grid-template-columns:minmax(0,1fr) 84px auto;gap:6px;align-items:center;padding:8px}
.item-top .inp{height:32px}
.item-tools{display:flex;gap:4px;align-items:center}
.item.off .item-top .inp:first-child{text-decoration:line-through;color:var(--ui-mute)}
.item-body{border-top:1px dashed var(--ui-line);padding:10px}
.badge{font-family:var(--ui-mono);font-size:10.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--ui-line2);color:var(--ui-mute);direction:ltr}
.badge.ok{color:var(--ui-ok);border-color:currentColor}
.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:10px}
.fr{border:1px solid var(--ui-line);border-radius:8px;overflow:hidden;background:var(--ui-panel)}
.fr-img{aspect-ratio:3/2;background:#000;display:block;width:100%;object-fit:contain}
.fr-ctl{display:flex;align-items:center;gap:2px;padding:4px}
.fr-ctl .inp{height:24px;font-size:11px;padding:0 4px}
.fr-n{font-family:var(--ui-mono);font-size:10px;color:var(--ui-mute);padding:0 4px}
.fr-btn{border:0;background:none;color:var(--ui-mute);cursor:pointer;padding:0 3px;font-size:13px;line-height:1}
.fr-btn:hover{color:var(--ui-text)}
.drop{border:1.5px dashed var(--ui-line2);border-radius:10px;padding:14px;text-align:center;color:var(--ui-mute);font-size:12.5px;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--ui-cream);color:var(--ui-cream)}
.meter{height:6px;border-radius:3px;background:var(--ui-line);overflow:hidden;margin-top:8px}
.meter b{display:block;height:100%;background:var(--ui-ok)}
.meter.over b{background:var(--ui-warn)}
.list-line{display:flex;gap:6px;align-items:center;margin:6px 0}
.list-line .inp{flex:1}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.preset{border:1px solid var(--ui-line2);border-radius:10px;padding:8px;cursor:pointer;background:var(--ui-bg);text-align:right}
.preset:hover{border-color:var(--ui-cream)}
.preset .sw{display:flex;height:22px;border-radius:5px;overflow:hidden;margin-bottom:6px}
.preset .sw span{flex:1}
.preset b{font-size:12px;font-weight:500}
table.leg{width:100%;border-collapse:collapse;font-size:12px}
table.leg th,table.leg td{padding:6px 4px;border-bottom:1px solid var(--ui-line);text-align:right}
table.leg th{color:var(--ui-mute);font-weight:400}
table.leg td.n{font-family:var(--ui-mono);direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
.pill{font-size:11px;padding:1px 8px;border-radius:10px}
.pill.ok{background:rgba(156,201,87,.15);color:var(--ui-ok)}
.pill.bad{background:rgba(240,164,58,.15);color:var(--ui-warn)}
.logo-box{display:flex;gap:14px;align-items:center}
.logo-box .lg{width:120px;height:96px;border-radius:10px;border:1px solid var(--ui-line);display:flex;align-items:center;justify-content:center;
  background:repeating-conic-gradient(#222 0 25%,#1a1a1a 0 50%) 0 0/16px 16px}
.logo-box .lg img{max-width:100%;max-height:100%}

/* ---------- preview ---------- */
.pv{display:flex;flex-direction:column;min-width:0;min-height:0;background:#0A0908}
.pv-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ui-line)}
.pv-bar .lbl{font-family:var(--ui-mono);font-size:11px;letter-spacing:.14em;color:var(--ui-mute);margin-left:6px}
.pv-box{flex:1;position:relative;min-height:0;overflow:hidden;margin:16px}
.pv-screen{position:absolute;overflow:hidden;box-shadow:0 0 0 1px var(--ui-line2),0 0 0 10px #050505,0 0 0 11px var(--ui-line)}
.pv-foot{padding:0 16px 12px;color:var(--ui-mute);font-size:12px;display:flex;gap:14px;flex-wrap:wrap}
.pv-foot b{font-family:var(--ui-mono);font-weight:500;color:var(--ui-text)}
.ovl-safe{position:absolute;inset:5%;border:2px dashed rgba(250,224,137,.7);pointer-events:none;z-index:20}
.ovl-grid{position:absolute;inset:0;pointer-events:none;z-index:20;
  background-image:linear-gradient(rgba(250,224,137,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(250,224,137,.18) 1px,transparent 1px);background-size:80px 80px}
.pv .s-row,.pv .s-sec,.pv .s-tops,.pv .s-ticker{cursor:pointer}

/* ---------- presentation layer ---------- */
#present{position:fixed;inset:0;background:#000;z-index:100;overflow:hidden;cursor:none}
#present .pv-screen{box-shadow:none}
.exit-hint{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:110;background:rgba(18,17,16,.92);border:1px solid var(--ui-line2);
  color:var(--ui-text);padding:10px 16px;border-radius:10px;font-size:14px;transition:opacity .6s;pointer-events:none}
.exit-zone{position:fixed;top:0;left:0;width:140px;height:140px;z-index:105}

/* ---------- toast ---------- */
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 32px);pointer-events:none}
.toast{background:var(--ui-raise);border:1px solid var(--ui-line2);
  padding:10px 16px;border-radius:10px;font-size:13px;max-width:min(560px,calc(100vw - 32px));box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.bad{border-color:var(--ui-warn)}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .work{grid-template-columns:150px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:calc(100% - 56px)}
  .pv{grid-column:1 / -1;height:52vw;min-height:260px}
}
@media (max-width:720px){
  html,body,#studio{height:auto}
  .bar{flex-wrap:wrap;height:auto;padding:10px 16px;gap:8px}
  .bar-sp{display:none}
  .status{order:5;width:100%}
  .work{display:flex;flex-direction:column}
  .pv{height:auto;aspect-ratio:auto;order:-1}
  .pv-box{height:56vw;min-height:200px;margin:12px 16px}
  .tabs{flex-direction:row;overflow-x:auto;border-left:0;border-bottom:1px solid var(--ui-line);padding:8px 16px}
  .tab{flex:none}
  .panel{border-left:0;padding:16px}
  .fld{grid-template-columns:1fr;gap:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


/* ---------- v2 additions ---------- */
.exit-btn{position:fixed;top:14px;left:14px;z-index:120;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;
  border:1px solid rgba(255,255,255,.25);background:rgba(18,17,16,.82);color:#F3ECDD;font:inherit;font-size:14px;cursor:pointer;transition:opacity .4s}
.exit-btn.hide{opacity:0;pointer-events:none}
#present.idle{cursor:none}
#present{cursor:default}
.tb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border:1px solid var(--ui-line2);border-radius:10px;background:var(--ui-bg)}
.tb-sep{width:1px;align-self:stretch;background:var(--ui-line2);margin:0 2px}
.tb .btn.sm{min-width:30px}
.tb .inp{height:28px;font-size:12.5px}
.tb .font{width:170px}
.tb .size{width:62px}
.tb input[type=color]{width:30px;height:28px;border:1px solid var(--ui-line2);border-radius:6px;background:none;padding:2px;cursor:pointer}
.tb label.mini{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ui-mute)}
.sample{margin-top:10px;border:1px dashed var(--ui-line2);border-radius:10px;padding:14px;min-height:64px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:#0A0908}
.roles{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.roles button{border:1px solid var(--ui-line2);background:var(--ui-bg);border-radius:20px;padding:4px 12px;cursor:pointer;font-size:12.5px;color:var(--ui-mute)}
.roles button[aria-pressed="true"]{background:var(--ui-cream);color:#1a1712;border-color:var(--ui-cream);font-weight:700}
.prog{height:10px;border-radius:5px;background:var(--ui-line);overflow:hidden;margin:10px 0 6px}
.prog b{display:block;height:100%;width:0;background:var(--ui-cream);transition:width .2s}
.kv{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ui-mute);margin:6px 0 10px}
.kv b{color:var(--ui-text);font-family:var(--ui-mono);font-weight:500}
.bgthumb{width:120px;height:68px;border-radius:8px;border:1px solid var(--ui-line);background:#000 center/cover no-repeat;flex:none}
.fr-img{background:repeating-conic-gradient(#222 0 25%,#191919 0 50%) 0 0/12px 12px}

/* ---------- image editor ---------- */
.ed{position:fixed;inset:0;z-index:150;background:rgba(5,5,5,.86);display:flex;align-items:center;justify-content:center;padding:16px}
.ed-box{width:min(1280px,100%);height:min(860px,100%);background:var(--ui-panel);border:1px solid var(--ui-line2);border-radius:14px;
  display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.ed-top{grid-column:1 / -1;display:flex;align-items:baseline;gap:14px;padding:12px 16px;border-bottom:1px solid var(--ui-line);flex-wrap:wrap}
.ed-stage{position:relative;display:flex;align-items:center;justify-content:center;padding:24px;min-height:0;min-width:0;
  background:repeating-conic-gradient(#1d1d1d 0 25%,#151515 0 50%) 0 0/20px 20px}
.ed-wrap{position:relative;display:inline-block;max-width:100%;max-height:100%;line-height:0}
.ed-cv{display:block;max-width:100%;max-height:calc(min(860px,100vh - 32px) - 150px);width:auto;height:auto}
.ed-crop{position:absolute;box-shadow:0 0 0 9999px rgba(0,0,0,.55);outline:2px solid var(--ui-cream);cursor:move;touch-action:none}
.ed-crop::before,.ed-crop::after{content:"";position:absolute;inset:0;pointer-events:none;border:1px dashed rgba(250,224,137,.35)}
.ed-crop::before{left:33.33%;right:33.33%;border-top:0;border-bottom:0}
.ed-crop::after{top:33.33%;bottom:33.33%;border-left:0;border-right:0}
.ed-h{position:absolute;width:16px;height:16px;background:var(--ui-cream);border-radius:3px;touch-action:none}
.ed-nw{left:-8px;top:-8px;cursor:nwse-resize}.ed-ne{right:-8px;top:-8px;cursor:nesw-resize}
.ed-sw{left:-8px;bottom:-8px;cursor:nesw-resize}.ed-se{right:-8px;bottom:-8px;cursor:nwse-resize}
.ed-n{left:calc(50% - 8px);top:-8px;cursor:ns-resize}.ed-s{left:calc(50% - 8px);bottom:-8px;cursor:ns-resize}
.ed-w{top:calc(50% - 8px);left:-8px;cursor:ew-resize}.ed-e{top:calc(50% - 8px);right:-8px;cursor:ew-resize}
.ed-side{border-right:1px solid var(--ui-line);overflow:auto;padding:14px 16px;min-width:0}
.ed-sec{border-bottom:1px solid var(--ui-line);padding-bottom:12px;margin-bottom:12px}
.ed-sec h4{margin:0 0 8px;font-size:13px;font-weight:700}
.ed-sec .inp.num{width:90px;flex:none}
.ed-row{display:grid;grid-template-columns:104px minmax(0,1fr) 48px;align-items:center;gap:8px;margin:4px 0}
.ed-row input[type=range]{accent-color:var(--ui-cream);width:100%}
.ed-lab{border:0;background:none;color:var(--ui-mute);font-size:12.5px;text-align:right;cursor:pointer;padding:0}
.ed-lab:hover{color:var(--ui-cream)}
.ed-val{font-family:var(--ui-mono);font-size:11px;color:var(--ui-text);direction:ltr;text-align:left}
.ed-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:820px){
  .ed{padding:0}
  .ed-box{grid-template-columns:1fr;grid-template-rows:auto 46vh minmax(0,1fr);height:100%;border-radius:0}
  .ed-cv{max-height:calc(46vh - 48px)}
  .ed-side{border-right:0;border-top:1px solid var(--ui-line)}
}

/* ---------- design editor ---------- */
.pv-screen.editing{outline:1px solid var(--ui-cream)}
.ovl-ed{position:absolute;inset:0;z-index:25;outline:none;touch-action:none}
.ghost-box{position:absolute;outline:1px dashed rgba(250,224,137,.28);pointer-events:none;transform-origin:center}
.ghost-box.el{outline-color:rgba(120,190,255,.45)}
.sel-box{position:absolute;outline:2px solid #FAE089;pointer-events:none;transform-origin:center;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.sel-box.fixed{outline-style:dashed}
.sel-tag{position:absolute;top:-22px;right:-2px;background:#FAE089;color:#1a1712;font-size:11px;padding:1px 6px;border-radius:4px;white-space:nowrap;font-weight:700}
.hdl{position:absolute;width:11px;height:11px;background:#FAE089;border:1px solid #1a1712;border-radius:2px;margin:-6px 0 0 -6px;pointer-events:auto}
.h-nw{left:0;top:0;cursor:nwse-resize}.h-n{left:50%;top:0;cursor:ns-resize}.h-ne{left:100%;top:0;cursor:nesw-resize}.h-e{left:100%;top:50%;cursor:ew-resize}
.h-se{left:100%;top:100%;cursor:nwse-resize}.h-s{left:50%;top:100%;cursor:ns-resize}.h-sw{left:0;top:100%;cursor:nesw-resize}.h-w{left:0;top:50%;cursor:ew-resize}
.h-rot{left:50%;top:-28px;border-radius:50%;cursor:grab;background:#fff}
.guide{position:absolute;background:#FF4FA8;pointer-events:none}
.marq{position:absolute;border:1px dashed #FAE089;background:rgba(250,224,137,.08);pointer-events:none}
.addgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.geogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin:6px 0}
.geo{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--ui-mute)}
.geo .inp{height:30px}
.layer{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.layer:hover{background:var(--ui-bg)}
.layer.on{border-color:var(--ui-cream);background:var(--ui-bg)}
.lbtn{border:0;background:none;color:var(--ui-mute);cursor:pointer;width:24px;height:24px;padding:0;font-size:13px}
.lbtn:hover{color:var(--ui-text)}
.lname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.inp.ta{height:auto;padding:8px 10px;resize:vertical;line-height:1.5}
.keys{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ui-mute)}
kbd{font-family:var(--ui-mono);font-size:11px;border:1px solid var(--ui-line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ui-text);background:var(--ui-bg)}
.ovl-grid{background-size:calc(var(--gs,80) * 1px * var(--pvs,1)) calc(var(--gs,80) * 1px * var(--pvs,1))}

/* frame cards v5 */
.frames{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.fr-top{position:relative}
.fr-top .fr-n{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.65);color:#F3ECDD;border-radius:4px;padding:0 5px;font-size:10px}
.fr-del{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:6px;border:1px solid rgba(255,255,255,.35);background:rgba(204,2,18,.92);color:#fff;font-size:12px;cursor:pointer;line-height:1;padding:0}
.fr-del:hover{background:#E0141F}
.fr-del:focus-visible{outline:2px solid var(--ui-cream);outline-offset:1px}
.fr-ms{display:flex;align-items:center;gap:4px;padding:4px 4px 0}
.fr-ms .inp{height:24px;font-size:11px;padding:0 4px}
.fr-ms span{font-family:var(--ui-mono);font-size:10px;color:var(--ui-mute)}
.fr-ctl{justify-content:space-between}
.fr-btn{font-size:14px;padding:2px 4px}
</style>
<style id="stagecss">/* ======================= TV STAGE ======================= */
.stg,.stg *,.stg *::before,.stg *::after{box-sizing:border-box}
.stg h1,.stg h2,.stg h3,.stg p{margin:0}
.stg{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--ground);color:var(--muted);
  display:flex;flex-direction:column;overflow:hidden;direction:rtl;line-height:1.3;font-size:16px;letter-spacing:normal;text-align:right;font-family:"Vazirmatn",Tahoma,sans-serif}
.s-bg{position:absolute;inset:0;background-image:var(--bgImg);background-size:var(--bgFit);background-position:center;background-repeat:no-repeat;z-index:0}
.s-dim{position:absolute;inset:0;background:var(--ground);opacity:var(--bgDim);z-index:0}
.s-body,.s-ticker{position:relative;z-index:2}
.free .s-sec,.free .s-tops,.free .s-ticker{position:absolute;z-index:2}
.s-layer{position:absolute;inset:0;pointer-events:none}
.s-back{z-index:1}.s-front{z-index:3}
.s-el{position:absolute;box-sizing:border-box;transform-origin:center}
.s-el-bg{position:absolute;inset:0}
.s-el-img{position:absolute}
.s-el-t{position:absolute;inset:0;display:flex;white-space:pre-wrap;overflow:hidden;word-break:break-word}
.s-tcv{position:absolute;pointer-events:none}
.s-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--gap);padding:var(--pad)}
.s-cols{flex:1;min-height:0;display:grid;gap:var(--gap)}
.s-sec{background:var(--panelBg);border:var(--bw) solid var(--rule);border-radius:var(--r);padding:calc(var(--pad) * .85) calc(var(--pad) * 1.05);
  display:flex;flex-direction:column;gap:16px;min-height:0;min-width:0}
.s-head{order:0;display:flex;align-items:baseline;border-bottom:var(--bw) solid var(--rule);padding-bottom:10px;gap:12px}
.s-title{margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-count{white-space:nowrap;font-variant-numeric:tabular-nums}
.s-count b{color:var(--active);font-weight:inherit}
.s-list{order:2;display:flex;flex-direction:column;flex:none}
.s-row{height:var(--rowH);display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--rule);min-width:0}
.s-row:last-child{border-bottom:0}
.s-mark{width:12px;height:12px;border-radius:2px;background:var(--mark);flex:none;transform:scale(0);transition:transform .35s}
.s-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-price{font-variant-numeric:tabular-nums;white-space:nowrap}
.stg .s-row .s-price.none{color:var(--muted)}
.stg .s-row.on .s-name,.stg .s-row.on .s-price{color:var(--active);font-weight:var(--activeW)}
.s-row.on .s-mark{transform:scale(1)}
.stg .s-row.out .s-name{color:var(--muted);text-decoration:line-through}
.s-tag{font-family:"JetBrains Mono",monospace;font-size:18px;font-weight:700;border:2px solid var(--muted);color:var(--muted);border-radius:4px;padding:2px 8px;direction:ltr}
.nomark .s-mark{display:none}
.s-tile{order:3;flex:1;min-height:0;position:relative;border-radius:calc(var(--r) * .7);background:var(--tile)}
.free .s-sec{overflow:visible}
.tileclip .s-tile{overflow:hidden}
.img-above .s-tile{order:1}
.s-tile img{position:absolute;left:50%;top:50%;width:calc(100% * var(--imgScale));height:calc(100% * var(--imgScale));translate:-50% -50%;object-fit:var(--fit)}
.shadow .s-tile img{filter:drop-shadow(0 18px 22px rgba(0,0,0,.5))}
.feather .s-tile img{-webkit-mask-image:radial-gradient(ellipse closest-side at center,#000 86%,transparent 100%);mask-image:radial-gradient(ellipse closest-side at center,#000 86%,transparent 100%)}
.s-tile.enter{animation:s-enter .35s ease-out}
@keyframes s-enter{from{opacity:0}to{opacity:1}}
.s-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border:2px dashed var(--rule);border-radius:calc(var(--r) * .7);text-align:center;padding:10px}
.s-ph-name{font-size:44px;font-weight:700;color:var(--muted)}
.s-ph-note{font-family:"JetBrains Mono",monospace;font-size:18px;letter-spacing:.2em;color:var(--muted);direction:ltr}
.s-tops{flex:none;background:var(--panelBg);border:var(--bw) solid var(--rule);border-radius:var(--r);padding:18px calc(var(--pad) * 1.05);display:flex;gap:40px;align-items:stretch}
.s-tops-head{display:flex;flex-direction:column;justify-content:center;gap:8px;border-left:var(--bw) solid var(--rule);padding-left:24px;flex:none;min-width:180px}
.s-topgrid{flex:1;min-width:0;display:grid;grid-template-columns:repeat(var(--topCols),minmax(0,1fr));column-gap:40px}
.s-top{display:flex;align-items:center;gap:12px;height:var(--topRowH);border-bottom:1px solid var(--rule);min-width:0}
.s-free{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:26px;color:var(--free);border:2px solid var(--free);border-radius:4px;padding:1px 10px;direction:ltr}
.s-ticker{flex:none;height:var(--tickH);background:var(--tickBg);overflow:hidden;direction:ltr;display:flex;align-items:center;white-space:nowrap}
.s-track{display:inline-flex;align-items:center;will-change:transform}
.s-seg{display:inline-flex;align-items:center}
.s-line{padding:0 34px}
.s-sep{display:inline-flex;align-items:center;gap:12px;padding:0 6px;color:var(--tickText)}
.s-sep img{height:calc(var(--tickH) * var(--logoScale));width:auto}
.s-sep i{width:12px;height:12px;border-radius:50%;background:currentColor;display:block}
</style>

function addFrames(it, files){
  files = files.filter(function(f){ return /^image\//.test(f.type); }).sort(function(a, b){ return a.name.localeCompare(b.name, undefined, {numeric:true}); });
  if (!files.length) return;
  toast("در حال پردازش " + files.length + " تصویر…");
  var key = P.settings.keyBg, tol = +P.settings.keyTol || 60;
  Promise.all(files.map(function(f){ return processImage(f, 2400, 2400).then(function(u){ return key ? keyOut(u, tol) : u; }); })).then(function(urls){
    var added = [];
    commit("", function(){ urls.forEach(function(u){ var id = "a" + uid(); P.assets[id] = u; var fr = {asset:id, src:id, ms: it.frames.length ? 250 : 3000}; it.frames.push(fr); added.push(fr); }); }, true);
    if (added.length === 1) editFrame(it, added[0]);
    else toast(added.length + " تصویر اضافه شد. با ✎ روی هر تصویر، برش و رنگ را تنظیم کنید.");
  });
}

/* =====================================================================
   SHELL
   ===================================================================== */
function migrate(p){
  var d = defaultProject(), oldT = clone(p.theme || {});
  ["theme","layout","timing","settings","canvas","brand","ticker","toppings"].forEach(function(k){ p[k] = Object.assign({}, d[k], p[k] || {}); });
  p.settings.video = Object.assign({}, d.settings.video, p.settings.video || {});
  if (!p.canvas.aspect) p.canvas.aspect = p.canvas.orient === "portrait" ? "9:16" : "16:9";
  if (!p.text){
    p.text = defaultText();
    var m = {title:["zTitle","title"], item:["zItem","text"], price:["zPrice","price"], count:["zCount","muted"], topTitle:["zTopTitle","title"], top:["zTop","text"], topPrice:["zTop","price"], unit:["zUnit","muted"], ticker:["zTicker","tickText"]};
    Object.keys(m).forEach(function(k){ if (oldT[m[k][0]]) p.text[k].size = oldT[m[k][0]]; if (oldT[m[k][1]]) p.text[k].color = oldT[m[k][1]]; });
    if (oldT.fFa){ p.text.item.font = p.text.top.font = p.text.unit.font = oldT.fFa; }
    if (oldT.fDisplay){ p.text.title.font = p.text.topTitle.font = p.text.ticker.font = oldT.fDisplay; }
    if (oldT.fMono){ p.text.price.font = p.text.topPrice.font = p.text.count.font = p.text.word.font = oldT.fMono; }
    p.layout.feather = false; p.layout.tileBg = false; p.settings.lock = false;
  } else {
    var dt = defaultText(); Object.keys(dt).forEach(function(k){ p.text[k] = Object.assign({}, dt[k], p.text[k] || {}); });
  }
  p.assets = p.assets || {}; if (!p.assets.logo) p.assets.logo = LOGO_DEFAULT;
  if (p.v !== VERSION){ Object.keys(d.assets).forEach(function(k){ if (/^demo/.test(k) && p.assets[k]) p.assets[k] = d.assets[k]; }); }
  p.fonts = p.fonts || []; p.sysFonts = p.sysFonts || []; p.elements = p.elements || []; p.boxes = p.boxes || {}; p.rstyle = p.rstyle || {};
  p.sections = (p.sections || []).map(function(s){ s.id = s.id || uid(); s.width = s.width || 1; s.trans = s.trans || "inherit"; s.items = (s.items || []).map(function(it){ it.id = it.id || uid(); it.frames = it.frames || []; return it; }); return s; });
  p.v = VERSION;
  return p;
}
function buildShell(){
  var root = h("div", {id:"studio"});
  root.innerHTML =
    '<header class="bar">' +
      '<div class="bar-brand"><img id="bar-logo" alt="Susisa"><div><b>استودیوی منوی تلویزیون</b><br><small>SUSISA · MENU STUDIO</small></div></div>' +
      '<span class="bar-sp"></span><span class="status" id="status">در حال بارگذاری…</span>' +
      '<button class="btn icon" id="b-undo" title="برگرد (Ctrl+Z)" aria-label="برگرد">↶</button>' +
      '<button class="btn icon" id="b-redo" title="دوباره (Ctrl+Shift+Z)" aria-label="دوباره">↷</button>' +
      '<button class="btn" id="b-video">خروجی MP4</button>' +
      '<button class="btn live" id="b-present">حالت نمایش ▶</button>' +
    '</header>' +
    '<div class="work">' +
      '<nav class="tabs" role="tablist" id="tabs"></nav>' +
      '<section class="panel" id="panel" role="tabpanel"></section>' +
      '<section class="pv" aria-label="پیش‌نمایش">' +
        '<div class="pv-bar"><span class="lbl">PREVIEW</span>' +
          '<button class="btn sm" id="pv-edit" aria-pressed="false">✥ ویرایش مستقیم</button>' +
          '<button class="btn sm" id="pv-play" aria-pressed="false">❚❚ توقف</button>' +
          '<button class="btn sm" id="pv-fast" aria-pressed="false">×۵ سریع</button>' +
          '<button class="btn sm" id="pv-restart">↺ از اول</button>' +
          '<button class="btn sm" id="pv-safe" aria-pressed="false">محدودهٔ امن</button>' +
          '<button class="btn sm" id="pv-grid" aria-pressed="false">شبکه</button>' +
        '</div>' +
        '<div class="pv-box" id="pv-box"></div>' +
        '<div class="pv-foot" id="pv-foot"></div>' +
      '</section>' +
    '</div>';
  document.body.appendChild(root);
  var tabs = $("#tabs");
  TABS.forEach(function(t){
    tabs.appendChild(h("button", {type:"button", class:"tab", role:"tab", "data-tab":t[0], "aria-selected": String(t[0] === CUR), onclick:function(){ openTab(t[0]); }}, [h("i", {text:t[2]}), t[1]]));
  });
  $("#b-undo").onclick = undo; $("#b-redo").onclick = redo;
  $("#b-present").onclick = enterPresent;
  $("#b-video").onclick = function(){ openTab("file"); };
  $("#pv-play").onclick = function(){ PV.paused = !PV.paused; this.setAttribute("aria-pressed", String(PV.paused)); this.textContent = PV.paused ? "▶ ادامه" : "❚❚ توقف"; if (PV.stage) PV.stage.engine.pause(PV.paused); };
  $("#pv-fast").onclick = function(){ PV.speed = PV.speed > 1 ? 1 : 5; this.setAttribute("aria-pressed", String(PV.speed > 1)); refreshPreview(); };
  $("#pv-restart").onclick = function(){ refreshPreview(); };
  $("#pv-edit").onclick = function(){ ED.pinned = !ED.on; if (!ED.pinned && CUR === "design") openTab("menu"); else setEditMode(); };
  $("#pv-safe").onclick = function(){ PV.safe = !PV.safe; this.setAttribute("aria-pressed", String(PV.safe)); refreshPreview(); };
  $("#pv-grid").onclick = function(){ PV.grid = !PV.grid; this.setAttribute("aria-pressed", String(PV.grid)); refreshPreview(); };
  document.addEventListener("keydown", function(e){
    if (PR) return;
    if (edKey(e)){ e.preventDefault(); return; }
    var mod = e.ctrlKey || e.metaKey, k = (e.key || "").toLowerCase();
    if (mod && k === "z"){ e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
    else if (mod && k === "y"){ e.preventDefault(); redo(); }
  });
  if (window.ResizeObserver) new ResizeObserver(function(){ layoutPreview(); }).observe($("#pv-box"));
  else window.addEventListener("resize", layoutPreview);
}

function boot(){
  buildShell();
  var emb = null, el = $("#embedded");
  if (el){ try { emb = JSON.parse(el.textContent); } catch(e){} }
  dbOpen().then(function(){ return dbGet("project"); }).then(function(saved){
    var pick = saved;
    if (emb && (!saved || (emb.updated || 0) > (saved.updated || 0))) pick = emb;
    P = migrate(pick ? pick : defaultProject());
    applyTextCSS(P);
    $("#bar-logo").src = asset(P.brand.logo) || LOGO_DEFAULT;
    $("#status").textContent = dbOK ? "ذخیرهٔ خودکار فعال است" : "ذخیرهٔ خودکار در دسترس نیست";
    if (!dbOK) $("#status").className = "status bad";
    renderPanel(); refreshPreview(); updUndo();
    dbSet("project", P);
    if (P.settings.startPresent || location.hash === "#present") enterPresent();
  });
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
