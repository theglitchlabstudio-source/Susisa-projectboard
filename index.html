<style>
/* برد سوسیسا v6 — میز کار. لایه: هدر چسبان + ناوبری (پایین روی گوشی، بالا روی لپ‌تاپ) + نما + پنل تسک (کشوی کناری/برگهٔ پایین) */
:root{
  --bg:#FFF6E8; --card:#FFFFFF; --card2:#FFF1DC; --ink:#22140F; --mute:#7C6658; --line:#EEDDC6;
  --red:#CC0212; --red2:#A30010; --onred:#FFFFFF; --mustard:#E9A800; --pickle:#3B8C47; --claude:#C8613F; --blue:#2F6FD0; --violet:#7B4FB8;
  --late:#CC0212; --soon:#C27C00; --ok:#3B8C47;
  --sh:0 1px 0 rgba(60,20,0,.06), 0 8px 24px -16px rgba(60,20,0,.35);
  --r:14px; --fd:"Lalezar","Vazirmatn",Tahoma,sans-serif; --fb:"Vazirmatn",Tahoma,sans-serif;
  --nav-h:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15100E; --card:#1F1815; --card2:#2A201B; --ink:#F7ECE2; --mute:#AD988A; --line:#382B24;
  --red:#FF3B47; --red2:#FF6B74; --onred:#1A0A0A; --mustard:#F3C033; --pickle:#62BE6E; --claude:#E48A68; --blue:#6EA2F2; --violet:#B08AE8;
  --late:#FF5A64; --soon:#F3B133; --ok:#62BE6E; --sh:0 1px 0 rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.9); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#15100E; --card:#1F1815; --card2:#2A201B; --ink:#F7ECE2; --mute:#AD988A; --line:#382B24;
  --red:#FF3B47; --red2:#FF6B74; --onred:#1A0A0A; --mustard:#F3C033; --pickle:#62BE6E; --claude:#E48A68; --blue:#6EA2F2; --violet:#B08AE8;
  --late:#FF5A64; --soon:#F3B133; --ok:#62BE6E; --sh:0 1px 0 rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.9); color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.7 var(--fb);direction:rtl;-webkit-tap-highlight-color:transparent;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
/* هدر */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font:400 26px/1 var(--fd);color:var(--red);letter-spacing:.01em}
.brand span{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.count{font-size:12px;font-weight:700;background:var(--red);color:var(--onred);border-radius:999px;padding:3px 10px;white-space:nowrap}
.ib{border:0;background:transparent;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.ib:hover{background:var(--card2)}
.ib svg{width:20px;height:20px}
.net{width:10px;height:10px;border-radius:50%;background:var(--mute);flex:none}
.net.on{background:var(--ok)} .net.err{background:var(--late)} .net.off{background:var(--mustard)}
.me{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px;font-weight:600}
/* ناوبری */
.nav{position:fixed;bottom:0;inset-inline:0;z-index:45;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute);position:relative}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--red)}
.nav .dot{position:absolute;top:8px;inset-inline-start:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--claude);color:#fff;font-size:10px;line-height:16px;padding:0 4px}
@media (min-width:900px){
  body{padding-bottom:0}
  .nav{position:sticky;top:56px;bottom:auto;height:auto;border-top:0;border-bottom:1px solid var(--line);background:var(--bg);padding:0 max(16px,calc((100% - 1240px)/2 + 16px));gap:4px;z-index:39}
  .nav button{flex:none;flex-direction:row;gap:6px;font-size:14px;padding:10px 14px;border-bottom:3px solid transparent}
  .nav button svg{width:18px;height:18px}
  .nav button[aria-current="page"]{border-color:var(--red)}
  .nav .dot{position:static}
}
main{padding-block:16px 40px}
h1,h2,h3{margin:0;text-wrap:balance}
.h1{font:400 30px/1.25 var(--fd)}
.h2{font:400 21px/1.3 var(--fd);display:flex;align-items:center;gap:8px}
.h2 small{font:500 12px var(--fb);color:var(--mute)}
.muted{color:var(--mute)}
.small{font-size:13px}
.empty{color:var(--mute);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:12px;text-align:center}
/* میز کار */
.hello{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 16px;margin-bottom:14px}
.hello .h1 span{color:var(--red)}
.hello .d{color:var(--mute);font-size:14px}
.gates{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:thin}
.gate{flex:none;min-width:150px;max-width:190px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;position:relative;cursor:pointer;text-align:right}
.gate::after{content:"";position:absolute;inset-block:8px;inset-inline-start:-1px;border-inline-start:2px dashed var(--line)}
.gate b{display:block;font-size:13px}
.gate small{color:var(--mute);font-size:12px}
.gate .bar{height:4px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}
.gate .bar i{display:block;height:100%;background:var(--pickle)}
.gate.now{border-color:var(--red)} .gate.done{opacity:.6} .gate.late{border-color:var(--late)}
.grid{display:grid;gap:16px}
@media (min-width:900px){.grid.desk{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);min-width:0}
.panel>.h2{margin-bottom:10px}
.panel.claude{border-color:color-mix(in srgb,var(--claude) 55%,var(--line))}
.panel.claude>.h2{color:var(--claude)}
.sec{margin-top:12px}
.sec>h4{margin:0 0 6px;font-size:13px;color:var(--mute);font-weight:700;display:flex;gap:6px;align-items:center}
.sec>h4 .n{background:var(--card2);border-radius:999px;padding:0 8px;font-size:12px}
.sec.late>h4{color:var(--late)}
/* ردیف تسک */
.tl{list-style:none;margin:0;padding:0}
.tr{display:flex;align-items:flex-start;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.tr:last-child{border-bottom:0}
.tr:hover{background:var(--card2)}
.ck{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--mute);background:transparent;display:grid;place-items:center;margin-top:2px;padding:0}
.ck svg{width:14px;height:14px;opacity:0}
.tr.done .ck{background:var(--pickle);border-color:var(--pickle);color:#fff}
.tr.done .ck svg{opacity:1}
.tr.done .tt{text-decoration:line-through;color:var(--mute)}
.tb{flex:1;min-width:0}
.tt{font-weight:600;line-height:1.55;word-break:break-word}
.tm{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--mute);margin-top:2px;align-items:center}
.sv{display:inline-flex;align-items:center;gap:4px}
.sv::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;border:1px solid currentColor;line-height:18px}
.tag.late{color:var(--late)} .tag.soon{color:var(--soon)} .tag.blocked{color:var(--violet)} .tag.missed{color:var(--soon);border-color:var(--soon)} .tag.rise{color:var(--late)} .tag.urgent{background:var(--late);color:#fff;border-color:var(--late)}
.tag.kG{color:var(--ink)} .tag.kD{color:var(--soon)} .tag.kE{color:var(--red)} .tag.kI{color:var(--blue)}
.who{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:var(--c);overflow:hidden}
.who img{width:100%;height:100%;object-fit:cover}
.due{flex:none;font-size:12px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums;margin-top:3px}
.due.late{color:var(--late);font-weight:700}
/* صندوق Claude */
.prop{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--bg)}
.prop .pt{font-weight:700;cursor:pointer}
.prop .pn{font-size:13px;color:var(--mute);white-space:pre-wrap;max-height:4.8em;overflow:hidden;margin-top:4px}
.prop.open .pn{max-height:none}
.prop .pa{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.prop .st{font-size:12px;font-weight:700}
.prop .st.ok{color:var(--ok)} .prop .st.no{color:var(--late)}
.note{border-inline-start:3px solid var(--claude);padding:4px 12px;white-space:pre-wrap;font-size:14px}
.note.clip{max-height:9.5em;overflow:hidden;position:relative}
.note.clip::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3em;background:linear-gradient(transparent,var(--card))}
/* دکمه‌ها */
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--red);border-color:var(--red);color:var(--onred)}
.btn.ok{background:var(--pickle);border-color:var(--pickle);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{font-size:13px;padding:3px 10px;min-height:30px}
.btn.danger{color:var(--late)}
.btn svg{width:16px;height:16px}
.in,.sel,textarea.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;font-size:14px;min-height:38px}
textarea.in{resize:vertical;line-height:1.7}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
/* برنامه */
.bar2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.svcb{margin-bottom:14px}
.svch{display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 2px}
.svch .nm{font:400 19px/1.3 var(--fd)}
.svch .pr{flex:1;max-width:220px;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.svch .pr i{display:block;height:100%;background:var(--c)}
.svch .cnt{font-size:12px;color:var(--mute);white-space:nowrap}
.stg{font-size:12px;font-weight:700;color:var(--red);margin:10px 4px 2px}
/* تقویم */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:12px;color:var(--mute);text-align:center;font-weight:700}
.cell{min-height:104px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell.off{opacity:.45}
.cell.today{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.cell.open{background:var(--card2)}
.cell.fri{background:var(--card2)}
.cell .dn{font-size:12px;font-weight:700;color:var(--mute);display:flex;justify-content:space-between}
.cell.over{outline:2px dashed var(--red)}
.dghost{position:fixed;z-index:200;pointer-events:none;font-size:12px;background:var(--red);color:#fff;border-radius:8px;padding:2px 8px;box-shadow:var(--sh)}
.ag-day{margin-bottom:10px}
.ag-day h4{margin:0 0 4px;font-size:14px;display:flex;gap:8px;align-items:baseline}
.ag-day h4 small{color:var(--mute);font-weight:500}
.ag-day.today h4{color:var(--red)}
/* گفتگو */
.feed{list-style:none;padding:0;margin:0}
.fi{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.fi .fb{flex:1;min-width:0}
.fi .fh{font-size:12px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.fi .fh b{color:var(--ink);font-size:13px}
.fi .fx{white-space:pre-wrap;word-break:break-word;font-size:14px}
.fi.cl .fx{border-inline-start:3px solid var(--claude);padding-inline-start:10px}
.lnk{color:var(--red);cursor:pointer;font-weight:600;background:none;border:0;padding:0;font-size:12px;text-align:right}
.compose{display:flex;gap:8px;align-items:flex-end;margin-bottom:12px}
.compose textarea{flex:1}
/* فایل‌ها و تنظیمات */
.bfd summary{cursor:pointer;padding:4px 0}.bftx{white-space:pre-wrap;font-size:12.5px;line-height:1.9;background:var(--card2,rgba(127,127,127,.08));border-radius:10px;padding:10px 12px;max-height:340px;overflow:auto;direction:rtl}
.fpage .grp{margin:16px 0 8px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}.fpage .grp i{width:10px;height:10px;border-radius:50%;display:inline-block}.fpage .grp small{font-weight:500;color:var(--mute)}
.fpage .fc .fa{display:flex;gap:4px;padding:0 6px 8px;flex-wrap:wrap}.fpage .fc .fa .btn{flex:1;min-width:0;padding:3px 4px;font-size:12px;min-height:32px;justify-content:center}.fpage .fc .fa .btn svg{width:14px;height:14px}
.fpage .fc .fm .sub{display:block;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vbadge{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:0 7px;font-size:11px;font-weight:700;color:var(--mute);margin-inline-start:4px}
.dayp .dnav{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0;margin:0 0 6px}.dayp .dnav .btn svg{width:16px;height:16px}
.dhead{margin-bottom:10px}.dsec{margin:18px 0 8px}.dsec2{margin-top:16px}.dsec2 summary{cursor:pointer}
.dcard{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--c);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.dcard .dh{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.dcard .dt{display:block;width:100%;text-align:start;border:0;background:none;padding:6px 0 4px;font-size:17px;font-weight:700;line-height:1.7;color:var(--ink);cursor:pointer}
.dcard .dm{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--mute);align-items:center}.dcard .dm .sel{min-height:32px;padding:2px 8px;font-size:13px;width:auto}
.dcard .dw{margin-top:6px;font-size:13px;color:var(--late)}.dcard .dn2{margin-top:8px;font-size:13.5px;line-height:1.9;white-space:pre-wrap;color:var(--ink);opacity:.85;unicode-bidi:plaintext}
.cell .dnb{border:0;background:none;padding:0 4px;font:inherit;color:inherit;cursor:pointer;border-radius:6px}.cell .dnb:hover{background:var(--card2)}.cell{cursor:pointer}
.ag-day h4 .dlk{border:0;background:none;font:inherit;color:inherit;cursor:pointer;padding:0}.tag.sh{background:color-mix(in srgb,var(--claude) 14%,transparent);color:var(--claude)}
.withc{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.lg .day{margin:18px 0 6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.lg .day b{font-size:15px}.lg .day small{color:var(--mute)}
.newbox{border:1px solid var(--claude);border-radius:14px;padding:10px 12px;margin:10px 0;background:color-mix(in srgb,var(--claude) 6%,var(--card))}.newbox .row{gap:6px}
.fview{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column}.fview[hidden]{display:none}
.fvh{display:flex;gap:6px;align-items:center;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}.fvh b{flex:1;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.fvh .btn{min-height:34px;padding:3px 10px;font-size:13px}
.fvv{display:flex;gap:6px;padding:6px 12px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--card2)}
.fvbody{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;align-items:flex-start;-webkit-overflow-scrolling:touch}
.fvfr{width:100%;height:100%;border:0;background:#fff}.fvimg{max-width:100%;max-height:100%;object-fit:contain;margin:auto}.fvmedia{max-width:100%;margin:auto}
.fvtx{white-space:pre-wrap;word-break:break-word;padding:16px;font-size:13.5px;line-height:1.95;max-width:920px;width:100%;unicode-bidi:plaintext}.fvmsg{margin:auto;padding:24px;text-align:center;color:var(--mute);line-height:2}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}

var debT={};
function touch(t, keys, quiet){
  if(!canW()){ toast('فقط‌خواندنی: در «بیشتر ← اتصال» توکن GitHub را وارد کنید'); return false; }
  t.upd=Date.now(); t.by=ui.me||null;
  var k=(keys||[]).concat(['upd','by']);
  if(quiet&&k.indexOf('t')>=0) logTouch(t,['t']);
  if(quiet){ var e=debT[t.id]||(debT[t.id]={keys:[],tm:null}); k.forEach(function(x){ if(e.keys.indexOf(x)<0) e.keys.push(x); }); clearTimeout(e.tm); e.tm=setTimeout(function(){ var kk=e.keys; e.keys=[]; Store.put('tasks',t,kk); },500); return true; }
  var d=debT[t.id]; if(d){ clearTimeout(d.tm); k=k.concat(d.keys); d.keys=[]; }
  Store.put('tasks',t,k); syncGates(); logTouch(t,keys||[]); return true;
}
function syncGates(){
  if(!canW()) return;
  M.tasks.forEach(function(g){ if(g.type!=='gate') return; var ds=(g.deps||[]).map(function(i){ return byId[i]; }).filter(Boolean);
    var all=ds.length&&ds.every(isDone), any=ds.some(function(x){ return isDone(x)||x.status==='doing'; }); var ns=all?'done':(any?'doing':'todo');
    if(g.status!==ns){ g.status=ns; g.doneAt=all?TODAY:null; Store.put('tasks',g,['status','doneAt']); } });
}
function setStatus(t,s){
  if(t.status===s) return; if(t.type==='gate'){ toast('وضعیت گیت از روی پیش‌نیازها حساب می‌شود'); return; }
  var warn=(stt(s).done||s==='doing')?unmet(t):[];
  var prev=t.status; t.status=s; t.doneAt=stt(s).done?TODAY:null;
  if(!touch(t,['status','doneAt'])){ t.status=prev; return; }
  logEv(t.id,stt(s).done?'done':'status','«'+t.t+'»: '+stt(prev).n+' ← '+stt(s).n);
  render(); if(warn.length) toast('هشدار: '+fa(warn.length)+' پیش‌نیاز هنوز تمام نشده');
}

/* ---------- ناظر پروژه (v14): همان قاعده‌های R1…R15 ماژول ۲۴ و tools/watch.py ---------- */
var WSEV={3:'بحرانی',2:'مهم',1:'جزئی'};
var MONEYRE=/(\d[\d,٬٫.۰-۹]*\s*(میلیون|هزار|تومان|ریال))/;
function watchdog(){
  var out=[], T=M.tasks, done=function(t){ return isDone(t); };
  var opn=T.filter(function(t){ return !isClosed(t)&&t.type!=='gate'&&!isProp(t); });
  var wst=function(d){ return d-wd(d); };
  var nmw=function(i){ return person(i).name||i; };
  function add(sev,k,text,ids,who,fix){ out.push({sev:sev,k:k,text:text,ids:ids||[],who:(who||[]).filter(function(x,i,a){ return x&&a.indexOf(x)===i; }),fix:fix||''}); }
  /* R1 شروع قبل از تمام شدن پیش‌نیاز · R2 تاریخ برعکس · R12 وابستگی به خود */
  opn.forEach(function(t){
    (t.deps||[]).forEach(function(i){ var x=byId[i]; if(!x||isClosed(x)) return;
      if(x.due!=null&&t.start!=null&&x.due>t.start) add(2,'R1','«'+t.t+'» قبل از تمام شدن «'+x.t+'» شروع می‌شود (پیش‌نیاز تا '+jd(x.due)+'، این از '+jd(t.start)+')',[t.id,x.id],[t.owner,x.owner],'موعد پیش‌نیاز را جلو بکش یا شروع این را عقب ببر');
      if(i===t.id) add(2,'R12','«'+t.t+'» به خودش وابسته است',[t.id],[t.owner],'وابستگی را بردار'); });
    if(t.start!=null&&t.due!=null&&t.start>t.due) add(2,'R2','«'+t.t+'»: شروع بعد از موعد است',[t.id],[t.owner],'تاریخ‌ها را درست کن');
  });
  /* R3 */
  var off=opn.filter(function(t){ return t.due!=null&&t.due>=TODAY&&wd(t.due)>=5; });
  if(off.length) add(1,'R3',fa(off.length)+' تسک در پنج‌شنبه یا جمعه موعد دارند (قاعده: شنبه تا چهارشنبه)',off.slice(0,8).map(function(t){ return t.id; }),off.map(function(t){ return t.owner; }),'به شنبه تا چهارشنبه ببر');
  /* R4 بار هفتگی */
  var bw={};
  opn.forEach(function(t){ if(t.due==null||t.due<TODAY-6||!t.owner||t.owner==='C') return; var p=person(t.owner); if(p.bot) return; var k=t.owner+'|'+wst(t.due); (bw[k]=bw[k]||[]).push(t); });
  Object.keys(bw).forEach(function(k){ var L=bw[k], p=k.split('|')[0], w=+k.split('|')[1], hi=L.filter(function(t){ return (PR[t.prio]||0)<=1; }).length;
    if(L.length>=9||hi>=7) add(L.length>=12?3:2,'R4','بار '+nmw(p)+' در هفتهٔ '+jd(w)+': '+fa(L.length)+' تسک ('+fa(hi)+' با اولویت بالا)',L.slice(0,6).map(function(t){ return t.id; }),[p],'بخشی را به امیرحسین یا همکار بده یا موعد را پخش کن'); });
  /* R5 */
  var late=opn.filter(function(t){ return t.due!=null&&t.due<TODAY; }), crit=late.filter(function(t){ return t.prio==='p0'; });
  if(crit.length) add(3,'R5',fa(crit.length)+' کار مسیر بحرانی عقب افتاده: '+crit.slice(0,4).map(function(t){ return '«'+t.t+'»'; }).join('، '),crit.map(function(t){ return t.id; }),crit.map(function(t){ return t.owner; }),'امروز تکلیفش را روشن کن: انجام، جابه‌جایی با دلیل یا واگذاری');
  else if(late.length) add(2,'R5',fa(late.length)+' کار عقب افتاده',late.slice(0,8).map(function(t){ return t.id; }),late.map(function(t){ return t.owner; }),'هر کدام: انجام، جابه‌جایی با دلیل یا حذف');
  /* R6 */
  var miss=opn.filter(function(t){ return t.status==='todo'&&t.start!=null&&t.start<TODAY&&!(t.due!=null&&t.due<TODAY); });
  if(miss.length>=3) add(1,'R6',fa(miss.length)+' کار تاریخ شروعش گذشته ولی هنوز شروع نشده',miss.slice(0,8).map(function(t){ return t.id; }),miss.map(function(t){ return t.owner; }),'وضعیت را «در جریان» کن یا تاریخ را اصلاح کن');
  /* R7 هفتهٔ خالی */
  var end=TODAY; T.forEach(function(t){ if(t.due!=null&&t.due>end) end=t.due; });
  var emp=[]; for(var w=wst(TODAY)+7; w<=end; w+=7){ if(!opn.some(function(t){ return t.due!=null&&t.due>=w&&t.due<w+7; })) emp.push(w); }
  if(emp.length) add(1,'R7','هفته‌هایی بدون هیچ تسک: '+emp.slice(0,5).map(jd).join('، '),[],[],'ببین کار جا افتاده یا واقعاً خالی است');
  /* R8 ورودی کارفرما · R9 تصمیم باز */
  opn.forEach(function(t){
    if(t.owner==='C'&&t.due!=null&&t.due-TODAY<=3){ var n=opn.filter(function(x){ return (x.deps||[]).indexOf(t.id)>=0; }).length; add(t.due>=TODAY?2:3,'R8','ورودی منتظر امیررضا: «'+t.t+'» ('+(t.due<TODAY?'گذشته':'تا '+jd(t.due))+') · '+fa(n)+' کار وابسته',[t.id],['M'],'ممضی در دیدار روزانه پیگیری کند'); }
    if(kindOf(t)==='D'){ var ds=opn.filter(function(x){ return (x.deps||[]).indexOf(t.id)>=0&&x.start!=null&&x.start-TODAY<=3; }); if(ds.length) add(3,'R9','تصمیم «'+t.t+'» هنوز گرفته نشده و '+fa(ds.length)+' کار تا ۳ روز دیگر منتظرش‌اند',[t.id].concat(ds.slice(0,3).map(function(x){ return x.id; })),[t.owner],'همین هفته تصمیم بگیر؛ گزینه‌ها را با فیلتر هفت بسنج'); }
  });
  /* R10 گیت */
  T.forEach(function(g){ if(g.type!=='gate'||isDone(g)||g.due==null) return;
    var ds=(g.deps||[]).map(function(i){ return byId[i]; }).filter(function(x){ return x&&!isDone(x); });
    var risky=ds.filter(function(x){ return (x.due!=null&&x.due<TODAY)||x.status==='budget'||x.status==='paused'; });
    if(g.due-TODAY<=10&&risky.length) add(3,'R10','گیت «'+g.t.replace(/^گیت\s*[۰-۹0-9]+\s*·\s*/,'')+'» ('+jd(g.due)+') در خطر: '+fa(risky.length)+' کار پیش‌نیازش عقب یا گیر است',[g.id].concat(risky.slice(0,4).map(function(x){ return x.id; })),['M'],'پیش‌نیازهای گیر را اول حل کن'); });
  /* R11 */
  var noo=opn.filter(function(t){ return !t.owner; }), nod=opn.filter(function(t){ return t.due==null&&t.start==null; });
  if(noo.length) add(2,'R11',fa(noo.length)+' تسک مسئول ندارند',noo.slice(0,6).map(function(t){ return t.id; }),[],'مسئول بده');
  if(nod.length) add(1,'R11',fa(nod.length)+' تسک باز هیچ تاریخی ندارند',nod.slice(0,6).map(function(t){ return t.id; }),nod.map(function(t){ return t.owner; }),'تاریخ بده یا متوقف کن');
  /* R13 · R14 */
  T.forEach(function(t){ if(isDone(t)&&(t.check||[]).some(function(c){ return c&&/^افزودن به برندبوک/.test(c.x||'')&&!c.done; })) add(1,'R13','«'+t.t+'» تمام شده ولی هنوز به برندبوک اضافه نشده',[t.id],[t.owner,'CL'],'گام «افزودن به برندبوک»'); });
  var leak=T.filter(function(t){ return MONEYRE.test((t.t||'')+' '+(t.notes||'')+' '+(t.briefNote||'')); });
  if(leak.length) add(3,'R14','احتمال مبلغ یا عدد مالی در متن '+fa(leak.length)+' تسک (مخزن عمومی است)',leak.slice(0,6).map(function(t){ return t.id; }),['M','CL'],'مبلغ را حذف کن؛ فقط در ولت خصوصی');
  /* R15 */
  var props=T.filter(function(t){ return isProp(t)&&!isClosed(t)&&!decisionOf(t); });
  if(props.length>=3) add(1,'R15',fa(props.length)+' پیشنهاد منتظر تصمیم ممضی است',props.slice(0,6).map(function(t){ return t.id; }),['M'],'در صندوق Claude تأیید یا رد کن');
  out.sort(function(a,b){ return b.sev-a.sev; });
  return out;
}

function mdLite(md){
