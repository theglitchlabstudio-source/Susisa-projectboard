<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>برد پروژهٔ سوسیسا</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>:root{
  --bg:#F5F2EC; --surface:#FFFFFF; --surface2:#FAF8F3; --ink:#1C1816; --muted:#7A7068; --line:#E4DED3; --line2:#EFEAE0;
  --brand:#CC0212; --brand-ink:#fff; --gold:#FAE089; --gold-ink:#5B4500;
  --main:#CC0212; --budget:#C98A12; --side:#2F8F86; --post:#5F6E94;
  --s-todo:#8D8579; --s-doing:#2F6FD0; --s-wait:#C98A12; --s-done:#2E9A60;
  --p0:#CC0212; --p1:#E0801E; --p2:#2F8F86; --p3:#9A928A;
  --shadow:0 1px 2px rgba(28,24,22,.06),0 4px 14px rgba(28,24,22,.05);
  --r:12px; --r-s:8px;
  --nav-h:62px;
}
:root[data-theme="dark"]{
  --bg:#141110; --surface:#1E1A18; --surface2:#25201D; --ink:#F3EBDC; --muted:#A39A8E; --line:#342E2A; --line2:#2B2623;
  --brand:#E8303D; --gold:#FAE089; --gold-ink:#F8E39A;
  --main:#E8303D; --budget:#E3A93A; --side:#45B3A8; --post:#8A99C2;
  --s-todo:#9A9186; --s-doing:#5B97F0; --s-wait:#E3A93A; --s-done:#47BB7D;
  --p0:#F0505B; --p1:#F09445; --p2:#45B3A8; --p3:#8A8279;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,"Segoe UI",Tahoma,sans-serif;line-height:1.7;
  -webkit-text-size-adjust:100%;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--s-doing);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- header ---------- */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:36px;height:36px;border-radius:9px;background:var(--brand);color:#FAE089;display:grid;place-items:center;font-weight:900;font-size:15px;letter-spacing:-.5px;flex:none}
.brand h1{margin:0;font-size:1rem;font-weight:800;line-height:1.2;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:.74rem;font-weight:500}
.count{margin-inline-start:auto;display:flex;align-items:center;gap:14px}
.ready{display:flex;flex-direction:column;gap:3px;min-width:150px}
.ready b{font-size:.78rem;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:7px 12px;font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;gap:6px;line-height:1.4}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 9px;font-size:.78rem}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--brand);border-color:var(--brand)}
.icon-btn{width:38px;height:38px;padding:0;justify-content:center}

/* ---------- tabs ---------- */
.tabs{position:fixed;bottom:0;inset-inline:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected=true]{color:var(--brand)}
.tab[aria-selected=true]::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
.tab .badge{position:absolute;top:7px;inset-inline-start:calc(50% + 6px);background:var(--brand);color:#fff;font-size:.62rem;min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center;padding:0 4px;font-weight:700}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:14px 16px 28px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 12px;font-size:.82rem;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:6px 10px;min-height:36px}
.search{flex:1;min-width:150px;max-width:300px}
h2.sec{font-size:.95rem;margin:22px 0 8px;font-weight:800;display:flex;align-items:center;gap:8px}
h2.sec:first-child{margin-top:0}
h2.sec .n{font-weight:600;color:var(--muted);font-size:.8rem}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px}
.muted{color:var(--muted)}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:.9rem;border:1px dashed var(--line);border-radius:var(--r)}

/* ---------- task row ---------- */
.list{display:flex;flex-direction:column;gap:6px}
.task{display:flex;align-items:flex-start;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 10px;position:relative}
.task::before{content:"";position:absolute;inset-block:8px;inset-inline-start:0;width:3px;border-radius:3px;background:var(--lane,var(--line))}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.task.gate{background:var(--surface2);border-style:dashed}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:transparent;flex:none;margin-top:1px;display:grid;place-items:center;padding:0}
.chk svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3;opacity:0}
.task.done .chk{background:var(--s-done);border-color:var(--s-done)}
.task.done .chk svg{opacity:1}
.chk:hover{border-color:var(--s-done)}
.tb{flex:1;min-width:0;cursor:pointer}
.ttl{font-weight:600;font-size:.93rem;line-height:1.55}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:3px;font-size:.76rem;color:var(--muted);align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;padding:0 7px;border-radius:99px;background:var(--surface2);border:1px solid var(--line2);font-weight:600;white-space:nowrap}
.tag.warn{background:#FFF1D6;color:#7A4B00;border-color:#EFD39A}
:root[data-theme="dark"] .tag.warn{background:#3A2C10;color:#F2C879;border-color:#5B4416}
.tag.late{background:#FDE3E4;color:#9B0B16;border-color:#F3B9BD}
:root[data-theme="dark"] .tag.late{background:#3E1417;color:#F5A0A6;border-color:#6B2329}
.tag.early{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.tag.wait{background:#FFF1D6;color:#7A4B00;border-color:#EFD39A}
:root[data-theme="dark"] .tag.wait{background:#3A2C10;color:#F2C879;border-color:#5B4416}
.pdot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--p3)}
.p0{background:var(--p0)}.p1{background:var(--p1)}.p2{background:var(--p2)}.p3{background:var(--p3)}
.own{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:.7rem;font-weight:800;color:#fff;flex:none}
.acts{display:flex;gap:4px;flex:none}
.pin{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--muted)}
.pin svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.pin[aria-pressed=true]{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.sel{border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:.76rem;font-weight:700;background:var(--surface);appearance:none;-webkit-appearance:none;cursor:pointer;color:var(--sc,var(--ink))}
.st-todo{--sc:var(--s-todo)}.st-doing{--sc:var(--s-doing)}.st-wait{--sc:var(--s-wait)}.st-done{--sc:var(--s-done)}

/* ---------- today ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:16px;background:var(--ink);color:var(--bg);border-radius:var(--r);margin-bottom:16px}
.hero h2{margin:0;font-size:1.25rem;line-height:1.4}
.hero p{margin:2px 0 0;opacity:.75;font-size:.86rem}
.big{text-align:center;padding-inline-start:16px;border-inline-start:1px solid rgba(255,255,255,.2)}
.big b{font-size:2.2rem;line-height:1;display:block;color:var(--gold);font-weight:900}
.big span{font-size:.76rem;opacity:.8}
.gatecard{padding:14px}
.gatecard h3{margin:0 0 4px;font-size:.95rem}
.gatecard .row{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-bottom:6px}
textarea.note{width:100%;min-height:96px;border:1px solid var(--line);border-radius:var(--r-s);padding:9px 10px;background:var(--surface2);resize:vertical}
.feed{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:5px;max-height:240px;overflow:auto}
.feed div{padding-inline-start:10px;border-inline-start:2px solid var(--line)}

/* ---------- board ---------- */
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:8px;min-height:140px}
.col.over{outline:2px dashed var(--s-doing)}
.col h3{margin:2px 4px 8px;font-size:.88rem;display:flex;align-items:center;gap:6px}
.col h3 .n{color:var(--muted);font-weight:600}
.col h3 i{width:9px;height:9px;border-radius:50%;background:var(--sc)}
.col .task{padding:8px}
.colpick{display:none}

/* ---------- timeline ---------- */
.tlbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tl{display:flex;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.tl-l{width:210px;flex:none;border-inline-end:1px solid var(--line);background:var(--surface)}
.tl-s{flex:1;overflow-x:auto;position:relative}
.tl-h{height:46px;position:relative;border-bottom:1px solid var(--line);background:var(--surface2)}
.tl-row{height:32px;position:relative;border-bottom:1px solid var(--line2)}
.tl-row.grp{background:var(--surface2);height:28px}
.tl-lab{height:32px;padding:0 10px;font-size:.8rem;display:flex;align-items:center;border-bottom:1px solid var(--line2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;gap:6px}
.tl-lab.grp{height:28px;background:var(--surface2);font-weight:800;font-size:.78rem;cursor:default}
.tl-lab.hd{height:46px;background:var(--surface2);border-bottom:1px solid var(--line);font-weight:800;color:var(--muted)}
.tl-lab span{overflow:hidden;text-overflow:ellipsis}
.tl-d{position:absolute;top:0;bottom:0;border-inline-start:1px solid var(--line2)}
.tl-d.off{background:rgba(125,115,105,.07)}
.tl-dn{position:absolute;bottom:2px;font-size:.66rem;color:var(--muted);width:100%;text-align:center}
.tl-m{position:absolute;top:2px;font-size:.72rem;font-weight:800;padding-inline:4px;color:var(--ink)}
.tl-bar{position:absolute;top:6px;height:20px;border-radius:6px;background:var(--lane);opacity:.9;cursor:pointer;border:0;padding:0;min-width:6px;overflow:hidden;color:#fff;font-size:.68rem;text-align:start;padding-inline:5px;white-space:nowrap}
.tl-bar.done{opacity:.35}
.tl-bar.late{outline:2px solid var(--p0);outline-offset:1px}
.tl-gate{position:absolute;top:7px;width:18px;height:18px;transform:rotate(45deg);background:var(--ink);border-radius:3px;cursor:pointer;border:0;padding:0}
.tl-gate.done{background:var(--s-done)}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--brand);z-index:2;pointer-events:none}
.tl-open{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);z-index:2;pointer-events:none}

/* ---------- brand book ---------- */
.chap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.chap{padding:14px;display:flex;flex-direction:column;gap:8px}
.chap header{display:flex;align-items:flex-start;gap:10px}
.chap .num{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none}
.chap h3{margin:0;font-size:.98rem;line-height:1.4}
.chap .ph{font-size:.74rem;font-weight:700;color:var(--muted)}
.chap ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:.84rem}
.chap li{display:flex;gap:7px;align-items:flex-start;cursor:pointer;padding:2px 0}
.chap li i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:5px}
.chap li.done i{background:var(--s-done);border-color:var(--s-done)}
.chap li.done span{color:var(--muted)}
.chap li.doing i{border-color:var(--s-doing)}
.chap li.wait i{border-color:var(--s-wait)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{padding:12px 14px}
.stat b{font-size:1.5rem;display:block;line-height:1.2;font-weight:900}
.stat span{font-size:.78rem;color:var(--muted)}

/* ---------- budget ---------- */
.bud{padding:14px;display:flex;flex-direction:column;gap:10px}
.bud header{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.bud h3{margin:0;font-size:.98rem;cursor:pointer}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.step{border:1px solid var(--line);background:var(--surface2);border-radius:7px;font-size:.7rem;font-weight:600;padding:4px 2px;text-align:center;color:var(--muted);line-height:1.35;min-height:38px}
.step.on{background:var(--budget);color:#fff;border-color:var(--budget)}
.step.past{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.bgrid label{display:flex;flex-direction:column;gap:2px;font-size:.74rem;color:var(--muted);font-weight:600}
.bgrid input{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--surface2);color:var(--ink);font-weight:500}

/* ---------- drawer ---------- */
.veil{position:fixed;inset:0;background:rgba(10,8,7,.45);z-index:60;display:none}
.veil.on{display:block}
.drawer{position:fixed;z-index:61;background:var(--surface);inset-block:0;inset-inline-start:0;width:min(480px,100%);display:none;flex-direction:column;box-shadow:var(--shadow)}
.drawer.on{display:flex}
.dh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:1rem;flex:1}
.db{padding:14px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:12px}
.df{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.fl{display:flex;flex-direction:column;gap:3px;font-size:.78rem;font-weight:700;color:var(--muted)}
.fl input,.fl select,.fl textarea{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:7px 10px;color:var(--ink);font-weight:500;font-size:.92rem}
.fl textarea{min-height:76px;resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.qd{display:flex;gap:4px;margin-top:3px}
.depbox{border:1px solid var(--line);border-radius:8px;max-height:150px;overflow:auto;background:var(--surface2);padding:4px}
.depbox label{display:flex;gap:7px;align-items:flex-start;font-size:.8rem;font-weight:500;color:var(--ink);padding:2px 4px;cursor:pointer}
.chk-i{display:flex;gap:8px;align-items:center}
.chk-i input[type=text]{flex:1}
.menu{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:200px;top:56px;inset-inline-start:12px}
.menu button{display:block;width:100%;text-align:start;border:0;background:transparent;padding:8px 10px;border-radius:7px;font-weight:600;font-size:.88rem}
.menu button:hover{background:var(--surface2)}
.toast{position:fixed;bottom:calc(var(--nav-h) + 14px);inset-inline:0;margin-inline:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:.86rem;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

/* ---------- responsive ---------- */
@media (min-width:900px){
  body{padding-bottom:0;padding-top:0}
  .tabs{position:sticky;top:57px;bottom:auto;height:auto;z-index:29;border-top:0;border-bottom:1px solid var(--line);padding:0 max(16px,calc((100vw - 1240px)/2 + 10px));
    display:flex;gap:4px;grid-template-columns:none;padding-bottom:0}
  .tab{flex-direction:row;gap:7px;padding:11px 14px;font-size:.88rem}
  .tab[aria-selected=true]::before{top:auto;bottom:0;width:auto;inset-inline:8px;height:3px;border-radius:3px 3px 0 0}
  .tab .badge{position:static;margin-inline-start:2px}
  .toast{bottom:20px}
}
@media (max-width:899px){
  .grid2{grid-template-columns:1fr}
  .cols{grid-template-columns:1fr}
  .col{display:none}.col.show{display:block}
  .colpick{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
  .ready{min-width:0;display:none}
  .hero{grid-template-columns:1fr}
  .big{border:0;padding:0;text-align:start;display:flex;align-items:baseline;gap:8px}
  .tl-l{width:130px}
  .brand small{display:none}
}
@media (max-width:520px){
  .frow3{grid-template-columns:1fr 1fr}
  .search{max-width:none}
  .btn .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.col .task,.list .task{flex-wrap:wrap}
.acts.hs{flex-basis:100%;justify-content:flex-start;padding-inline-start:34px;margin-top:-2px}
@media (min-width:900px){
  .wrap>.list .task .acts.hs{flex-basis:auto;padding:0;margin:0}
  .wrap .col .task .acts.hs{flex-basis:100%;padding-inline-start:34px;margin-top:-2px}
  .tl-l{width:270px}
}

.fl{min-width:0}.fl input,.fl select,.fl textarea{min-width:0;width:100%}
.chk-i input[type=checkbox]{width:18px;height:18px;flex:none}.chk-i input[type=text]{width:auto}
.depbox input{width:auto;flex:none;margin-top:5px}
</style>
</head>
<body>
<div id="app"></div>
<div class="veil" id="veil"></div>
<aside class="drawer" id="drawer" aria-label="ویرایش"></aside>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="file" accept="application/json" class="sr" tabindex="-1">
<script>
function div(a,b){return ~~(a/b)}
function mod(a,b){return a-~~(a/b)*b}
var BR=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function jalCal(jy){var bl=BR.length,gy=jy+621,leapJ=-14,jp=BR[0],jm,jump,leap,leapG,march,n,i;
for(i=1;i<bl;i+=1){jm=BR[i];jump=jm-jp;if(jy<jm)break;leapJ=leapJ+div(jump,33)*8+div(mod(jump,33),4);jp=jm}
n=jy-jp;leapJ=leapJ+div(n,33)*8+div(mod(n,33)+3,4);if(mod(jump,33)===4&&jump-n===4)leapJ+=1;

function fa(n){ return String(n).replace(/\d/g, function(x){ return '۰۱۲۳۴۵۶۷۸۹'[x]; }); }
function en(s){ return String(s).replace(/[۰-۹]/g, function(x){ return '۰۱۲۳۴۵۶۷۸۹'.indexOf(x); }).replace(/[٠-٩]/g, function(x){ return '٠١٢٣٤٥٦٧٨٩'.indexOf(x); }); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function wd(j){ return (j+2)%7; }

function jfull(j){ var x=d2j(j); return WD[wd(j)]+' '+fa(x.jd)+' '+MONTHS[x.jm-1]+' '+fa(x.jy); }

function parseJ(s){
  s = en(s||'').trim(); if(!s) return null;
  var p = s.split(/[\/\-.\s]+/).map(Number).filter(function(n){ return !isNaN(n); });
  var y=1405, m, dd;
  if(p.length===2){ m=p[0]; dd=p[1]; } else if(p.length===3){ y=p[0]<100?1400+p[0]:p[0]; m=p[1]; dd=p[2]; } else return undefined;
  if(m<1||m>12||dd<1||dd>31) return undefined;
  var j = j2d(y,m,dd), r = d2j(j);

}

}

  if((st.v||1) >= SEED_V) return st;
  var MAP = {0:0,1:3,2:4,3:5,4:6,5:11,6:9,7:10,8:7,9:12,10:8};
  var fresh = seedTasks(), cur = {}, seen = {};
  st.tasks.forEach(function(t){ cur[t.id]=t; });
  fresh.forEach(function(f){
    seen[f.id]=1; var c = cur[f.id];
    if(!c){ st.tasks.push(f); return; }
    c.t=f.t; c.bb=f.bb; c.deps=f.deps; c.sprint=f.sprint; c.type=f.type;
    if(f.status==='done' && c.status!=='done'){ c.status='done'; c.doneAt=f.doneAt; }
  });
  st.tasks.forEach(function(t){ if(!seen[t.id] && t.bb!=null && MAP[t.bb]!=null) t.bb = MAP[t.bb]; });
  st.v = SEED_V;
  st.log = st.log||[];
  st.log.unshift({t:Date.now(), j:TODAY, m:'ساختار برنامه با ۱۳ فصل جدید برندبوک به‌روز شد'});
  return st;
}

function logm(m){ state.log.unshift({t:Date.now(), j:TODAY, m:m}); state.log = state.log.slice(0,80); }

/* ---------- model ---------- */
function reindex(){ byId={}; state.tasks.forEach(function(t){ byId[t.id]=t; }); }
function unmet(t){ return (t.deps||[]).map(function(i){return byId[i];}).filter(function(x){ return x && x.status!=='done'; }); }
function isLate(t){ return t.type!=='gate' && t.due!=null && t.due<TODAY && t.status!=='done'; }
function syncGates(){
  state.tasks.forEach(function(g){
    if(g.type!=='gate') return;
    var ds=(g.deps||[]).map(function(i){return byId[i];}).filter(Boolean);
    var all = ds.length && ds.every(function(x){return x.status==='done';});
    var any = ds.some(function(x){return x.status==='done'||x.status==='doing';});
    if(all){ if(g.status!=='done'){ g.status='done'; g.doneAt=TODAY; } }
    else g.status = any ? 'doing' : 'todo';
  });
}
function setStatus(t, s){
  if(t.status===s) return;
  if(t.type==='gate'){ toast('وضعیت گیت از روی پیش‌نیازها حساب می‌شود'); return; }
  var warn = (s==='doing'||s==='done') ? unmet(t) : [];
  t.status=s; t.doneAt = s==='done' ? TODAY : null;
  logm((s==='done'?'انجام شد: ':'وضعیت «'+STATUS[s]+'»: ')+t.t);
  commit();
  if(warn.length) toast('هشدار: '+fa(warn.length)+' پیش‌نیاز هنوز تمام نشده');
}
function commit(){ syncGates(); save(); render(); }

function visible(t){

  if(ui.q && (t.t+' '+(t.notes||'')).indexOf(ui.q)<0) return false;
  return true;
}

function pullDraft(){

  var bb = g('f-bb'); t.bb = bb===''||bb==null ? null : Number(bb);
  var s = parseJ(g('f-start')), du = parseJ(g('f-due'));
  if(s===undefined || du===undefined){ toast('تاریخ را مثل ۱۴۰۵/۰۷/۱۳ بنویس'); return false; }
  t.start = s; t.due = du; t.notes = g('f-notes')||'';
  t.check = Array.prototype.map.call(document.querySelectorAll('[data-ct]'), function(e,i){ var c=document.querySelector('[data-ci="'+i+'"]'); return {x:e.value, done:!!(c&&c.checked)}; }).filter(function(c){return c.x.trim();});
  t.deps = Array.prototype.map.call(document.querySelectorAll('[data-dep]:checked'), function(e){ return e.getAttribute('data-dep'); });
  if(t.lane==='budget'){
    var n = parseJ(g('f-need')); if(n===undefined){ toast('تاریخ نیاز را درست بنویس'); return false; }
    t.budget = {state:Number(g('f-bstate')||0), lead:Number(en(g('f-lead')||'0'))||0, need:n, amount:g('f-amount')||'', vendor:g('f-vendor')||''};
  } else t.budget = null;
  return true;
}

  if(a==='status'){ setStatus(byId[el.getAttribute('data-id')], el.value); }
  else if(a==='owner'){ ui.owner=el.value; render(); }
  else if(a==='sprint'){ ui.sprint=el.value; render(); }
  else if(a==='bfield'){
    var t=byId[el.getAttribute('data-id')], k=el.getAttribute('data-k'), val=el.value;
    if(k==='need'){ var j=parseJ(val); if(j===undefined){ toast('تاریخ را مثل ۱۴۰۵/۰۷/۲۸ بنویس'); render(); return; } t.budget.need=j; }
    else if(k==='lead'){ t.budget.lead = Number(en(val))||0; }
    else t.budget[k]=val;
    save(); render();
  }
});
document.addEventListener('input', function(e){
  if(e.target.id==='q'){ ui.q=e.target.value.trim(); render(); }
  if(e.target.id==='daynote'){ state.days[TODAY]=e.target.value; save(); }
});
document.addEventListener('keydown', function(e){ if(e.key==='Escape' && document.getElementById('drawer').classList.contains('on')) closeDrawer(); });
document.getElementById('veil').addEventListener('click', closeDrawer);
/* drag & drop on board */
var dragId=null;
document.addEventListener('dragstart', function(e){ var t=e.target.closest && e.target.closest('.task[draggable]'); if(t){ dragId=t.getAttribute('data-id'); e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain', dragId); }catch(x){} } });
document.addEventListener('dragover', function(e){ var c=e.target.closest && e.target.closest('.col'); if(c && dragId){ e.preventDefault(); c.classList.add('over'); } });
document.addEventListener('dragleave', function(e){ var c=e.target.closest && e.target.closest('.col'); if(c) c.classList.remove('over'); });
document.addEventListener('drop', function(e){ var c=e.target.closest && e.target.closest('.col'); if(c && dragId){ e.preventDefault(); setStatus(byId[dragId], c.getAttribute('data-col')); } dragId=null; });

/* ---------- init ---------- */
TODAY = todayJ();
state = load(); reindex(); syncGates(); save();
render();
window.__board = {get state(){return state;}, render:render, ui:ui};
})();

</script>
