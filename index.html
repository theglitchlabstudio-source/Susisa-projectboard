<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>برد پروژهٔ سوسیسا</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>:root{
  --bg:#F5F2EC; --surface:#FFFFFF; --surface2:#FAF8F3; --ink:#1C1816; --muted:#7A7068; --line:#E4DED3; --line2:#EFEAE0;
  --brand:#CC0212; --brand-ink:#FFFFFF; --gold:#FAE089; --gold-ink:#5B4500; --budget:#C98A12;
  --paper:#FFFDF7; --rule:#E9E1D0; --wk:rgba(122,112,104,.09); --sel:#EAF1FD; --ok:#2E9A60; --warn:#C98A12; --bad:#CC0212;
  --shadow:0 1px 2px rgba(28,24,22,.06),0 4px 14px rgba(28,24,22,.06); --shadow-l:0 10px 40px rgba(28,24,22,.22);
  --r:12px; --r-s:8px; --nav-h:62px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141110; --surface:#1E1A18; --surface2:#25201D; --ink:#F3EBDC; --muted:#A39A8E; --line:#342E2A; --line2:#2B2623;
    --brand:#E8303D; --gold:#FAE089; --gold-ink:#F8E39A; --budget:#E3A93A; --paper:#221D1A; --rule:#312A25; --wk:rgba(243,235,220,.06); --sel:#1F2A3F;
    --ok:#47BB7D; --warn:#E3A93A; --bad:#F0505B; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); --shadow-l:0 10px 40px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141110; --surface:#1E1A18; --surface2:#25201D; --ink:#F3EBDC; --muted:#A39A8E; --line:#342E2A; --line2:#2B2623;
  --brand:#E8303D; --gold:#FAE089; --gold-ink:#F8E39A; --budget:#E3A93A; --paper:#221D1A; --rule:#312A25; --wk:rgba(243,235,220,.06); --sel:#1F2A3F;
  --ok:#47BB7D; --warn:#E3A93A; --bad:#F0505B; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); --shadow-l:0 10px 40px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,"Segoe UI",Tahoma,sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid #2F6FD0;outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.gap{flex:1}
.muted{color:var(--muted);font-size:.82rem}

/* ---------- سرصفحه (ثابت نیست) ---------- */
#page{min-width:0}
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:36px;height:36px;border-radius:9px;background:var(--brand);color:#FAE089;display:grid;place-items:center;font-weight:900;font-size:14px;flex:none}
.brand h1{margin:0;font-size:1rem;font-weight:800;line-height:1.25;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:.74rem}
.ready{display:flex;flex-direction:column;gap:3px;min-width:160px;margin-inline-start:auto}
.ready b{font-size:.76rem;font-weight:700;display:flex;justify-content:space-between;gap:10px}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
.net{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.net i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.net.on i{background:var(--ok)} .net.off i{background:var(--warn)}
.tools{display:flex;gap:6px}
.ibtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.ibtn:hover{background:var(--surface2)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn svg{width:16px;height:16px}
.fbar{background:var(--surface2);border-bottom:1px solid var(--line)}
.fb-in{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.srch{display:flex;gap:8px;flex:1 1 260px;min-width:0}
.srch input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:8px 12px;font-size:.92rem}
.fbtn{display:none}
.fsels{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.fsel{display:flex;flex-direction:column;font-size:.7rem;color:var(--muted);gap:1px;font-weight:600}
.fsel select{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:6px 8px;font-size:.84rem;color:var(--ink);max-width:190px}
.fsel select.act{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.tabs{max-width:1320px;margin:0 auto;padding:10px 16px 0;display:flex;gap:6px;overflow-x:auto}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:700;font-size:.86rem;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.tab .ic svg{width:17px;height:17px}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.view{max-width:1320px;margin:0 auto;padding:14px 16px 90px;min-width:0}

/* ---------- ابزارهای عمومی ---------- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:7px 12px;font-weight:600;font-size:.86rem;display:inline-flex;align-items:center;gap:6px;line-height:1.4}
.btn:hover{background:var(--surface2)}
.btn.sm{padding:3px 9px;font-size:.78rem}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{color:var(--bad)} .btn.danger.arm,.x.arm{background:var(--bad);color:#fff}
.btn[disabled],.in[disabled]{opacity:.5;cursor:not-allowed}
.vbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.hint{color:var(--muted);font-size:.8rem}.hint.pad{padding:10px 2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-weight:700;font-size:.82rem}
.seg button.on{background:var(--ink);color:var(--bg)}
.lbl{font-size:.8rem;color:var(--muted)}
.in{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:7px 10px;width:100%;font-size:.9rem;min-width:0}
.in.ro{display:block;border-style:dashed;color:var(--muted)}
.in.plain{border-color:transparent;background:transparent;padding:4px 6px}
.in.plain.dn{text-decoration:line-through;color:var(--muted)}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:5px 8px;font-size:.82rem;max-width:100%}
.sel.full{width:100%}.sel.st{border-color:var(--c);color:var(--c);font-weight:700}
.chip{display:inline-flex;align-items:center;font-size:.68rem;font-weight:700;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.ghost{background:transparent;border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.fl{font-size:.66rem;font-weight:800;padding:1px 7px;border-radius:6px;white-space:nowrap}
.fl-late{background:var(--bad);color:#fff}.fl-soon{background:#F6E2B0;color:#5B4500}.fl-urgent{background:#6B1AA8;color:#fff}.fl-blocked{background:var(--line);color:var(--muted)}
.av{width:26px;height:26px;border-radius:50%;color:#fff;display:inline-grid;place-items:center;font-size:.74rem;font-weight:800;flex:none}
.av.sm{width:22px;height:22px;font-size:.66rem}
.cdot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.cnt{background:var(--line);border-radius:99px;font-size:.7rem;font-weight:700;padding:0 8px}
.mi{display:inline-flex;align-items:center;gap:2px;font-size:.72rem;color:var(--muted)}.mi svg{width:13px;height:13px}
.x{border:0;background:transparent;width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;color:var(--muted);padding:0}
.x svg{width:13px;height:13px}.x:hover{background:var(--line)}
.empty{padding:26px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.dropping{outline:2px dashed var(--brand)!important;outline-offset:-2px;background:color-mix(in srgb,var(--brand) 8%,var(--surface))!important}
[data-drag]{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.dragging{opacity:.35}
.ghost-drag{position:fixed;left:0;top:0;z-index:4000;pointer-events:none;box-shadow:var(--shadow-l);opacity:.95;border-radius:10px;background:var(--surface)}
body.is-dragging{cursor:grabbing;user-select:none}

/* ---------- کارت و ستون ---------- */
.cols{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 276px;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.col>header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.col>header b{font-size:.88rem;flex:1;min-width:0}
.csub{font-size:.7rem;color:var(--muted);padding:2px 12px 0}
.cbody{padding:8px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.cempty{color:var(--muted);font-size:.78rem;text-align:center;padding:12px}
.card{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--c);border-radius:var(--r-s);padding:9px 10px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);cursor:pointer;touch-action:pan-y}
.card:hover{border-color:var(--c)}
.card.done{opacity:.68}.card.gate{border-style:dashed;cursor:pointer}
.ct{font-size:.86rem;font-weight:700;line-height:1.55;overflow-wrap:anywhere}
.cm,.cf{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.dt{font-size:.72rem;color:var(--muted)}.dt.bad{color:var(--bad);font-weight:700}

/* ---------- ردیف ---------- */
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line2);cursor:pointer;background:var(--surface)}
.row:hover{background:var(--surface2)}.row.done .rt b{text-decoration:line-through;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.rt{flex:1;min-width:0}.rt b{font-size:.86rem;overflow-wrap:anywhere}
.rm{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.rd{font-size:.72rem;color:var(--muted);white-space:nowrap}

/* ---------- امروز / سررسید ---------- */
.planner{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.page{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:6px 6px 14px 14px;padding:34px 22px 22px;box-shadow:var(--shadow);min-width:0}
.rings{position:absolute;top:-9px;inset-inline:0;display:flex;justify-content:space-evenly;pointer-events:none}
.rings i{width:14px;height:26px;border-radius:99px;background:linear-gradient(var(--surface2),var(--line));border:1px solid var(--line);box-shadow:inset 0 2px 3px rgba(0,0,0,.15)}
.pdate{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bigd{font-size:3.4rem;font-weight:900;line-height:1;color:var(--brand)}
.pwd{font-weight:800;font-size:1.1rem}.pmo{font-size:.9rem}.pgr{font-size:.72rem;color:var(--muted);direction:ltr;text-align:right}
.pnav{margin-inline-start:auto;display:flex;gap:6px}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:14px 0}
.wk{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 0;display:flex;flex-direction:column;align-items:center;line-height:1.3;min-width:0}
.wk small{color:var(--muted);font-size:.68rem}.wk b{font-size:1rem}.wk i{font-style:normal;font-size:.66rem;color:var(--brand);font-weight:800;height:14px;display:flex;gap:3px;align-items:center}
.wk i u{width:6px;height:6px;border-radius:50%;background:#2F6FD0;display:inline-block}
.wk.off{background:var(--surface2)}.wk.td{border-color:var(--brand)}.wk.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.wk.on small{color:inherit}
.note-open,.cdn-open{background:var(--brand);color:#fff;border-radius:8px;padding:2px 12px;font-size:.8rem;font-weight:800;display:inline-block;margin-bottom:8px}
.cdn-open{background:var(--gold);color:var(--gold-ink)}
.psec{margin-bottom:12px}.psec h4{margin:0 0 4px;font-size:.84rem;color:var(--muted)}.psec h4 small{background:var(--line);border-radius:99px;padding:0 7px}
.psec.lt h4{color:var(--bad)}
.psec .row{background:transparent}
.padd{margin-top:10px}
.ph{font-size:.95rem;margin:18px 0 8px}.ph:first-of-type{margin-top:0}.ph small{color:var(--muted);font-weight:500;font-size:.74rem;margin-inline-start:6px}
.lined{background-image:repeating-linear-gradient(transparent 0 33px,var(--rule) 33px 34px);background-position:0 8px;border-radius:6px;padding:2px 4px;min-height:80px}
.nt{display:flex;gap:8px;padding:6px 0;line-height:1.7}
.nt.tip{background:color-mix(in srgb,var(--gold) 38%,var(--paper));border-radius:8px;padding:6px 8px;margin:4px 0}
.nt0{color:var(--muted);padding:10px 4px;font-size:.84rem}
.nb{flex:1;min-width:0}.nh,.ch{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.74rem;color:var(--muted)}.nh b,.ch b{color:var(--ink)}
.nh .x,.ch .x{margin-inline-start:auto}
.tg{background:var(--gold);color:var(--gold-ink);border-radius:6px;padding:0 6px;font-weight:800}
.nx,.cx{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.88rem}
.compose{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.compose textarea,.tw textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:8px 10px;resize:vertical;width:100%}
.crow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.crow .meSel{flex:1;min-width:120px}
.feed{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.cmt{display:flex;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.cb{flex:1;min-width:0}
.tl{font-size:.72rem;font-weight:700;color:#2F6FD0;cursor:pointer;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}.tl.gen{color:var(--muted)}

/* ---------- تقویم دیواری ---------- */
.mnav{display:flex;align-items:center;gap:8px}.mnav b{min-width:120px;text-align:center;font-size:1.05rem}
.cal{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-h{background:var(--ink);color:var(--bg);font-weight:800;font-size:.8rem;text-align:center}.cal-h div{padding:6px 0}.cal-h .off{opacity:.65}
.cd{min-height:118px;border:1px solid var(--line2);border-width:0 0 1px 1px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;background:color-mix(in srgb,var(--pc) 6%,var(--paper))}
.cd.out{background:var(--surface2);cursor:default}.cd.off{background:color-mix(in srgb,var(--pc) 6%,var(--surface2))}
.cd.today{box-shadow:inset 0 0 0 2px var(--brand)}.cd.sel{background:var(--sel)}
.cd.opening{box-shadow:inset 0 0 0 2px var(--budget)}
.cdn{display:flex;align-items:center;gap:4px;font-size:.78rem;min-height:22px}.cdn .n{font-weight:800;font-size:.9rem}
.cdn u{width:6px;height:6px;border-radius:50%;background:#2F6FD0}
.phtag{font-size:.6rem;font-weight:800;background:var(--c);color:#fff;border-radius:5px;padding:0 5px;white-space:nowrap}.phtag.op{background:var(--brand)}
.cadd{margin-inline-start:auto;border:0;background:transparent;color:var(--muted);width:20px;height:20px;border-radius:5px;padding:0;opacity:0;font-size:1rem;line-height:1}
.cd:hover .cadd{opacity:1}
.ct-chip{background:color-mix(in srgb,var(--c) 18%,var(--surface));border-inline-start:3px solid var(--c);border-radius:5px;padding:1px 6px;font-size:.7rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.ct-chip.done{text-decoration:line-through;opacity:.6}.ct-chip.gate{background:var(--ink);color:var(--bg);border-color:var(--brand)}
.more{border:0;background:transparent;font-size:.68rem;color:#2F6FD0;font-weight:700;text-align:start;padding:0 4px}
.daypanel{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}.daypanel h4{margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- گانت ---------- */
.gantt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.g-scroll{overflow:auto;max-height:72vh;direction:rtl}
.g-in{position:relative}
.g-head{display:flex;position:sticky;top:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--line)}
.g-lab{width:200px;flex:none;position:sticky;right:0;z-index:3;background:var(--surface);border-left:1px solid var(--line);padding:0 8px;display:flex;align-items:center;gap:6px;font-size:.78rem;overflow:hidden;cursor:pointer}
.g-lab span,.g-lab b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-lab.hd0{font-weight:800;cursor:default}
.g-area{position:relative;flex:none;height:32px}
.g-head .g-area{height:auto}
.gm-row,.gp-row,.gd-row{position:relative;height:20px}
.gm,.gp,.gd{position:absolute;top:0;height:20px;font-size:.66rem;text-align:center;overflow:hidden;white-space:nowrap}
.gm{font-weight:800;background:var(--surface2);border-left:1px solid var(--line);line-height:20px}
.gp{background:color-mix(in srgb,var(--c) 22%,var(--surface));color:var(--c);font-weight:800;line-height:20px;border-left:1px solid var(--surface)}
.gd{color:var(--muted);line-height:20px;font-size:.62rem}.gd.off{background:var(--wk)}.gd.td{background:var(--brand);color:#fff;font-weight:800;border-radius:4px}
.g-row,.g-grp{display:flex;border-bottom:1px solid var(--line2)}
.g-grp{background:var(--surface2);height:28px}.g-grp .g-lab{background:var(--surface2);cursor:default}.g-grp .g-area{height:28px}
.g-row:hover .g-lab{background:var(--surface2)}
.g-bar{position:absolute;top:5px;height:22px;border-radius:6px;background:var(--c);color:#fff;font-size:.68rem;display:flex;align-items:center;padding:0 9px;overflow:hidden;white-space:nowrap;cursor:grab;touch-action:none;user-select:none}
.g-bar span{overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.g-bar.done{opacity:.45}.g-bar.late{box-shadow:0 0 0 2px var(--bad)}.g-bar.gate{background:var(--ink);color:var(--bg);border-radius:4px}.g-bar.drag{opacity:.8;box-shadow:var(--shadow-l);z-index:5}
.g-bar i{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}.g-bar .hs{right:0}.g-bar .hd{left:0}
.g-bar i:hover{background:rgba(255,255,255,.35)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--brand);opacity:.7;pointer-events:none;z-index:2}
.g-body{position:relative}

/* ---------- برندبوک و جدول ---------- */
.chap{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.cp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.cp header{display:flex;align-items:center;gap:10px;margin-bottom:8px}.cp header div{flex:1;min-width:0}.cp header small{display:block;color:var(--muted);font-size:.72rem}
.cn{width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--gold);display:grid;place-items:center;font-weight:900;flex:none}.pc{font-weight:800;font-size:.84rem}
.cp .bar{margin-bottom:6px}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

/* ================= STORE: محلی یا ابری ================= */
var Store = (function(){
  var mode = 'local', db = null, ass = null, dl = null, usr = null;
  var canW = true, onRemote = function(){}, onErr = function(m){ try{console.warn(m);}catch(e){} };
  var M = {cfg:null, tasks:[], notes:[], comments:[]};
  var LSK = 'susisa-board-v4', LEG = 'susisa-board-v1';
  var pend = {}, busy = {}, saveT = null;
  var ready = false;

  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  /* ---------- فایل‌های محلی (IndexedDB) ---------- */
  function idbOpen(){
    return new Promise(function(res, rej){
      try{
        var r = indexedDB.open('susisa-files', 1);
        r.onupgradeneeded = function(){ r.result.createObjectStore('f'); };
        r.onsuccess = function(){ res(r.result); };
        r.onerror = function(){ rej(r.error); };
      }catch(e){ rej(e); }
    });
  }
  function idbPut(id, blob){
    return idbOpen().then(function(d){ return new Promise(function(res, rej){
      var tx = d.transaction('f', 'readwrite'); tx.objectStore('f').put(blob, id);
      tx.oncomplete = function(){ res(); }; tx.onerror = function(){ rej(tx.error); };
    }); });
  }
  function idbGet(id){
    return idbOpen().then(function(d){ return new Promise(function(res, rej){
      var rq = d.transaction('f', 'readonly').objectStore('f').get(id);
      rq.onsuccess = function(){ res(rq.result); }; rq.onerror = function(){ rej(rq.error); };
    }); });
  }
  function idbDel(id){
    return idbOpen().then(function(d){ return new Promise(function(res){
      var tx = d.transaction('f', 'readwrite'); tx.objectStore('f').delete(id);
      tx.oncomplete = function(){ res(); }; tx.onerror = function(){ res(); };
    }); }).catch(function(){});
  }
  var urlCache = {};
  function fileUrl(f){
    if(f.kind === 'asset') return Promise.resolve('/_blob/' + f.id);
    if(f.kind === 'idb'){
      if(urlCache[f.id]) return Promise.resolve(urlCache[f.id]);
      return idbGet(f.id).then(function(b){ if(!b) return ''; return (urlCache[f.id] = URL.createObjectURL(b)); }).catch(function(){ return ''; });
    }
    return Promise.resolve(f.url || '');
  }
  function toDataUrl(file){
    return new Promise(function(res, rej){ var r = new FileReader(); r.onload = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; r.readAsDataURL(file); });
  }
  function upload(file){
    var base = {name:file.name || 'file', type:file.type || '', size:file.size || 0};
    if(mode === 'cloud'){
      if(!ass) return Promise.reject({code:'no_assets', message:'ذخیرهٔ فایل در این نمایش فعال نیست'});
      return ass.upload(file).then(function(r){ return Object.assign(base, {kind:'asset', id:r.id, type:r.contentType || base.type, size:r.sizeBytes || base.size}); });
    }
    var id = 'f' + Date.now().toString(36) + Math.floor(Math.random() * 1e5).toString(36);
    return idbPut(id, file).then(function(){ return Object.assign(base, {kind:'idb', id:id}); }).catch(function(){
      if(file.size > 1500000) return Promise.reject({code:'too_big', message:'این مرورگر ذخیرهٔ فایل بزرگ را نمی‌پذیرد'});
      return toDataUrl(file).then(function(u){ return Object.assign(base, {kind:'data', id:'d' + Date.now().toString(36), url:u}); });
    });
  }
  function removeFile(f){
    if(f.kind === 'idb') return idbDel(f.id);
    if(f.kind === 'asset' && ass && ass.delete) return ass.delete(f.id).catch(function(){});
    return Promise.resolve();
  }

  /* ---------- ذخیرهٔ محلی ---------- */
  function saveLocal(){
    clearTimeout(saveT);
    saveT = setTimeout(function(){
      try{ localStorage.setItem(LSK, JSON.stringify(M)); }catch(e){ onErr('ذخیرهٔ محلی ناموفق بود'); }
    }, 120);
  }
  function readLocal(){
    try{ var r = localStorage.getItem(LSK); if(r){ var s = JSON.parse(r); if(s && s.tasks && s.cfg) return s; } }catch(e){}
    return null;
  }
  function readLegacy(){
    try{ var r = localStorage.getItem(LEG); if(r){ var s = JSON.parse(r); if(s && s.tasks) return s; } }catch(e){}
    return null;
  }

  /* ---------- نوشتن ابری ---------- */
  function pathOf(kind, id){ return kind === 'cfg' ? 'cfg/main' : kind + '/' + id; }
  function writeOnce(path, data, keys){
    var ref = db.doc(path);
    if(data === null) return ref.delete();
    if(keys && keys.length){
      var u = {}; keys.forEach(function(k){ u[k] = data[k] === undefined ? null : data[k]; });
      return ref.update(u).catch(function(e){ if(e && e.code === 'invalid_argument') return ref.set(clone(data)); throw e; });
    }
    return ref.set(clone(data));
  }
  async function writeRetry(path, data, keys){
    var tries = 0;
    for(;;){
      try{ await writeOnce(path, data, keys); return; }
      catch(e){
        tries++;
        var c = e && e.code;
        if((c === 'unavailable' || c === 'resource_exhausted') && tries < 4){ await sleep(500 * tries + Math.random() * 400); continue; }
        if(keys && c !== 'invalid_argument' && tries < 2){ keys = null; continue; }
        throw e;
      }
    }
  }
  function qwrite(kind, obj, keys, del){
    var path = pathOf(kind, obj.id);
    var item = pend[path];
    if(item && !del && !item.del && item.keys && keys){ keys = item.keys.concat(keys.filter(function(k){ return item.keys.indexOf(k) < 0; })); }
    else if(item && !del && !item.del && item.keys && !keys){ keys = null; }
    pend[path] = {data: del ? null : clone(obj), keys: keys, del: !!del};
    if(busy[path]) return;
    busy[path] = true;
    (async function loop(){
      while(pend[path]){
        var it = pend[path]; pend[path] = null;
        try{ await writeRetry(path, it.data, it.keys); }
        catch(e){ canW = (e && e.code === 'invalid_argument') ? false : canW; onErr('ذخیره نشد: ' + ((e && e.message) || 'خطا') + (e && e.code === 'invalid_argument' ? ' (دسترسی نوشتن ندارید)' : '')); }
      }
      busy[path] = false;
    })();
  }
  function isPending(path){ return !!(pend[path] || busy[path]); }

  /* ---------- دریافت ابری ---------- */
  function sameJSON(a, b){ try{ return JSON.stringify(a) === JSON.stringify(b); }catch(e){ return false; } }
  function listFor(kind){ return kind === 'tasks' ? M.tasks : kind === 'notes' ? M.notes : M.comments; }
  function applyDoc(kind, id, data){
    var list = listFor(kind), i = -1;
    for(var k = 0; k < list.length; k++) if(list[k].id === id){ i = k; break; }
    if(isPending(kind + '/' + id)) return false;
    if(data === null){ if(i >= 0){ list.splice(i, 1); return true; } return false; }
    data.id = id;
    if(i < 0){ list.push(data); return true; }
    if(sameJSON(list[i], data)) return false;
    list[i] = data; return true;
  }
  function subColl(kind){
    return new Promise(function(res){
      var first = true;
      db.collection(kind).onSnapshot(function(snap){
        var changed = false;
        snap.docChanges().forEach(function(ch){
          var d = ch.doc.data ? ch.doc.data() : null;
          var id = ch.doc.id;
          if(ch.type === 'removed') changed = applyDoc(kind, id, null) || changed;
          else if(d) changed = applyDoc(kind, id, clone(d)) || changed;
        });
        if(first){ first = false; res(); }
        else if(changed) onRemote(kind);
      }, function(e){ onErr('اتصال به دادهٔ مشترک قطع شد: ' + (e && e.message)); if(first){ first = false; res(); } });
    });
  }
  function subCfg(){
    return new Promise(function(res){
      var first = true;
      db.doc('cfg/main').onSnapshot(function(snap){
        var d = snap.exists ? snap.data() : null;
        if(d){ d.id = 'main'; if(!sameJSON(M.cfg, d) && !isPending('cfg/main')){ M.cfg = d; if(!first) onRemote('cfg'); } }
        if(first){ first = false; res(); }
      }, function(e){ onErr('اتصال به تنظیمات قطع شد'); if(first){ first = false; res(); } });
    });
  }

  async function seedCloud(cfg, tasks){
    qwrite('cfg', cfg, null);
    var i = 0;
    async function worker(){
      while(i < tasks.length){ var t = tasks[i++]; try{ await writeRetry(pathOf('tasks', t.id), t, null); }catch(e){ onErr('بذر داده ناموفق: ' + (e && e.message)); } }
    }
    await Promise.all([worker(), worker(), worker(), worker()]);
  }

  /* ---------- API ---------- */
  var api = {
    get M(){ return M; },
    get mode(){ return mode; },
    get canWrite(){ return canW; },
    get dl(){ return dl; },
    get usr(){ return usr; },
    onRemote: function(f){ onRemote = f; },
    onError: function(f){ onErr = f; },
    fileUrl: fileUrl, upload: upload, removeFile: removeFile,
    init: async function(seedFn){
      var cl = (typeof window !== 'undefined') ? window.claude : null;
      if(cl && cl.use){
        try{ db = await cl.use('db'); }catch(e){ db = null; }
        try{ ass = await cl.use('assets'); }catch(e){ ass = null; }
        try{ dl = await cl.use('downloads'); }catch(e){ dl = null; }
        try{ usr = await cl.use('user'); }catch(e){ usr = null; }
      }
      if(db){
        mode = 'cloud';
        try{ if(usr && usr.can){ var w = await usr.can('data.write'); if(w === false) canW = false; } }catch(e){}
        await Promise.all([subCfg(), subColl('tasks'), subColl('notes'), subColl('comments')]);
        if(!M.cfg && M.tasks.length === 0){
          var s = seedFn();
          if(canW){ M.cfg = s.cfg; M.tasks = s.tasks; M.notes = s.notes || []; M.comments = []; api.seeding = seedCloud(s.cfg, s.tasks); }
          else { M.cfg = s.cfg; M.tasks = s.tasks; api.empty = true; }
        } else if(!M.cfg){ M.cfg = seedFn().cfg; if(canW) qwrite('cfg', M.cfg, null); }
        ready = true; return M;
      }
      mode = 'local';
      var st = readLocal();
      if(st){ M = st; }

      (j===OPEN?'<span class="phtag op">افتتاحیه</span>':'')+'<button class="cadd" data-act="newtask" data-due="'+j+'" aria-label="تسک جدید">+</button></div>';

var DW = 24, LW = 200;

  var items = M.tasks.filter(visible).filter(function(t){ return t.start!=null || t.due!=null; });

  var dh=''; for(var d=mn; d<=mx; d++){ dh += '<div class="gd'+((wd(d))>=5?' off':'')+(d===TODAY?' td':'')+'" style="right:'+((d-mn)*DW)+'px;width:'+DW+'px">'+fa(d2j(d).jd)+'</div>'; }
  var pb = phasesSorted().map(function(p){ var a=Math.max(p.a,mn), b=Math.min(p.b,mx); if(b<a) return ''; return '<div class="gp" style="right:'+((a-mn)*DW)+'px;width:'+((b-a+1)*DW)+'px;--c:'+p.c+'">'+esc(p.n)+'</div>'; }).join('');
  var wkBg = 'background-image:linear-gradient(to left,transparent '+(5*DW)+'px,var(--wk) '+(5*DW)+'px);background-size:'+(7*DW)+'px 100%;background-position:right '+(-wd(mn)*DW)+'px top';
  var body='';

    var arr = items.filter(c.test).sort(function(a,b){ return ((a.start!=null?a.start:a.due)-(b.start!=null?b.start:b.due)) || cmp(a,b); });
    if(!arr.length) return;
    body += '<div class="g-grp" style="--c:'+c.c+'"><div class="g-lab gh"><i class="cdot"></i><b>'+esc(c.n)+'</b><span class="cnt">'+fa(arr.length)+'</span></div><div class="g-area gh" style="width:'+W+'px;'+wkBg+'"></div></div>';
    arr.forEach(function(t){

      body += '<div class="g-row" style="--c:'+s.c+'"><div class="g-lab" data-open="'+t.id+'" title="'+esc(t.t)+'">'+avatar(t.owner,true)+'<span>'+esc(t.t)+'</span></div>'+
        '<div class="g-area" style="width:'+W+'px;'+wkBg+'">'+
        '<div class="g-bar'+(isDone(t)?' done':'')+(t.type==='gate'?' gate':'')+(flagsOf(t).indexOf('late')>=0?' late':'')+'" data-gid="'+t.id+'" data-a="'+a+'" data-b="'+b+'" style="right:'+((a-mn)*DW)+'px;width:'+((b-a+1)*DW)+'px">'+
        (t.type==='gate'?'':'<i class="hs" data-h="s"></i>')+'<span>'+esc(t.t)+'</span>'+(t.type==='gate'?'':'<i class="hd" data-h="d"></i>')+'</div></div></div>';
    });
  });
  if(!body) body = empty('تسکی با تاریخ برای نمایش نیست.');
  var todayX = (TODAY-mn)*DW + DW/2;

    '<div class="g-head"><div class="g-lab hd0">زمان</div><div class="g-area" style="width:'+W+'px"><div class="gm-row">'+mh+'</div><div class="gp-row">'+pb+'</div><div class="gd-row">'+dh+'</div></div></div>'+

function mergeLegacy(base, st){
  var cur = {}; (st.tasks||[]).forEach(function(t){ cur[t.id]=t; });
  var map = function(s, hasBud){ return s==='wait' ? (hasBud?'budget':'review') : (['todo','doing','done','review','budget','paused','replan'].indexOf(s)>=0 ? s : 'todo'); };
  var have = {};
  base.tasks.forEach(function(f){
    have[f.id]=1; var c=cur[f.id]; if(!c) return;
    f.status = map(c.status, !!(f.budget||c.budget));
    ['doneAt','owner','prio','notes','check','start','due','budget'].forEach(function(k){ if(c[k]!==undefined) f[k]=c[k]; });
  });
  (st.tasks||[]).forEach(function(c){
    if(have[c.id]) return;
    var n = clone(c); n.svc = n.svc || 'sv2'; n.phase = n.phase||null; n.files = n.files||[]; n.urgent = !!n.urgent;
    n.status = map(n.status, !!n.budget); delete n.sprint; delete n.plan; base.tasks.push(n);
  });
  if(st.people && st.people.length) base.cfg.people = clone(st.people);
  Object.keys(st.days||{}).forEach(function(k){
    var tx = (st.days[k]||'').trim(); if(!tx) return;
    base.notes.push({id:'ld'+k, day:+k, text:tx, by:'M', at:Date.now(), kind:'note'});
  });
  return base;
}
function seedFn(legacy){
  var base = {cfg:seedCfg(), tasks:seedAll(), notes:[]};
  if(legacy) mergeLegacy(base, legacy);
  return base;
}

function saveBlob(blob, filename){
  if(Store.dl){ return Store.dl.save({filename:filename, data:blob}).then(function(){ toast('ذخیره شد'); }).catch(function(e){ if(e && e.code!=='declined') toast('ذخیره نشد'); }); }
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500); return Promise.resolve();
}
function loadH2C(){

    var s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload = function(){ window.html2canvas ? res(window.html2canvas) : rej(new Error('x')); }; s.onerror = function(){ rej(new Error('load')); };
    document.head.appendChild(s);
  });
}

/* ---------- کشیدن و رها کردن ---------- */
var dnd = null, lastDrop = 0;
function dndStart(){
  if(!dnd || dnd.active) return;
  if(!canW()){ dnd = null; return; }
  dnd.active = true;
  var g = dnd.src.cloneNode(true); g.classList.add('ghost-drag'); g.style.width = dnd.src.offsetWidth+'px'; g.removeAttribute('data-open'); g.removeAttribute('data-drag');
  document.body.appendChild(g); dnd.ghost = g; dnd.src.classList.add('dragging'); document.body.classList.add('is-dragging');
  moveGhost(dnd.cx, dnd.cy);
  dnd.raf = requestAnimationFrame(autoScrollLoop);
}
function autoScrollLoop(){
  if(!dnd || !dnd.active) return;
  var x = dnd.cx, y = dnd.cy;
  if(y < 70) window.scrollBy(0, -14); else if(y > window.innerHeight-70) window.scrollBy(0, 14);
  var sc = document.querySelector('.cols');
  if(sc){ var r = sc.getBoundingClientRect(); if(y >= r.top-20 && y <= r.bottom+20){ if(x < r.left+70) sc.scrollLeft -= 18; else if(x > r.right-70) sc.scrollLeft += 18; } }
  var tg = dropTargetAt(x, y);
  if(dnd.over && dnd.over!==tg) dnd.over.classList.remove('dropping');
  if(tg) tg.classList.add('dropping'); dnd.over = tg;
  dnd.raf = requestAnimationFrame(autoScrollLoop);
}
function moveGhost(x, y){ if(dnd && dnd.ghost){ dnd.ghost.style.transform = 'translate('+(x-dnd.ox)+'px,'+(y-dnd.oy)+'px)'; } }
function dropTargetAt(x, y){
  var e = document.elementFromPoint(x, y); return e ? e.closest('[data-drop]') : null;
}
function dndEnd(drop){
  if(!dnd) return;
  clearTimeout(dnd.timer); if(dnd.raf) cancelAnimationFrame(dnd.raf);
  if(dnd.active){
    if(dnd.ghost) dnd.ghost.remove(); dnd.src.classList.remove('dragging'); document.body.classList.remove('is-dragging');
    if(dnd.over) dnd.over.classList.remove('dropping');
    lastDrop = Date.now();
    if(drop && dnd.over) handleDrop(dnd.id, dnd.over.dataset.drop);
  }
  dnd = null;
}
function handleDrop(id, key){
  var t = byId[id]; if(!t) return;
  var p = key.split(':'), kind = p[0], val = p.slice(1).join(':');
  if(kind==='g'){
    if(ui.tab==='board' || ui.tab==='files'){
      if(ui.group==='st') setStatus(t, val);
      else if(ui.group==='svc'){ if(t.svc!==val){ t.svc=val; if(touch(t,['svc'])) renderAll(); } }
      else { var nv = val==='none' ? null : val; if(t.phase!==nv){ t.phase=nv; if(touch(t,['phase'])) renderAll(); } }
    }
  } else if(kind==='day'){
    var j = +val;
    if(ui.tab==='today'){ if(t.due===j) return; }
    var delta = t.due==null ? 0 : j - t.due;
    if(t.due===j) return;
    t.due = j; if(t.start!=null) t.start += delta;
    if(touch(t,['start','due'])){ renderAll(); toast('موعد: '+jfull(j)); }
  }
}

/* گانت */
var gdrag = null;
function gDown(e){
  var bar = e.target.closest('.g-bar'); if(!bar) return;
  if(e.button>0) return;
  var t = byId[bar.dataset.gid]; if(!t) return;
  var h = e.target.dataset && e.target.dataset.h;
  gdrag = {bar:bar, t:t, mode:h==='s'?'s':h==='d'?'d':'m', x:e.clientX, a:+bar.dataset.a, b:+bar.dataset.b, moved:false, na:+bar.dataset.a, nb:+bar.dataset.b, pid:e.pointerId};
  try{ bar.setPointerCapture(e.pointerId); }catch(x){}
  document.body.classList.add('is-dragging'); e.preventDefault();
}
function gMove(e){
  if(!gdrag) return;
  var dx = e.clientX - gdrag.x; if(Math.abs(dx)>3) gdrag.moved = true;
  if(!gdrag.moved) return;
  var dd = Math.round(-dx/DW), a = gdrag.a, b = gdrag.b, na = a, nb = b;
  if(gdrag.mode==='m'){ na=a+dd; nb=b+dd; }
  else if(gdrag.mode==='s'){ na=Math.min(a+dd, b); }
  else { nb=Math.max(b+dd, a); }
  gdrag.na = na; gdrag.nb = nb;
  var mn = +$('gScroll').dataset.min;
  gdrag.bar.style.right = ((na-mn)*DW)+'px'; gdrag.bar.style.width = ((nb-na+1)*DW)+'px'; gdrag.bar.classList.add('drag');
  gdrag.bar.title = jd(na)+' ← '+jd(nb);
}
function gUp(e){
  if(!gdrag) return; var g = gdrag; gdrag = null;
  try{ g.bar.releasePointerCapture(g.pid); }catch(x){} document.body.classList.remove('is-dragging');
  g.bar.classList.remove('drag');
  if(!g.moved){ openTask(g.t.id); return; }
  lastDrop = Date.now();
  if(!canW()){ renderView(); toast('این نسخه فقط‌خواندنی است'); return; }
  var t = g.t;
  if(t.start==null && g.mode==='m'){ t.due = g.nb; }
  else { t.start = g.na; t.due = g.nb; if(t.type==='gate'){ t.start = null; } }
  if(touch(t,['start','due'])){ renderAll(); toast(jd(t.start!=null?t.start:t.due)+' تا '+jd(t.due)); }
}

function handleWinAct(b, w){
  var a = b.dataset.wact, t = w.type==='task' ? byId[w.task] : null;
  if(t && !canW()){ toast('این نسخه فقط‌خواندنی است'); return; }

  switch(a){
    case 'ck-add': var inp = w.el.querySelector('[data-wf="ckadd"]'); var tx=(inp.value||'').trim(); if(!tx) return; t.check=(t.check||[]).concat([{x:tx,done:false}]); touch(t,['check']); refill(); var i2=w.el.querySelector('[data-wf="ckadd"]'); if(i2) i2.focus(); break;
    case 'ck-del': t.check.splice(+b.dataset.i,1); touch(t,['check']); refill(); break;
    case 'dep-del': t.deps = t.deps.filter(function(x){ return x!==b.dataset.id; }); touch(t,['deps']); renderAll(); fillWin(w); break;
    case 'bud-on': t.budget = {state:0,amount:'',vendor:'',lead:7,need:null}; if(t.status==='todo') t.status='budget'; touch(t,['budget','status']); renderAll(); fillWin(w); break;
    case 'bud-off': t.budget = null; touch(t,['budget']); renderAll(); fillWin(w); break;

      if(addLink(t, n, u)) fillWin(w); break;
    case 'wf-del':
      var fid = b.dataset.fid, f = (t.files||[]).filter(function(x){ return x.id===fid; })[0]; if(!f) return;
      if(b.dataset.arm!=='1'){ b.dataset.arm='1'; b.classList.add('arm'); setTimeout(function(){ if(b.isConnected){ b.dataset.arm=''; b.classList.remove('arm'); } }, 2500); toast('برای حذف فایل دوباره بزنید'); return; }
      t.files = t.files.filter(function(x){ return x.id!==fid; }); Store.removeFile(f); touch(t,['files']); renderAll(); fillWin(w); break;
    case 'wc-add':
      if(needMe()) return; var ta = w.el.querySelector('[data-wf="cmt"]'), txt = (ta.value||'').trim(); if(!txt) return;
      var c = {id:'c'+uid(), task:t.id, text:txt, by:ui.me, at:Date.now()}; M.comments.push(c); Store.put('comments', c); w.draft=''; renderAll(); fillWin(w); break;
    case 't-del':
      if(b.dataset.arm!=='1'){ b.dataset.arm='1'; b.textContent='مطمئنید؟ دوباره بزنید'; setTimeout(function(){ if(b.isConnected){ b.dataset.arm=''; b.textContent='حذف تسک'; } }, 2800); return; }
      var id = t.id; M.tasks = M.tasks.filter(function(x){ return x.id!==id; }); Store.del('tasks', t);
      M.comments = M.comments.filter(function(c2){ if(c2.task===id){ Store.del('comments', c2); return false; } return true; });
      (t.files||[]).forEach(function(f2){ Store.removeFile(f2); });

  }
}
function slug(p){ return p+uid().slice(-4); }

    c.statuses = c.statuses.filter(function(x){ return x.id!==v; }); if(ui.f.st==='st:'+v) ui.f.st='all'; done();

function handleSettingsInput(el){

function bind(){
  document.addEventListener('click', function(e){
    var wa = e.target.closest('[data-wa]');
    if(wa){
      var act = wa.dataset.wa;
      if(act==='restore'){ var rw = wins.filter(function(x){ return x.key===wa.dataset.wk; })[0]; if(rw){ rw.min=false; applyWin(rw); focusWin(rw); renderTray(); } return; }
      var w0 = winOf(wa); if(!w0) return;
      if(act==='close') closeWin(w0);
      else if(act==='min'){ w0.min = true; applyWin(w0); var nx = wins.filter(function(x){ return !x.min; }).sort(function(a,b){ return b.z-a.z; })[0]; if(nx) focusWin(nx); renderTray(); }
      else if(act==='max'){ w0.max = !w0.max; applyWin(w0); focusWin(w0); }

    }

    var wq = e.target.closest('[data-wq]');

      var w2 = winOf(wq), t = byId[w2.task]; if(!t || !canW()) return;
      var q = wq.dataset.wq.split(':')[1];
      t.due = q==='x' ? null : TODAY + (+q); if(t.start!=null && t.due!=null && t.start>t.due) t.start = t.due;
      touch(t, ['due','start']); renderAll(); fillWin(w2); return;
    }
    var sa = e.target.closest('[data-sact]'); if(sa){ handleSettingsAct(sa); return; }
    var a = e.target.closest('[data-act]'), o = e.target.closest('[data-open]');
    if(a && o && a.contains(o)) a = null;
    if(a){ handleAct(a, e); return; }
    if(o){
      if(Date.now()-lastDrop<350) return;
      if(e.target.closest('select,input,textarea,button,label')) return;
      openTask(o.dataset.open);
    }
  });
  document.addEventListener('change', function(e){
    var el = e.target;
    if(el.dataset.flt){ ui.f[el.dataset.flt] = el.value; renderAll(); return; }
    if(el.dataset.act==='status'){ var t = byId[el.dataset.id]; if(t) setStatus(t, el.value); return; }
    if(el.dataset.act==='me'){ ui.me = el.value || null; saveUI(); renderAll(); wins.forEach(function(w){ fillWin(w); }); return; }
    if(el.id==='impFile'){ if(el.files[0]) readImport(el.files[0]); return; }
    if(el.id==='fPick'){ var ft = byId[$('fTask').value]; if(ft) attachFiles(ft, el.files); el.value=''; return; }
    var w = winOf(el);
    if(w && w.type==='settings'){ handleSettingsInput(el); return; }
    if(!w) return;
    var t2 = byId[w.task]; if(!t2) return;
    if(el.dataset.wfile){ attachFiles(t2, el.files); el.value=''; return; }
    if(!canW()){ toast('این نسخه فقط‌خواندنی است'); return; }
    if(el.dataset.ck!=null){ t2.check[+el.dataset.ck].done = el.checked; touch(t2,['check']); renderAll(); fillWin(w); return; }
    if(el.dataset.bf){
      var b = t2.budget, f = el.dataset.bf;
      if(f==='state') b.state = +el.value; else if(f==='lead') b.lead = el.value===''?null:+el.value;
      else if(f==='need'){ var j = parseJ(el.value); if(j===undefined){ toast('تاریخ نامعتبر'); el.value = jinput(b.need); return; } b.need = j; }
      else b[f] = el.value;
      touch(t2,['budget']); renderAll(); return;
    }
    var wf = el.dataset.wf; if(!wf) return;
    if(wf==='status') setStatus(t2, el.value);
    else if(wf==='svc'||wf==='owner'||wf==='prio'){ t2[wf] = el.value; touch(t2,[wf]); renderAll(); }
    else if(wf==='phase'){ t2.phase = el.value||null; touch(t2,['phase']); renderAll(); fillWin(w); }
    else if(wf==='type'){ t2.type = el.value; touch(t2,['type']); syncGates(); renderAll(); fillWin(w); }
    else if(wf==='urgent'){ t2.urgent = el.checked; touch(t2,['urgent']); renderAll(); fillWin(w); }
    else if(wf==='start'||wf==='due'){
      var j2 = parseJ(el.value); if(j2===undefined){ toast('تاریخ نامعتبر؛ مثل ۱۴۰۵/۰۷/۲۰'); el.value = jinput(t2[wf]); return; }
      t2[wf] = j2; if(t2.start!=null && t2.due!=null && t2.start>t2.due){ if(wf==='start') t2.due = t2.start; else t2.start = t2.due; }
      touch(t2,['start','due']); renderAll(); fillWin(w);
    }
    else if(wf==='depadd' && el.value){ t2.deps = (t2.deps||[]).concat([el.value]); touch(t2,['deps']); renderAll(); fillWin(w); }
  });
  document.addEventListener('input', function(e){
    var el = e.target;
    if(el.id==='q'){ ui.f.q = el.value; renderView(); return; }
    if(el.dataset.draft){ ui.draft[el.dataset.draft==='note'?'note':el.dataset.draft==='cmt'?'cmt':'q'] = el.value; return; }
    var w = winOf(el); if(!w) return;
    if(w.type==='settings'){ if(el.type==='text'||el.type==='color'){ if(el.dataset.ph && /\|[ab]$/.test(el.dataset.ph)) return; handleSettingsInput(el); } return; }
    var t = byId[w.task]; if(!t) return;
    var wf = el.dataset.wf;
    if(wf==='cmt'){ w.draft = el.value; return; }
    if(!canW()) return;
    if(wf==='t' || wf==='notes'){ t[wf] = el.value; if(touch(t,[wf],true)){ if(wf==='t') w.el.querySelector('.wt').textContent = el.value; renderSoon(); } }
    else if(el.dataset.cx!=null){ t.check[+el.dataset.cx].x = el.value; touch(t,['check'],true); }
    else if(el.dataset.bf && (el.dataset.bf==='amount'||el.dataset.bf==='vendor')){ t.budget[el.dataset.bf] = el.value; touch(t,['budget'],true); renderSoon(); }
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='Enter' && !e.shiftKey){
      var el = e.target;
      if(el.id==='qTitle'){ e.preventDefault(); handleAct({dataset:{act:'qadd'}}, e); }
      else if(el.dataset && el.dataset.wf==='ckadd'){ e.preventDefault(); var w = winOf(el); if(w) handleWinAct({dataset:{wact:'ck-add'}}, w); }
    }
    if(e.key==='Escape'){ var tw = wins.filter(function(x){ return x.el && x.el.classList.contains('top') && !x.min; })[0]; if(tw && e.target.tagName!=='TEXTAREA' && e.target.tagName!=='INPUT') closeWin(tw); }
  });
  document.addEventListener('focusout', function(){
    if(deferred){ setTimeout(function(){ if(!editingNow()){ deferred = false; renderAll(); } }, 80); }
  });

  /* پنجره: جابه‌جایی با هدر */
  var wd_ = null;
  document.addEventListener('pointerdown', function(e){
    var win = e.target.closest('.win');
    if(win){ var w = winOf(win); if(w && !(wins.filter(function(x){ return x.el && x.el.classList.contains('top'); })[0]===w)) focusWin(w); }
    var wh = e.target.closest('.wh');
    if(wh && !e.target.closest('button') && !isMobile()){
      var w3 = winOf(wh); if(!w3 || w3.max) return;
      wd_ = {w:w3, x:e.clientX, y:e.clientY, ox:w3.x, oy:w3.y}; try{ wh.setPointerCapture(e.pointerId); }catch(x){} e.preventDefault(); return;
    }
    var bar = e.target.closest('.g-bar'); if(bar){ gDown(e); return; }
    /* کشیدن کارت */
    if(e.button>0) return;
    var src = e.target.closest('[data-drag]'); if(!src || e.target.closest('select,input,textarea,button,a.tl')) return;
    var r = src.getBoundingClientRect();
    dnd = {src:src, id:src.dataset.drag, x:e.clientX, y:e.clientY, cx:e.clientX, cy:e.clientY, ox:e.clientX-r.left, oy:e.clientY-r.top, active:false, touch:e.pointerType==='touch'};
    dnd.ox = e.clientX - r.left; dnd.oy = e.clientY - r.top;
    /* برای translate: موقعیت ابتدایی ghost روی (0,0) صفحه است، پس مختصات را کامل می‌دهیم */
    dnd.ox = e.clientX - r.left - 0; dnd.oy = e.clientY - r.top - 0;
    if(dnd.touch) dnd.timer = setTimeout(dndStart, 380);
  });
  document.addEventListener('pointermove', function(e){
    if(wd_){
      var w = wd_.w; w.x = Math.min(window.innerWidth-80, Math.max(-w.w+120, wd_.ox + e.clientX - wd_.x)); w.y = Math.min(window.innerHeight-40, Math.max(0, wd_.oy + e.clientY - wd_.y)); applyWin(w); return;
    }
    if(gdrag){ gMove(e); return; }
    if(!dnd) return;
    dnd.cx = e.clientX; dnd.cy = e.clientY;
    if(!dnd.active){
      var dist = Math.hypot(e.clientX-dnd.x, e.clientY-dnd.y);

    }
    moveGhost(e.clientX, e.clientY);
    var tg = dropTargetAt(e.clientX, e.clientY);
    if(dnd.over && dnd.over!==tg) dnd.over.classList.remove('dropping');
    if(tg){ tg.classList.add('dropping'); } dnd.over = tg;
  });
  var up = function(e){
    if(wd_){ wd_ = null; return; }
    if(gdrag){ gUp(e); return; }
    dndEnd(e.type==='pointerup');
  };
  document.addEventListener('pointerup', up);

}
