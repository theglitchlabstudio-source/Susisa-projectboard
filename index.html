<style>
/* برد سوسیسا v6 — میز کار. لایه: هدر چسبان + ناوبری (پایین روی گوشی، بالا روی لپ‌تاپ) + نما + پنل تسک (کشوی کناری/برگهٔ پایین) */
:root{
  --bg:#FFF6E8; --card:#FFFFFF; --card2:#FFF1DC; --ink:#22140F; --mute:#7C6658; --line:#EEDDC6;
  --red:#CC0212; --red2:#A30010; --onred:#FFFFFF; --mustard:#E9A800; --pickle:#3B8C47; --claude:#C8613F; --blue:#2F6FD0; --violet:#7B4FB8;
  --late:#CC0212; --soon:#C27C00; --ok:#3B8C47;
  --sh:0 1px 0 rgba(60,20,0,.06), 0 8px 24px -16px rgba(60,20,0,.35);
  --r:14px; --fd:"Lalezar","Vazirmatn",Tahoma,sans-serif; --fb:"Vazirmatn",Tahoma,sans-serif;
  --nav-h:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15100E; --card:#1F1815; --card2:#2A201B; --ink:#F7ECE2; --mute:#AD988A; --line:#382B24;
  --red:#FF3B47; --red2:#FF6B74; --onred:#1A0A0A; --mustard:#F3C033; --pickle:#62BE6E; --claude:#E48A68; --blue:#6EA2F2; --violet:#B08AE8;
  --late:#FF5A64; --soon:#F3B133; --ok:#62BE6E; --sh:0 1px 0 rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.9); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#15100E; --card:#1F1815; --card2:#2A201B; --ink:#F7ECE2; --mute:#AD988A; --line:#382B24;
  --red:#FF3B47; --red2:#FF6B74; --onred:#1A0A0A; --mustard:#F3C033; --pickle:#62BE6E; --claude:#E48A68; --blue:#6EA2F2; --violet:#B08AE8;
  --late:#FF5A64; --soon:#F3B133; --ok:#62BE6E; --sh:0 1px 0 rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.9); color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.7 var(--fb);direction:rtl;-webkit-tap-highlight-color:transparent;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
/* هدر */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font:400 26px/1 var(--fd);color:var(--red);letter-spacing:.01em}
.brand span{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.count{font-size:12px;font-weight:700;background:var(--red);color:var(--onred);border-radius:999px;padding:3px 10px;white-space:nowrap}
.ib{border:0;background:transparent;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.ib:hover{background:var(--card2)}
.ib svg{width:20px;height:20px}
.net{width:10px;height:10px;border-radius:50%;background:var(--mute);flex:none}
.net.on{background:var(--ok)} .net.err{background:var(--late)} .net.off{background:var(--mustard)}
.me{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px;font-weight:600}
/* ناوبری */
.nav{position:fixed;bottom:0;inset-inline:0;z-index:45;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute);position:relative}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--red)}
.nav .dot{position:absolute;top:8px;inset-inline-start:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--claude);color:#fff;font-size:10px;line-height:16px;padding:0 4px}
@media (min-width:900px){
  body{padding-bottom:0}
  .nav{position:sticky;top:56px;bottom:auto;height:auto;border-top:0;border-bottom:1px solid var(--line);background:var(--bg);padding:0 max(16px,calc((100% - 1240px)/2 + 16px));gap:4px;z-index:39}
  .nav button{flex:none;flex-direction:row;gap:6px;font-size:14px;padding:10px 14px;border-bottom:3px solid transparent}
  .nav button svg{width:18px;height:18px}
  .nav button[aria-current="page"]{border-color:var(--red)}
  .nav .dot{position:static}
}
main{padding-block:16px 40px}
h1,h2,h3{margin:0;text-wrap:balance}
.h1{font:400 30px/1.25 var(--fd)}
.h2{font:400 21px/1.3 var(--fd);display:flex;align-items:center;gap:8px}
.h2 small{font:500 12px var(--fb);color:var(--mute)}
.muted{color:var(--mute)}
.small{font-size:13px}
.empty{color:var(--mute);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:12px;text-align:center}
/* میز کار */
.hello{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 16px;margin-bottom:14px}
.hello .h1 span{color:var(--red)}
.hello .d{color:var(--mute);font-size:14px}
.gates{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:thin}
.gate{flex:none;min-width:150px;max-width:190px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;position:relative;cursor:pointer;text-align:right}
.gate::after{content:"";position:absolute;inset-block:8px;inset-inline-start:-1px;border-inline-start:2px dashed var(--line)}
.gate b{display:block;font-size:13px}
.gate small{color:var(--mute);font-size:12px}
.gate .bar{height:4px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}
.gate .bar i{display:block;height:100%;background:var(--pickle)}
.gate.now{border-color:var(--red)} .gate.done{opacity:.6} .gate.late{border-color:var(--late)}
.grid{display:grid;gap:16px}
@media (min-width:900px){.grid.desk{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);min-width:0}
.panel>.h2{margin-bottom:10px}
.panel.claude{border-color:color-mix(in srgb,var(--claude) 55%,var(--line))}
.panel.claude>.h2{color:var(--claude)}
.sec{margin-top:12px}
.sec>h4{margin:0 0 6px;font-size:13px;color:var(--mute);font-weight:700;display:flex;gap:6px;align-items:center}
.sec>h4 .n{background:var(--card2);border-radius:999px;padding:0 8px;font-size:12px}
.sec.late>h4{color:var(--late)}
/* ردیف تسک */
.tl{list-style:none;margin:0;padding:0}
.tr{display:flex;align-items:flex-start;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.tr:last-child{border-bottom:0}
.tr:hover{background:var(--card2)}
.ck{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--mute);background:transparent;display:grid;place-items:center;margin-top:2px;padding:0}
.ck svg{width:14px;height:14px;opacity:0}
.tr.done .ck{background:var(--pickle);border-color:var(--pickle);color:#fff}
.tr.done .ck svg{opacity:1}
.tr.done .tt{text-decoration:line-through;color:var(--mute)}
.tb{flex:1;min-width:0}
.tt{font-weight:600;line-height:1.55;word-break:break-word}
.tm{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--mute);margin-top:2px;align-items:center}
.sv{display:inline-flex;align-items:center;gap:4px}
.sv::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;border:1px solid currentColor;line-height:18px}
.tag.late{color:var(--late)} .tag.soon{color:var(--soon)} .tag.blocked{color:var(--violet)} .tag.urgent{background:var(--late);color:#fff;border-color:var(--late)}
.tag.kG{color:var(--ink)} .tag.kD{color:var(--soon)} .tag.kE{color:var(--red)} .tag.kI{color:var(--blue)}
.who{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:var(--c);overflow:hidden}
.who img{width:100%;height:100%;object-fit:cover}
.due{flex:none;font-size:12px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums;margin-top:3px}
.due.late{color:var(--late);font-weight:700}
/* صندوق Claude */
.prop{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--bg)}
.prop .pt{font-weight:700;cursor:pointer}
.prop .pn{font-size:13px;color:var(--mute);white-space:pre-wrap;max-height:4.8em;overflow:hidden;margin-top:4px}
.prop.open .pn{max-height:none}
.prop .pa{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.prop .st{font-size:12px;font-weight:700}
.prop .st.ok{color:var(--ok)} .prop .st.no{color:var(--late)}
.note{border-inline-start:3px solid var(--claude);padding:4px 12px;white-space:pre-wrap;font-size:14px}
.note.clip{max-height:9.5em;overflow:hidden;position:relative}
.note.clip::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3em;background:linear-gradient(transparent,var(--card))}
/* دکمه‌ها */
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--red);border-color:var(--red);color:var(--onred)}
.btn.ok{background:var(--pickle);border-color:var(--pickle);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{font-size:13px;padding:3px 10px;min-height:30px}
.btn.danger{color:var(--late)}
.btn svg{width:16px;height:16px}
.in,.sel,textarea.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;font-size:14px;min-height:38px}
textarea.in{resize:vertical;line-height:1.7}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
/* برنامه */
.bar2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.svcb{margin-bottom:14px}
.svch{display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 2px}
.svch .nm{font:400 19px/1.3 var(--fd)}
.svch .pr{flex:1;max-width:220px;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.svch .pr i{display:block;height:100%;background:var(--c)}
.svch .cnt{font-size:12px;color:var(--mute);white-space:nowrap}
.stg{font-size:12px;font-weight:700;color:var(--red);margin:10px 4px 2px}
/* تقویم */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:12px;color:var(--mute);text-align:center;font-weight:700}
.cell{min-height:104px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell.off{opacity:.45}
.cell.today{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.cell.open{background:var(--card2)}
.cell.fri{background:var(--card2)}
.cell .dn{font-size:12px;font-weight:700;color:var(--mute);display:flex;justify-content:space-between}
.cell.over{outline:2px dashed var(--red)}
.ev{font-size:11px;line-height:1.5;border-radius:6px;padding:1px 5px;background:color-mix(in srgb,var(--c) 18%,var(--card));border-inline-start:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;touch-action:none;user-select:none}
.ev.gate{font-weight:800;background:var(--ink);color:var(--bg);border-color:var(--red)}
.ev.done{opacity:.5;text-decoration:line-through}
.ev.dragging{opacity:.3}
.dghost{position:fixed;z-index:200;pointer-events:none;font-size:12px;background:var(--red);color:#fff;border-radius:8px;padding:2px 8px;box-shadow:var(--sh)}
.ag-day{margin-bottom:10px}
.ag-day h4{margin:0 0 4px;font-size:14px;display:flex;gap:8px;align-items:baseline}
.ag-day h4 small{color:var(--mute);font-weight:500}
.ag-day.today h4{color:var(--red)}
/* گفتگو */
.feed{list-style:none;padding:0;margin:0}
.fi{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.fi .fb{flex:1;min-width:0}
.fi .fh{font-size:12px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.fi .fh b{color:var(--ink);font-size:13px}
.fi .fx{white-space:pre-wrap;word-break:break-word;font-size:14px}
.fi.cl .fx{border-inline-start:3px solid var(--claude);padding-inline-start:10px}
.lnk{color:var(--red);cursor:pointer;font-weight:600;background:none;border:0;padding:0;font-size:12px;text-align:right}
.compose{display:flex;gap:8px;align-items:flex-end;margin-bottom:12px}
.compose textarea{flex:1}
/* فایل‌ها و تنظیمات */
.bfd summary{cursor:pointer;padding:4px 0}.bftx{white-space:pre-wrap;font-size:12.5px;line-height:1.9;background:var(--card2,rgba(127,127,127,.08));border-radius:10px;padding:10px 12px;max-height:340px;overflow:auto;direction:rtl}
.fpage .grp{margin:16px 0 8px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}.fpage .grp i{width:10px;height:10px;border-radius:50%;display:inline-block}.fpage .grp small{font-weight:500;color:var(--mute)}
.fpage .fc .fa{display:flex;gap:4px;padding:0 6px 8px;flex-wrap:wrap}.fpage .fc .fa .btn{flex:1;min-width:0;padding:3px 4px;font-size:12px;min-height:32px;justify-content:center}.fpage .fc .fa .btn svg{width:14px;height:14px}
.fpage .fc .fm .sub{display:block;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vbadge{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:0 7px;font-size:11px;font-weight:700;color:var(--mute);margin-inline-start:4px}
.fview{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column}.fview[hidden]{display:none}
.fvh{display:flex;gap:6px;align-items:center;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}.fvh b{flex:1;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.fvh .btn{min-height:34px;padding:3px 10px;font-size:13px}
.fvv{display:flex;gap:6px;padding:6px 12px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--card2)}
.fvbody{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;align-items:flex-start;-webkit-overflow-scrolling:touch}
.fvfr{width:100%;height:100%;border:0;background:#fff}.fvimg{max-width:100%;max-height:100%;object-fit:contain;margin:auto}.fvmedia{max-width:100%;margin:auto}
.fvtx{white-space:pre-wrap;word-break:break-word;padding:16px;font-size:13.5px;line-height:1.95;max-width:920px;width:100%;unicode-bidi:plaintext}.fvmsg{margin:auto;padding:24px;text-align:center;color:var(--mute);line-height:2}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.fc{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.fc .th{aspect-ratio:4/3;background:var(--card2);display:grid;place-items:center;font:400 22px var(--fd);color:var(--mute);overflow:hidden}
.fc .th img{width:100%;height:100%;object-fit:cover;max-width:100%}
.fc .fm{padding:6px 8px;font-size:12px}
.fc .fm b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set{max-width:720px}
.set .panel{margin-bottom:14px}
.set h3{font:400 19px var(--fd);margin-bottom:6px}
.set label{display:block;font-size:13px;font-weight:600;margin:8px 0 4px}
.who.lg{width:44px;height:44px;font-size:15px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:10px 0}
.pick button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700}
.pick button[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.ed{display:grid;grid-template-columns:28px minmax(0,1fr) 110px 110px;gap:6px;align-items:center;margin-bottom:6px}
.ed input[type=color]{width:28px;height:28px;padding:0;border:0;background:none}
@media (max-width:560px){.ed{grid-template-columns:28px minmax(0,1fr)}.ed .x2{grid-column:2}}
/* پنل تسک */
.scrim{position:fixed;inset:0;background:rgba(20,8,4,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:61;background:var(--card);display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.25);transition:transform .25s ease;

.sheet.on{transform:none}

.sh-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.sh-h .grab{display:none}
.sh-b{overflow:auto;padding:14px;flex:1;overscroll-behavior:contain}
.sh-b .ttl{font:700 19px/1.5 var(--fb);border:1px solid transparent;border-radius:10px;padding:4px 6px;width:100%;resize:none;background:transparent;min-height:0}
.sh-b .ttl:hover,.sh-b .ttl:focus{border-color:var(--line);background:var(--bg)}
.fld{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}
@media (min-width:560px){.fld{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fld label{font-size:12px;font-weight:700;color:var(--mute);display:flex;flex-direction:column;gap:3px}
.blk{margin-top:16px}
.blk>h5{margin:0 0 6px;font-size:14px;display:flex;gap:8px;align-items:center}
.ckl{list-style:none;padding:0;margin:0}
.ckl li{display:flex;gap:8px;align-items:center;padding:3px 0}
.ckl li.done span{text-decoration:line-through;color:var(--mute)}
.ckl span{flex:1;min-width:0}
.dep{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.dep .s{font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;background:var(--card2)}
.dep .s.ok{color:var(--ok)}
.flist{display:flex;flex-direction:column;gap:6px}
.fl{display:flex;gap:8px;align-items:center;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.fl a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.decide{background:color-mix(in srgb,var(--claude) 12%,var(--card));border:1px solid color-mix(in srgb,var(--claude) 40%,var(--line));border-radius:12px;padding:10px;margin:8px 0}
.toast{position:fixed;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:300;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){.toast{bottom:20px}}
.boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);font:400 28px var(--fd);color:var(--red);z-index:500}
.ro{background:var(--mustard);color:#1a1000;font-size:13px;font-weight:700;text-align:center;padding:6px 16px}
.ro button{border:0;background:none;text-decoration:underline;font-weight:800}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

VIEWS.desk=function(){

  h+='<div class="hello"><h1 class="h1">'+(p?greet+'، <span>'+esc(p.name)+'</span>':'میز کار تیم')+'</h1><div class="d">'+jfull(TODAY)+'</div></div>';
  /* گیت‌ها */
  var gates=M.tasks.filter(function(t){ return t.type==='gate'; }).sort(cmp), nextG=gates.filter(function(g){ return !isDone(g); })[0];
  h+='<div class="gates" aria-label="گیت‌ها">'+gates.map(function(g){ var ds=(g.deps||[]).map(function(i){ return byId[i]; }).filter(Boolean), dn=ds.filter(isDone).length;
    var cls=isDone(g)?'done':(g===nextG?'now':''); if(!isDone(g)&&g.due!=null&&g.due<TODAY) cls+=' late';
    return '<button class="gate '+cls+'" data-open="'+esc(g.id)+'"><b>'+esc(g.t.replace(/^گیت\s*[۰-۹0-9]+\s*·\s*/,''))+'</b><small>'+esc((g.t.match(/^گیت\s*[۰-۹0-9]+/)||[''])[0])+' · '+jd(g.due)+' · '+fa(dn)+'/'+fa(ds.length)+'</small><div class="bar"><i style="width:'+(ds.length?Math.round(100*dn/ds.length):0)+'%"></i></div></button>'; }).join('')+'</div>';
  /* ستون اصلی */
  var main='';
  if(!me){
    main+='<div class="panel"><h2 class="h2">شما کدام هستید؟</h2><p class="muted small">تا کارهای خودتان را ببینید و کامنت‌ها به اسم شما ثبت شود. روی هر دستگاه یک‌بار.</p><div class="pick">'+humans().map(function(x){ return '<button data-act="setme" data-v="'+esc(x.id)+'">'+who(x.id,1)+esc(x.name)+'</button>'; }).join('')+'</div></div>';
  }
  var mine=M.tasks.filter(function(t){ return t.type!=='gate' && !isClosed(t) && (!me || t.owner===me) && !isProp(t); }).sort(cmp);
  var late=mine.filter(function(t){ return t.due!=null&&t.due<TODAY; }),
      week=mine.filter(function(t){ return t.due!=null&&t.due>=TODAY&&t.due<=TODAY+7; }),
      doing=mine.filter(function(t){ return t.status==='doing'&&late.indexOf(t)<0&&week.indexOf(t)<0; });
  function sec(title,list,cls,max){ if(!list.length) return ''; var more=list.length>(max||99); var L=more&&!ui.open[title]?list.slice(0,max):list;
    return '<div class="sec '+(cls||'')+'"><h4>'+title+' <span class="n">'+fa(list.length)+'</span></h4><ul class="tl">'+L.map(function(t){ return trow(t,{nowho:!!me}); }).join('')+'</ul>'+(more?'<button class="btn sm ghost" data-act="more" data-v="'+esc(title)+'">'+(ui.open[title]?'کمتر':'همه ('+fa(list.length)+')')+'</button>':'')+'</div>'; }
  main+='<div class="panel"><h2 class="h2">'+(me?'کارهای من':'کارهای تیم')+' <small>'+fa(mine.length)+' باز</small><span class="sp"></span><button class="btn sm" data-act="newtask">'+IC.plus+'تسک</button></h2>'+
    (late.length+week.length+doing.length?'':'<div class="empty">برای این هفته کاری ندارید. از «برنامه» کار بعدی را بردارید.</div>')+
    sec('عقب‌افتاده',late,'late',6)+sec('امروز تا هفتهٔ بعد',week,'',8)+sec('در جریان',doing,'',6)+'</div>';
  /* مسیر بحرانی افتتاحیه */
  var crit=M.tasks.filter(function(t){ return t.prio==='p0'&&t.type!=='gate'&&!isClosed(t)&&t.due!=null&&t.due<=OPEN; }).sort(cmp);
  if(crit.length){ var cl=crit.filter(function(t){ return t.due<TODAY; }).length;
    main+='<div class="panel"><h2 class="h2">مسیر بحرانی تا افتتاحیه <small>'+fa(crit.length)+' کار'+(cl?' · '+fa(cl)+' عقب':'')+'</small></h2><ul class="tl">'+(ui.open.crit?crit:crit.slice(0,7)).map(function(t){ return trow(t); }).join('')+'</ul>'+(crit.length>7?'<button class="btn sm ghost" data-act="more" data-v="crit">'+(ui.open.crit?'کمتر':'همه ('+fa(crit.length)+')')+'</button>':'')+'</div>'; }
  /* ستون کناری */

  var cnote=M.notes.filter(function(n){ return n.by==='CL'; }).sort(function(a,b){ return (b.at||0)-(a.at||0); })[0];
  side+='<div class="panel claude"><h2 class="h2">Claude · مدیر پروژه <small>'+(cnote?'آخرین گزارش '+tfmt(cnote.at):'هنوز گزارشی نیست')+'</small></h2>';
  if(cnote) side+='<div class="note'+(ui.open.cn?'':' clip')+'">'+esc(cnote.text)+'</div><button class="btn sm ghost" data-act="more" data-v="cn">'+(ui.open.cn?'بستن':'خواندن کامل')+'</button>';
  side+='<div class="sec"><h4>پیشنهادها و درخواست‌ها <span class="n">'+fa(props.length)+'</span></h4>'+(props.length?props.map(propCard).join(''):'<div class="empty">پیشنهاد بازی نیست.</div>')+'</div>';
  side+='<p class="muted small">برای کار دادن به Claude، زیر هر تسک کامنتی با «@Claude» بنویسید؛ در اجرای بعدی انجام می‌دهد.</p></div>';
  var wait=M.tasks.filter(function(t){ return !isClosed(t)&&(t.owner==='C'||t.status==='budget'); }).sort(cmp);
  side+='<div class="panel"><h2 class="h2">منتظر امیررضا <small>ورودی و بودجه</small></h2>'+(wait.length?'<ul class="tl">'+wait.map(function(t){ return trow(t,{nowho:1}); }).join('')+'</ul>':'<div class="empty">چیزی منتظر نیست.</div>')+'</div>';
  var todays=M.notes.filter(function(n){ return n.day===TODAY&&n.by!=='CL'; }).sort(function(a,b){ return (a.at||0)-(b.at||0); });
  side+='<div class="panel"><h2 class="h2">یادداشت امروز</h2>'+todays.map(function(n){ return '<div class="fi"><div>'+who(n.by)+'</div><div class="fb"><div class="fh"><b>'+esc(person(n.by).name)+'</b>'+tfmt(n.at)+'</div><div class="fx">'+esc(n.text)+'</div></div></div>'; }).join('')+
    '<div class="compose" style="margin-top:8px"><textarea class="in" id="noteIn" rows="2" placeholder="امروز چه شد؟ چه چیزی گیر است؟">'+esc(ui.draft.note||'')+'</textarea><button class="btn pri" data-act="note">ثبت</button></div></div>';
  return h+'<div class="grid desk"><div class="grid">'+main+'</div><div class="grid">'+side+'</div></div>';
};
function propCard(t){
  var d=decisionOf(t), n=M.comments.filter(function(c){ return c.task===t.id; }).length, isM=ui.me==='M';
  var st=d?(/^رد/.test(d.text.trim())?'<span class="st no">رد شد · '+esc(person(d.by).name)+'</span>':'<span class="st ok">تأیید شد · در اجرای بعدی Claude اعمال می‌شود</span>'):'';
  return '<div class="prop'+(ui.open['p'+t.id]?' open':'')+'"><div class="pt" data-open="'+esc(t.id)+'">'+esc(t.t)+'</div><div class="pn">'+esc(t.notes||'')+'</div>'+
    '<div class="pa">'+(st|| (isM?'<button class="btn sm ok" data-act="approve" data-id="'+esc(t.id)+'">'+IC.check+'تأیید</button><button class="btn sm danger" data-act="reject" data-id="'+esc(t.id)+'">رد</button>':'<span class="muted small">منتظر تأیید ممضی</span>'))+
    '<button class="btn sm ghost" data-act="more" data-v="p'+esc(t.id)+'">'+(ui.open['p'+t.id]?'کوتاه':'همه')+'</button><span class="muted small">'+(n?fa(n)+' کامنت':'')+'</span></div></div>';
}

/* ---------- برنامه ---------- */
VIEWS.plan=function(){
  var f=ui.plan, h='<div class="bar2"><h1 class="h1" style="margin-inline-end:auto">برنامه</h1><button class="btn pri" data-act="newtask">'+IC.plus+'تسک تازه</button></div>';
  h+='<div class="bar2"><input class="in" id="planQ" style="max-width:280px" placeholder="جستجو در عنوان و توضیح…" value="'+esc(f.q)+'"></div>';
  function chips(name,opts,cur){ return '<div class="chips" role="group">'+opts.map(function(o){ return '<button class="chip" data-act="pf" data-k="'+name+'" data-v="'+esc(o[0])+'" aria-pressed="'+(String(cur)===String(o[0]))+'">'+esc(o[1])+'</button>'; }).join('')+'</div>'; }
  h+='<div class="grid" style="gap:8px;margin-bottom:14px">'+chips('g',[['svc','بر اساس خدمت'],['st','وضعیت'],['own','مسئول'],['ph','فاز'],['bb','فصل برندبوک']],f.g)+
    chips('own',[['all','همه']].concat(humans().map(function(p){ return [p.id,p.name]; })).concat([['CL','Claude']]),f.own)+
    chips('st',[['open','باز'],['late','عقب‌افتاده'],['week','این هفته'],['p0','مسیر بحرانی'],['done','انجام‌شده'],['all','همه']],f.st)+'</div>';
  var q=(f.q||'').trim();
  var L=M.tasks.filter(function(t){
    if(f.own!=='all'&&t.owner!==f.own) return false;
    if(f.st==='open'&&isClosed(t)) return false; if(f.st==='done'&&!isDone(t)) return false;
    if(f.st==='late'&&!(t.due!=null&&t.due<TODAY&&!isClosed(t))) return false;
    if(f.st==='week'&&!(t.due!=null&&t.due>=TODAY&&t.due<=TODAY+7&&!isClosed(t))) return false;
    if(f.st==='p0'&&!(t.prio==='p0'&&!isClosed(t))) return false;
    if(q&&((t.t||'')+' '+(t.notes||'')+' '+t.id).indexOf(q)<0) return false; return true; }).sort(cmp);
  var groups=[], key, name, color;
  if(f.g==='svc') groups=(M.cfg.services||[]).map(function(s){ return {k:s.id,n:s.n,c:s.c,L:L.filter(function(t){ return t.svc===s.id; }),all:M.tasks.filter(function(t){ return t.svc===s.id; })}; });
  else if(f.g==='st') groups=(M.cfg.statuses||[]).map(function(s){ return {k:s.id,n:s.n,c:s.c,L:L.filter(function(t){ return t.status===s.id; })}; });
  else if(f.g==='own') groups=(M.cfg.people||[]).map(function(p){ return {k:p.id,n:p.name,c:p.color,L:L.filter(function(t){ return t.owner===p.id; })}; });
  else if(f.g==='ph') groups=(M.cfg.phases||[]).map(function(p){ return {k:p.id,n:p.n,c:p.c,L:L.filter(function(t){ var x=phaseOf(t); return x&&x.id===p.id; })}; }).concat([{k:'none',n:'بدون تاریخ',c:'#999',L:L.filter(function(t){ return !phaseOf(t); })}]);
  else { var B=['راهنما','Raw Brand Notes','بازار و رقبا','سکوی برند','محصول و منو','هویت کلامی','هویت بصری','دیجیتال و محتوا','ابزار تصمیم','بسته‌بندی','فضای فیزیکی','شخصیت‌ها','ارجاع عملیاتی'];
    groups=B.map(function(b,i){ return {k:i,n:'فصل '+fa(i)+' · '+b,c:'var(--red)',L:L.filter(function(t){ return t.bb===i; })}; }).concat([{k:'x',n:'خارج از برندبوک',c:'#999',L:L.filter(function(t){ return t.bb==null; })}]); }
  groups=groups.filter(function(g){ return g.L.length; });
  if(!groups.length) return h+'<div class="empty">با این فیلتر تسکی پیدا نشد.</div>';
  h+=groups.map(function(g){
    var all=g.all||g.L, dn=all.filter(isDone).length, collapsed=ui.open['g'+g.k];
    var body='';
    if(f.g==='svc'){ var stages=[]; g.L.forEach(function(t){ var s=t.stage||''; if(stages.indexOf(s)<0) stages.push(s); });
      body=stages.map(function(s){ return (s?'<div class="stg">'+esc(s)+'</div>':'')+'<ul class="tl">'+g.L.filter(function(t){ return (t.stage||'')===s; }).map(function(t){ return trow(t,{nosvc:1}); }).join('')+'</ul>'; }).join(''); }
    else body='<ul class="tl">'+g.L.map(function(t){ return trow(t); }).join('')+'</ul>';
    return '<section class="panel svcb"><div class="svch" data-act="more" data-v="g'+esc(g.k)+'" style="--c:'+esc(g.c)+'"><span class="nm">'+esc(g.n)+'</span><span class="sp"></span>'+(g.all?'<span class="pr"><i style="width:'+(all.length?Math.round(100*dn/all.length):0)+'%"></i></span><span class="cnt">'+fa(dn)+'/'+fa(all.length)+' انجام</span>':'<span class="cnt">'+fa(g.L.length)+'</span>')+'</div>'+(collapsed?'':body)+'</section>';
  }).join('');

};

/* ---------- تقویم ---------- */
function calMode(){ return ui.cal.mode || (window.innerWidth<700?'ag':'mo'); }
VIEWS.cal=function(){
  var mode=calMode(); if(ui.cal.y==null){ var x=d2j(TODAY); ui.cal.y=x.jy; ui.cal.m=x.jm; }
  var h='<div class="bar2"><h1 class="h1" style="margin-inline-end:auto">تقویم</h1><div class="chips"><button class="chip" data-act="calmode" data-v="ag" aria-pressed="'+(mode==='ag')+'">روزبه‌روز</button><button class="chip" data-act="calmode" data-v="mo" aria-pressed="'+(mode==='mo')+'">ماه</button></div></div>';
  var byDay={}; M.tasks.forEach(function(t){ if(t.due!=null){ (byDay[t.due]=byDay[t.due]||[]).push(t); } });
  if(mode==='ag'){
    h+='<p class="muted small">کارهای باز ۲۱ روز آینده بر اساس موعد. عقب‌افتاده‌ها بالای فهرست.</p>';
    var late=M.tasks.filter(function(t){ return t.due!=null&&t.due<TODAY&&!isClosed(t); }).sort(cmp);
    if(late.length) h+='<div class="panel ag-day"><h4 style="color:var(--late)">عقب‌افتاده <small>'+fa(late.length)+'</small></h4><ul class="tl">'+late.map(function(t){ return trow(t); }).join('')+'</ul></div>';
    for(var d=TODAY; d<TODAY+21; d++){ var L=(byDay[d]||[]).filter(function(t){ return !isClosed(t); }).sort(cmp); if(!L.length&&wd(d)>4) continue;
      h+='<div class="panel ag-day'+(d===TODAY?' today':'')+'"><h4>'+(d===TODAY?'امروز · ':d===TODAY+1?'فردا · ':'')+WD[wd(d)]+' <small>'+jd(d)+(d===OPEN?' · افتتاحیه':'')+'</small></h4>'+(L.length?'<ul class="tl">'+L.map(function(t){ return trow(t); }).join('')+'</ul>':'<div class="muted small">موعدی نیست</div>')+'</div>'; }
    return h;
  }
  var y=ui.cal.y, m=ui.cal.m, first=j2d(y,m,1), len=monthLen(y,m), lead=wd(first);
  h+='<div class="bar2"><button class="btn sm" data-act="calnav" data-v="-1">ماه قبل</button><b style="font:400 20px var(--fd)">'+MONTHS[m-1]+' '+fa(y)+'</b><button class="btn sm" data-act="calnav" data-v="1">ماه بعد</button><button class="btn sm ghost" data-act="calnav" data-v="0">امروز</button><span class="muted small">'+(matchMedia('(pointer:fine)').matches?'برای تغییر موعد، تسک را بکشید و روی روز دیگر رها کنید.':'برای تغییر موعد، تسک را باز کنید.')+'</span></div>';
  h+='<div style="overflow-x:auto"><div class="cal" style="min-width:640px">'+WDS.map(function(w){ return '<div class="wd">'+w+'</div>'; }).join('');
  for(var i=0;i<lead;i++) h+='<div class="cell off"></div>';
  for(var k=0;k<len;k++){ var dd=first+k, L2=(byDay[dd]||[]).slice().sort(function(a,b){ return (a.type==='gate'?-1:0)-(b.type==='gate'?-1:0)||cmp(a,b); });
    h+='<div class="cell'+(dd===TODAY?' today':'')+(wd(dd)>=5?' fri':'')+'" data-day="'+dd+'"><div class="dn"><span>'+fa(k+1)+'</span>'+(dd===OPEN?'<span style="color:var(--red)">افتتاحیه</span>':'')+'</div>'+

      (L2.length>5?'<button class="lnk" data-act="calday" data-v="'+dd+'">+'+fa(L2.length-5)+' دیگر</button>':'')+'</div>'; }
  h+='</div></div>';
  if(ui.cal.day!=null){ var LL=(byDay[ui.cal.day]||[]).sort(cmp); h+='<div class="panel" style="margin-top:12px"><h2 class="h2">'+jfull(ui.cal.day)+'</h2><ul class="tl">'+LL.map(function(t){ return trow(t); }).join('')+'</ul></div>'; }
