<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#D5222B"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-32.png"><link rel="apple-touch-icon" href="icon-180.png">
<title>تقویم محتوای سوسیسا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;600;700;800&display=swap">
<style>
/* مرجع زندهٔ تقویم محتوا: تقویم دیواری، کارت بستهٔ ماه (دسته و سهمیه)، تأیید چهارمرحله‌ای. مبلغ هرگز در این مخزن نیست: فقط دستگاه و ولت خصوصی. */
:root{
  --red:#D5222B;--red2:#A9161E;--cream:#FDF0D7;--must:#F09E00;--carb:#2C2C2C;
  --bg:#EFE3CB;--paper:#FFF9EC;--paper2:#FDF0D7;--ink:#2C2C2C;--mute:#75664F;--line:#E4D3B2;--fri:#FBE6BD;
  --ok:#1F7A4D;--okb:#DDF1E5;--warnb:#FCEBCB;--warn:#9A5C00;--fixb:#FBDEDC;
  --sh:0 1px 0 rgba(44,44,44,.14),0 14px 30px -20px rgba(44,20,0,.55);
  --disp:"Lalezar","Vazirmatn",Tahoma,sans-serif;--body:"Vazirmatn",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171310;--paper:#25201A;--paper2:#2F281F;--ink:#FBF0DC;--mute:#BCA98A;--line:#42382B;--fri:#3A2E1B;--okb:#17331F;--warnb:#3A2A10;--warn:#F2B64B;--fixb:#431A1A;--ok:#6CCB97}}
:root[data-theme="dark"]{--bg:#171310;--paper:#25201A;--paper2:#2F281F;--ink:#FBF0DC;--mute:#BCA98A;--line:#42382B;--fri:#3A2E1B;--okb:#17331F;--warnb:#3A2A10;--warn:#F2B64B;--fixb:#431A1A;--ok:#6CCB97}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2.5px solid var(--must);outline-offset:1px}
a{color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:14px 16px 90px}
.topbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:12px}
.btn{border:1.5px solid var(--ink);background:var(--paper);border-radius:9px;padding:5px 11px;font-weight:700;font-size:13.5px;text-decoration:none;white-space:nowrap;box-shadow:2px 2px 0 var(--ink)}
.btn:hover{background:var(--paper2)}.btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.btn.pri{background:var(--red);color:#fff;border-color:var(--carb);box-shadow:2px 2px 0 var(--carb)}.btn.pri:hover{background:var(--red2)}
.btn.ghost{border-color:transparent;box-shadow:none;background:transparent}
.btn[aria-pressed="true"]{background:var(--carb);color:var(--cream);border-color:var(--carb)}
.sp{flex:1}
.status{font-size:12.5px;color:var(--mute)}.status.err{color:var(--red);font-weight:700}
.banner{border:1.5px dashed var(--mute);border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:13.5px;background:var(--paper)}
.banner.mv{position:sticky;top:6px;z-index:15;background:var(--must);color:#2C2C2C;border:1.5px solid var(--carb);font-weight:700;display:flex;gap:8px;align-items:center}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}
/* تقویم دیواری */
.cal{position:relative;background:var(--paper);border-radius:6px 6px 12px 12px;box-shadow:var(--sh);margin-top:12px}
.rings{position:absolute;top:-11px;inset-inline:0;height:24px;display:flex;justify-content:space-around;padding:0 7%;pointer-events:none;z-index:2}
.rings i{width:9px;height:24px;border-radius:5px;background:linear-gradient(90deg,#6c6c6c,#d9d9d9 45%,#555);box-shadow:0 2px 2px rgba(0,0,0,.4)}
.chead{position:relative;overflow:hidden;background:var(--red);color:var(--cream);padding:24px 20px 12px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;border-radius:6px 6px 0 0}
.chead:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(44,0,0,.26) 1.5px,transparent 1.7px);background-size:9px 9px;-webkit-mask-image:linear-gradient(115deg,transparent 45%,#000);mask-image:linear-gradient(115deg,transparent 45%,#000)}
.chead>*{position:relative}
.mname{font-family:var(--disp);font-size:clamp(40px,7vw,68px);line-height:.95}
.myear{font-family:var(--disp);font-size:22px;color:#FFD27A}
.mnav{display:flex;gap:6px;margin-inline-start:auto;align-items:center}
.mnav .btn{border-color:var(--carb);color:var(--carb);background:var(--cream);box-shadow:2px 2px 0 var(--carb)}
.wdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--carb);color:var(--cream);font-weight:700;font-size:13px;text-align:center}
.wdays div{padding:4px 0}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-inline-start:1px solid var(--line)}
.day{min-height:136px;border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 5px 8px;position:relative;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:default}
.day.fri{background:var(--fri)}
.day.hol .dn{color:var(--red)}.day.today.hol .dn{color:#fff}
.dq{font-size:10.5px;color:var(--mute);line-height:1}.dg{font-size:11px;color:var(--mute);font-weight:600;line-height:1;margin-inline-start:auto}
.evt{font-size:10.5px;line-height:1.3;color:var(--mute);font-weight:600}.evt.h{color:var(--red);font-weight:800}
.msub{font-size:14px;color:#FFE7BD;font-weight:600;width:100%;order:9}
.leaf{background:var(--paper);border:2px solid var(--carb);border-radius:6px 6px 14px 14px;box-shadow:4px 4px 0 var(--carb);position:relative;overflow:hidden}
.leaf:before{content:"";display:block;height:12px;background:radial-gradient(circle at 8px 6px,var(--bg) 4px,transparent 4.5px) 0 0/22px 12px,var(--carb)}
.lf-top{display:flex;justify-content:space-between;padding:6px 12px;background:var(--carb);color:var(--cream);font-size:13px;font-weight:700}
.leaf.hol .lf-top{background:var(--red);color:#fff}
.lf-n{font-family:var(--disp);font-size:86px;line-height:1;text-align:center;padding-top:10px;color:var(--ink)}.leaf.hol .lf-n{color:var(--red)}
.lf-wd{text-align:center;font-weight:800;font-size:17px;padding-bottom:8px;border-bottom:1.5px dashed var(--line)}.lf-wd small{display:block;font-weight:500;font-size:12.5px;color:var(--mute)}
.lf-b{padding:9px 12px 12px}.lf-ev{font-weight:700;font-size:13.5px;margin-bottom:5px}.lf-ev.h{color:var(--red)}.lf-ev small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.lf-m{font-size:12px;background:var(--carb);color:var(--cream);padding:3px 8px;border-radius:6px;margin-bottom:6px}
.lf-l{display:flex;flex-direction:column;gap:4px;margin-top:6px}.lf-l .tier{display:block;font-weight:500;font-size:11.5px;opacity:.85}
.xbtn{border:0;background:none;color:var(--mute);padding:0 4px}
.layout>main{grid-column:1;grid-row:1}.layout>.side{grid-column:2;grid-row:1/span 2}.layout>.occs{grid-column:1;grid-row:2;margin-top:0}
.occs{background:var(--paper);border-radius:10px;padding:12px 14px;margin-top:14px;box-shadow:var(--sh)}.occs h2{font-family:var(--disp);font-weight:400;font-size:22px;margin:0 0 6px;color:var(--red)}
.occ{display:grid;grid-template-columns:82px 1fr;gap:8px;width:100%;text-align:start;background:none;border:0;border-bottom:1px dashed var(--line);padding:5px 2px;font-size:13.5px}.occ:hover{background:var(--paper2)}.occ b{color:var(--mute);font-weight:700;font-size:12.5px}.occ.h b,.occ.h span{color:var(--red)}.occ em{font-style:normal;font-size:11px;font-weight:800}.occ small{display:block;color:var(--mute);font-size:12px}
.day.out{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(120,100,70,.08) 6px 7px)}
.day.past .dn{opacity:.55}
.dh{display:flex;align-items:center;gap:3px;min-height:30px}
.dn{font-family:var(--disp);font-size:24px;line-height:1;width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.day.today .dn{background:var(--red);color:#fff;transform:rotate(-6deg);box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--red)}
.ev{font-size:10.5px;font-weight:800;background:var(--carb);color:var(--cream);border-radius:4px;padding:0 5px;white-space:nowrap}
.dadd{margin-inline-start:auto;border:0;background:transparent;color:var(--mute);font-size:17px;line-height:1;width:24px;height:24px;border-radius:6px;opacity:0}
.day:hover .dadd,.dadd:focus-visible{opacity:1}.dadd:hover{background:var(--paper2);color:var(--red)}
.wmark{position:absolute;inset:0;border:2.5px dashed var(--red);pointer-events:none}
.wbadge{font-size:10.5px;color:var(--red);font-weight:800;line-height:1.3}
.day.over{outline:3px solid var(--must);outline-offset:-3px;background:var(--warnb)}
.moving .day{cursor:copy}.moving .day:hover{outline:3px solid var(--must);outline-offset:-3px}
.day.sel{box-shadow:inset 0 0 0 2px var(--carb)}
/* بلیط هر محتوا */
.tk{display:flex;align-items:flex-start;gap:4px;width:100%;text-align:start;font-size:12px;font-weight:700;line-height:1.35;padding:3px 6px;border-radius:5px;border:1.5px solid var(--carb);background:var(--paper);color:var(--ink);overflow:hidden}
.tk:hover{filter:brightness(.96);transform:translateY(-1px)}
.tk[draggable="true"]{cursor:grab}
.tk .tt{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tk .sdot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:3px;border:1.5px solid currentColor;background:transparent}
.sdot.ok{background:var(--ok);border-color:var(--ok)}.sdot.review{background:var(--must);border-color:var(--must)}.sdot.fix{background:var(--red);border-color:#fff}
.tk.t-reel-cine{background:var(--red);color:#fff;border-color:var(--carb);box-shadow:2px 2px 0 var(--carb)}
.tk.t-reel-simple{background:var(--paper);color:var(--red);border-color:var(--red)}
.tk.t-post-pro{background:var(--carb);color:var(--cream)}
.tk.t-post-graphic{background:var(--must);color:#2C2C2C}
.tk.t-post-simple{background:var(--paper2);color:var(--ink)}
.tk.t-story-general,.tk.t-story-count{border-style:dashed;font-weight:600;padding:1px 5px;font-size:11.5px;border-width:1px}
.tk.t-story-count{border-color:var(--must);color:var(--warn)}
.tk.t-none{border:1.5px dotted var(--red);background:var(--fixb)}
.tk.done{opacity:.62}.tk.done .tt{text-decoration:line-through;text-decoration-thickness:1px}
.tk.dim{opacity:.16}
.tk.dragging{opacity:.3}
/* کارت بسته */
.side{display:flex;flex-direction:column;gap:14px}
.pcard{background:var(--cream);color:#2C2C2C;border:2px solid var(--carb);border-radius:14px;padding:12px 14px;box-shadow:4px 4px 0 var(--carb)}
.pcard h2{font-family:var(--disp);font-weight:400;font-size:22px;margin:0;color:var(--red);line-height:1.2}
.pcard .sub{font-size:12px;color:#6b5c44;margin-bottom:6px}
.trow{display:block;width:100%;text-align:start;border:0;border-top:1px dashed #cdb98f;background:transparent;padding:7px 2px;color:inherit}
.trow:hover{background:rgba(240,158,0,.14)}.trow[aria-pressed="true"]{background:rgba(213,34,43,.13)}
.trow .n{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13.5px}
.swatch{width:13px;height:13px;border-radius:3px;border:1.5px solid var(--carb);flex:none}
.trow .cnt{margin-inline-start:auto;font-weight:700;font-size:12.5px;white-space:nowrap}
.trow .cnt.over{color:var(--red)}
.punch{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.punch i{width:15px;height:15px;border-radius:50%;border:1.5px dashed #9b8966;display:block}
.punch i.on{border:1.5px solid var(--red);background:var(--red);box-shadow:inset 0 0 0 2px var(--cream)}
.punch i.done{background:var(--carb);border-color:var(--carb)}
.punch i.ovr{background:var(--must);border-color:var(--carb);border-style:solid}
.ptot{border-top:2px solid var(--carb);margin-top:6px;padding-top:7px;font-size:13px;font-weight:700}
.ptot .big{font-family:var(--disp);font-size:20px;font-weight:400;color:var(--red)}
.note{font-size:12.5px;line-height:1.55;margin:6px 0 0}
.alert{font-size:12.5px;border-radius:8px;padding:5px 9px;background:var(--fixb);color:var(--ink);margin-top:6px;display:block;width:100%;text-align:start;border:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mute);margin:10px 2px 0}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend .sdot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--mute);display:inline-block}
.wk{font-family:var(--disp);font-size:18px;margin:16px 0 4px;color:var(--red)}
.ag{display:flex;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;box-shadow:0 1px 0 rgba(44,44,44,.1)}
.ag .d{flex:none;width:58px;text-align:center;font-size:11.5px;color:var(--mute);line-height:1.25}
.ag .d b{font-family:var(--disp);font-size:26px;font-weight:400;color:var(--ink);display:block}
.ag .l{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.ag .tk{font-size:13.5px;padding:6px 9px}.ag .tk .tt{-webkit-line-clamp:unset}
.ag .tier{font-weight:500;font-size:11.5px;opacity:.85;display:block}
/* برگهٔ جزئیات */
dialog{border:2px solid var(--carb);border-radius:16px;padding:0;max-width:640px;width:calc(100% - 24px);max-height:calc(100dvh - 24px);background:var(--paper);color:var(--ink);box-shadow:6px 6px 0 var(--carb)}
dialog::backdrop{background:rgba(25,12,5,.55)}
.sh{display:flex;gap:8px;align-items:flex-start;padding:12px 14px;background:var(--paper2);border-bottom:2px dashed var(--carb);position:sticky;top:0;z-index:2}
.sh h3{margin:0;font-family:var(--disp);font-weight:400;font-size:21px;line-height:1.3;flex:1;min-width:0}
.sb{padding:12px 14px 16px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12.5px;font-weight:700;color:var(--mute);margin-top:10px}
.fld input,.fld select,.fld textarea{border:1.5px solid var(--line);background:var(--paper2);border-radius:8px;padding:6px 9px;font-size:14.5px;font-weight:500;color:var(--ink);width:100%}
.fld textarea{min-height:82px;resize:vertical;line-height:1.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.spec{background:var(--cream);color:#2C2C2C;border:1.5px solid var(--carb);border-radius:10px;padding:9px 11px;font-size:13px;margin-top:8px;line-height:1.6}
.spec b{color:#A9161E}
.step{display:grid;grid-template-columns:96px 1fr;gap:6px;align-items:center;margin-top:6px;font-size:13.5px;font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:700}
.chip[data-v="ok"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.chip[data-v="review"][aria-pressed="true"]{background:var(--must);border-color:var(--must);color:#2C2C2C}
.chip[data-v="fix"][aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.chip[data-v="draft"][aria-pressed="true"]{background:var(--carb);border-color:var(--carb);color:var(--cream)}
.chip:disabled{opacity:.55}
.muted{color:var(--mute)}.small{font-size:12.5px}
.ask{background:var(--warnb);border-radius:8px;padding:7px 10px;font-size:13px;margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hist{font-size:12px;color:var(--mute);margin-top:8px}
.price{background:var(--warnb)!important}
.tedit{border-top:1px dashed var(--line);padding:8px 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--carb);color:var(--cream);padding:8px 14px;border-radius:99px;font-size:14px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 24px);display:flex;gap:10px;align-items:center}
.toast.on{opacity:1;pointer-events:auto}.toast button{background:none;border:0;color:#FFD27A;font-weight:800;padding:0}
#sheet{display:none}
.sheet{background:#fff;color:#2C2C2C;font-family:var(--body);width:1120px;padding:24px}
.sheet h2{font-family:var(--disp);font-weight:400;color:#D5222B;font-size:32px;margin:0}
.sheet table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
.sheet th{background:#2C2C2C;color:#FDF0D7;padding:5px 8px;text-align:right}
.sheet td{border-bottom:1px solid #E4D3B2;padding:5px 8px;vertical-align:top}
.sheet tr.w td{background:#FDF0D7;font-weight:800}
.sheet .cg{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid #2C2C2C;margin-top:10px;font-size:11px}
.sheet .cg>div{border:1px solid #E4D3B2;min-height:74px;padding:3px 4px}
.sheet .cg b{font-family:var(--disp);font-weight:400;font-size:17px;display:block}
.sheet .cg .h{background:#2C2C2C;color:#FDF0D7;min-height:0;text-align:center;font-weight:700}
.sheet .cg p{margin:1px 0;line-height:1.3}
.sheet .r{color:#D5222B;font-weight:700}.sheet .p{font-weight:700}.sheet .s{color:#666}
@media (max-width:1020px){.layout{grid-template-columns:minmax(0,1fr)}.layout>main,.layout>.side,.layout>.occs{grid-column:1;grid-row:auto}}
@media (max-width:760px){
  .wrap{padding:10px 16px 90px}.chead{padding:20px 12px 10px}.day{min-height:64px;padding:2px;align-items:center;cursor:pointer}
  .dh{min-height:0;justify-content:center}.dn{font-size:19px;width:27px;height:27px}.ev,.dadd,.wbadge,.evt,.dq{display:none}.dg{margin:0;font-size:9.5px}.dh{flex-wrap:wrap;gap:0}.day{min-height:68px}
  .day .tk{display:none}.ddots{display:flex!important}
  .two{grid-template-columns:1fr}.step{grid-template-columns:1fr}
  .wdays{font-size:11px}
}
.ddots{display:none;flex-wrap:wrap;justify-content:center;gap:2px;max-width:100%}
.ddots i{width:9px;height:9px;border-radius:2px;border:1px solid var(--carb);display:block}
@media print{
  @page{size:A4 landscape;margin:9mm}
  html,body{background:#fff}.wrap,.toast,dialog{display:none!important}
  #sheet{display:block!important}.sheet{width:auto;padding:0}.sheet tr{break-inside:avoid}.sheet .cg{break-after:page}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style></head><body>
<div class="wrap" id="wrap">
  <div class="topbar">
    <a class="btn" href="./">برد اصلی</a><a class="btn" href="content.html">برد محتوا</a>
    <span class="status" id="st"></span><span class="sp"></span>
    <button class="btn" data-act="view" id="vBtn">فهرست</button>
    <button class="btn" data-act="wait" id="wBtn">منتظر تأیید</button>
    <button class="btn" data-act="add" id="addBtn">+ محتوای تازه</button>
    <button class="btn" data-act="tiers" id="tierBtn">دسته‌ها و تعرفه</button>
    <button class="btn" data-act="imp" id="impBtn">نظر امیررضا</button>
    <button class="btn pri" data-act="send" id="sendBtn" hidden>فرستادن نظرها</button>
    <button class="btn" data-act="pdf">PDF</button><button class="btn" data-act="png">عکس</button>
  </div>
  <div id="app"><div class="banner">در حال خوندن برد…</div></div>
</div>
<div id="sheet"></div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script>
function div(a,b){return ~~(a/b)}function mod(a,b){return a-~~(a/b)*b}

/* ================= خروجی ================= */
function sheetHtml(){var m=curM(),p=m.split('/').map(Number),L=act().filter(function(i){return monthOf(i.date)===m}).sort(function(a,b){return a.date.localeCompare(b.date)}),by={},len=monthLen(p[0],p[1]),lead=satIdx(m+'/01'),g='';
  L.forEach(function(i){(by[i.date]=by[i.date]||[]).push(i)});
  ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنج‌شنبه','جمعه'].forEach(function(d){g+='<div class="h">'+d+'</div>'});
  for(var i=0;i<lead;i++)g+='<div></div>';
  for(var n=1;n<=len;n++){var d=m+'/'+pad(n);g+='<div><b>'+fa(n)+'</b>'+sortDay(by[d]||[]).map(function(x){return '<p class="'+x.type[0]+'">'+esc(x.title)+'</p>'}).join('')+'</div>'}
  var rows='';L.forEach(function(it){var pl=it.plan||{},t=tier(pl.ptype),a=apsOf(it);rows+='<tr><td>'+human(it.date)+'</td><td>'+esc(t?t.name:TYPES[it.type])+'</td><td><b>'+esc(it.title)+'</b>'+(pl.topic?'<br>'+esc(pl.topic):'')+'</td><td>'+esc((it.concept&&it.concept.text)||'')+'</td><td>'+APL[a.topic||'draft']+'</td><td>'+APL[a.concept||'draft']+(pl.note?'<br>'+esc(pl.note):'')+'</td></tr>'});
  return '<div class="sheet"><h2>تقویم محتوای سوسیسا · '+MN[p[1]-1]+' '+fa(p[0])+'</h2><div style="font-size:12.5px;color:#75664F">به‌روز: '+fa(nowStamp())+'</div><div class="cg">'+g+'</div><table><thead><tr><th style="width:110px">روز</th><th style="width:110px">دسته</th><th style="width:24%">عنوان و موضوع</th><th>کانسپت</th><th style="width:85px">موضوع</th><th style="width:105px">کانسپت</th></tr></thead><tbody>'+rows+'</tbody></table></div>'}
function buildSheet(){$('#sheet').innerHTML=sheetHtml()}
function loadH2C(){if(window.html2canvas)return Promise.resolve();return new Promise(function(res,rej){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';s.onload=res;s.onerror=function(){rej(new Error('ابزار عکس لود نشد'))};document.head.appendChild(s)})}
function png(){buildSheet();var sh=$('#sheet');setSt('ساخت عکس…');
  loadH2C().then(function(){sh.style.cssText='display:block;position:absolute;left:-99999px;top:0';return window.html2canvas(sh.firstChild,{scale:2,backgroundColor:'#fff'})})
  .then(function(cv){sh.style.cssText='';cv.toBlob(function(b){var name='susisa-content-calendar-'+curM().replace('/','-')+'.png',file=new File([b],name,{type:'image/png'});setSt('');
    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(function(){});return}
    var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()},'image/png')})
  .catch(function(e){sh.style.cssText='';setSt(e.message,true)})}
function snapshot(auto){if(!CAN||(auto&&!dirtySnap))return;dirtySnap=false;
  var css=[].slice.call(document.querySelectorAll('style')).map(function(s){return s.textContent}).join('\n');
  var doc='<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقویم محتوای سوسیسا</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;700;800&display=swap"><style>'+css+'\n#sheet{display:block}</style></head><body><div id="sheet">'+sheetHtml()+'</div></body></html>';
  var fid='f'+Date.now().toString(16).slice(-8)+Math.floor(Math.random()*46656).toString(16),path='files/'+fid+'-taghvim-mohtava.html';
  putFile(path,doc,'content-plan: snapshot').then(function(){return mutateJson('data/tasks.json','content-plan: snapshot file',function(docs){var t=docs[PLAN_TASK];if(!t)return false;var fs=t.files||[],ex=fs.filter(function(f){return f.name===SNAP_NAME&&f.kind==='gh'})[0];
      var ent={id:fid,kind:'gh',name:SNAP_NAME,type:'text/html',size:new Blob([doc]).size,path:path,by:'M',at:Date.now()};
      if(ex){var old=Object.assign({},ex);delete old.vers;ent.vers=[old].concat(ex.vers||[]);fs[fs.indexOf(ex)]=ent}else fs.push(ent);t.files=fs;t.upd=Date.now();return true})}).catch(function(){dirtySnap=true})}

/* ================= شروع ================= */
function boot(){setSt('خوندن برد…');
  Promise.all([readJson('data/content_items.json'),readJson('data/content_meta.json'),loadPrices()]).then(function(r){items=r[0].docs;meta=r[1].docs;setSt('');render();
    var o=new URLSearchParams(location.search).get('open');if(o&&items[o]){ui.month=monthOf(items[o].date)||ui.month;render();openItem(o)}},
    function(e){$('#app').innerHTML='<div class="banner">برد خونده نشد: '+esc(e.message)+'</div>';setSt('',true)})}
setInterval(function(){if(Object.keys(pend).length||$('#dlg').open||moving||dragId||(document.activeElement&&/TEXTAREA|INPUT/.test(document.activeElement.tagName)))return;readJson('data/content_items.json').then(function(r){if(!Object.keys(pend).length&&!$('#dlg').open&&JSON.stringify(r.docs)!==JSON.stringify(items)){items=r.docs;render()}}).catch(function(){})},45000);
boot();
</script></body></html>
